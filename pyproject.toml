[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-reporting-tool"
version = "0.1.0"
description = "Accuracy-first expense reporting app with OCR review workflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.4",
  "openpyxl>=3.1.5",
  "reportlab>=4.2.2",
  "pypdf>=4.3.1",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
ocr = [
  "pillow>=10.4.0",
  "pytesseract>=0.3.13",
]
test = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.setuptools]
packages = ["expense_reporting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
