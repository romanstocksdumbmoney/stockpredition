<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neon Slugger Deluxe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --header-h: 88px;
      }

      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #7ecbff;
        font-family: "Press Start 2P", monospace;
        color: #111;
      }

      #root {
        position: relative;
        background: #7ecbff;
      }

      .top-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        background: linear-gradient(rgba(138, 210, 255, 0.9), rgba(112, 197, 255, 0.82));
        border-bottom: 4px solid rgba(45, 111, 159, 0.85);
      }

      .title {
        position: absolute;
        left: 16px;
        color: #ffffff;
        text-shadow: 3px 3px 0 #1a4e74;
        font-size: clamp(11px, 1.2vw, 17px);
        letter-spacing: 1px;
      }

      .scoreboard {
        background: #ffffff;
        border: 4px solid #3a89b5;
        border-radius: 16px;
        padding: 8px 16px;
        display: grid;
        gap: 6px;
        min-width: min(780px, 92vw);
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
      }

      .score-row,
      .count-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
      }

      .team {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .chip {
        padding: 4px 8px;
        border-radius: 8px;
        border: 2px solid #111;
        color: #fff;
        font-size: 11px;
      }

      .chip.red {
        background: #ef3d3d;
      }

      .chip.blue {
        background: #3b66ff;
      }

      .score-num {
        font-size: 18px;
      }

      .score-num.red-num {
        color: #d33131;
      }

      .score-num.blue-num {
        color: #2f57f0;
      }

      .score-mid {
        font-size: 10px;
        color: #13354f;
      }

      .score-divider {
        color: #3f6f93;
        font-size: 14px;
      }

      .mini {
        font-size: 10px;
        color: #13354f;
      }

      .base-diamond {
        position: relative;
        width: 30px;
        height: 24px;
        margin-left: 8px;
        border-left: 1px solid #7f8fa4;
        padding-left: 10px;
      }

      .base-diamond::before,
      .base-diamond::after {
        content: "";
        position: absolute;
        left: 10px;
        top: 3px;
        width: 12px;
        height: 12px;
        border: 1.5px solid #8f99a7;
        transform: rotate(45deg);
      }

      .diamond-dot {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #8b96a3;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
      }

      .diamond-dot.occupied {
        background: #ffd84d;
        box-shadow: 0 0 8px rgba(255, 216, 77, 0.92);
      }

      .dot-second { left: 16px; top: -1px; }
      .dot-third { left: 7px; top: 8px; }
      .dot-first { left: 25px; top: 8px; }
      .dot-home { left: 16px; top: 17px; background: #666f7c; }

      .field-wrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #7ecbff;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      .mobile-swing {
        position: absolute;
        right: 18px;
        bottom: 18px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 4px solid #111;
        background: radial-gradient(circle at 35% 30%, #fff6ac, #f5a623);
        color: #111;
        font-family: "Press Start 2P", monospace;
        font-size: 13px;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
        touch-action: manipulation;
        transition: transform 120ms ease, opacity 140ms ease;
      }

      .mobile-swing:active {
        transform: translateY(2px);
      }

      .mobile-swing.active {
        animation: swingPulse 1.05s ease-in-out infinite;
        opacity: 1;
      }

      .mobile-swing.locked {
        opacity: 0.38;
        filter: grayscale(0.58);
        pointer-events: none;
      }

      @keyframes swingPulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); }
      }

      .game-over {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: rgba(255, 255, 255, 0.76);
        z-index: 5;
      }

      .game-over h2 {
        font-size: clamp(18px, 2.2vw, 34px);
        color: #1b3551;
        text-shadow: 2px 2px 0 #fff;
        margin: 0;
      }

      .game-over button {
        font-family: inherit;
        font-size: 12px;
        border: 4px solid #111;
        border-radius: 12px;
        padding: 12px 20px;
        background: #fff;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .top-header {
          justify-content: center;
          padding: 6px 8px;
        }

        .scoreboard {
          min-width: 0;
          width: min(96vw, 760px);
        }

        .title {
          position: static;
          margin-right: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <header class="top-header">
        <div class="title">NEON SLUGGER DELUXE</div>
        <div class="scoreboard">
          <div class="score-row">
            <div class="team">
              <span class="chip red">COMETS</span>
              <span id="scoreComets" class="score-num red-num">0</span>
            </div>
            <span class="score-divider">—</span>
            <div class="score-mid"><span id="inning">INNING 1</span> • <span id="half">TOP</span></div>
            <span class="score-divider">—</span>
            <div class="team">
              <span id="scoreFoxes" class="score-num blue-num">0</span>
              <span class="chip blue">FOXES</span>
            </div>
          </div>
          <div class="count-row mini">
            <span>B: <strong id="balls">0</strong></span>
            <span>S: <strong id="strikes">0</strong></span>
            <span>O: <strong id="outs">0</strong></span>
            <span>|</span>
            <span>PITCH: <strong id="pitchType">FASTBALL</strong></span>
            <div class="base-diamond" aria-label="Baserunner diamond">
              <span id="baseDotSecond" class="diamond-dot dot-second"></span>
              <span id="baseDotThird" class="diamond-dot dot-third"></span>
              <span id="baseDotFirst" class="diamond-dot dot-first"></span>
              <span class="diamond-dot dot-home"></span>
            </div>
          </div>
        </div>
      </header>

      <section class="field-wrap" id="fieldWrap">
        <canvas id="gameCanvas" width="1280" height="720" aria-label="Neon Slugger Deluxe"></canvas>

        <button id="swingButton" class="mobile-swing" type="button">SWING</button>

        <div id="gameOver" class="game-over">
          <h2 id="winnerText">GAME OVER</h2>
          <button id="restartButton" type="button">PLAY AGAIN</button>
        </div>
      </section>
    </div>

    <script>
      (() => {
        const VIRTUAL_WIDTH = 1280;
        const VIRTUAL_HEIGHT = 720;
        const SKY_BAND_Y = Math.round(VIRTUAL_HEIGHT * 0.35);
        const FIELD = {
          left: 36,
          right: 1244,
          top: 84,
          bottom: 708,
          wallY: Math.round(VIRTUAL_HEIGHT * 0.2)
        };
        const BASES = {
          home: { x: 640, y: 676 },
          first: { x: 980, y: 548 },
          second: { x: 640, y: 396 },
          third: { x: 300, y: 548 },
          mound: { x: 640, y: 514 }
        };
        const PHASE = {
          PITCHING: "PITCHING",
          PITCH_FLIGHT: "PITCH_FLIGHT",
          BATTING_WINDOW: "BATTING_WINDOW",
          RESULT: "RESULT",
          FIELDING: "FIELDING",
          NEXT_BATTER: "NEXT_BATTER",
          INNING_TRANSITION: "INNING_TRANSITION",
          GAME_OVER: "GAME_OVER"
        };
        const FIELDER_STATE = {
          IDLE: "IDLE",
          REACTING: "REACTING",
          RUNNING: "RUNNING",
          FIELDING: "FIELDING",
          THROWING: "THROWING",
          FOLLOW_THROUGH: "FOLLOW_THROUGH",
          RETURNING: "RETURNING"
        };
        const RUNNER_STATE = {
          HOLDING: "HOLDING",
          LEADING: "LEADING",
          RUNNING: "RUNNING",
          SLIDING: "SLIDING",
          SCORING: "SCORING",
          OUT: "OUT"
        };

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const fieldWrap = document.getElementById("fieldWrap");
        const swingButton = document.getElementById("swingButton");
        const gameOverOverlay = document.getElementById("gameOver");
        const winnerText = document.getElementById("winnerText");
        const restartButton = document.getElementById("restartButton");

        const scoreComets = document.getElementById("scoreComets");
        const scoreFoxes = document.getElementById("scoreFoxes");
        const inningEl = document.getElementById("inning");
        const halfEl = document.getElementById("half");
        const ballsEl = document.getElementById("balls");
        const strikesEl = document.getElementById("strikes");
        const outsEl = document.getElementById("outs");
        const pitchTypeEl = document.getElementById("pitchType");
        const baseDotFirst = document.getElementById("baseDotFirst");
        const baseDotSecond = document.getElementById("baseDotSecond");
        const baseDotThird = document.getElementById("baseDotThird");

        const input = {
          keysHeld: new Set(),
          keysPressed: new Set(),
          swingPressedThisFrame: false
        };

        const pitchTypes = {
          FASTBALL: { targetDuration: 0.7, curveAmount: 0, curveStyle: "none", color: "#ffffff" },
          CHANGEUP: { targetDuration: 1.1, curveAmount: 0, curveStyle: "none", color: "#e8ffff" },
          CURVEBALL: { targetDuration: 0.9, curveAmount: -92, curveStyle: "arc", color: "#fff6d2" },
          SLIDER: { targetDuration: 0.85, curveAmount: 74, curveStyle: "late", color: "#fef6ff" }
        };
        const pitchTypeKeys = ["FASTBALL", "CURVEBALL", "CHANGEUP", "SLIDER"];
        const GROUND_GRAVITY = 750;
        const FENCE_HEIGHT_Z = 24;
        const WALL_BOTTOM_Y = FIELD.wallY + 26;
        const WARNING_TRACK_TOP_Y = WALL_BOTTOM_Y;
        const WARNING_TRACK_BOTTOM_Y = WALL_BOTTOM_Y + 14;
        const FOUL_POLE_LEFT_X = 84;
        const FOUL_POLE_RIGHT_X = VIRTUAL_WIDTH - 84;
        const INFIELD_SPLIT_Y = BASES.second.y + 34;

        const game = {
          inning: 1,
          half: "TOP",
          outs: 0,
          balls: 0,
          strikes: 0,
          score: { comets: 0, foxes: 0 },
          phase: PHASE.NEXT_BATTER,
          phaseTimer: 0,
          lockInput: false,
          transitionText: "",
          statusText: "",
          pitchType: "FASTBALL",
          pitchAim: 0,
          swingUsed: false,
          pitchActive: false,
          hitDetected: false,
          throwActive: false,
          selectedFielder: null,
          ballInPlayTime: 0,
          ballDeadTime: 0,
          playResultTimeout: null,
          lastAction: "-",
          pitchBall: null,
          battedBall: null,
          throwBall: null,
          runnerProgress: 0,
          runnerTargetBase: 1,
          runnerAnims: [],
          baseRunners: [null, null, null],
          nextRunnerId: 1,
          popupTexts: [],
          particles: [],
          fireworks: [],
          flashAlpha: 0,
          shake: 0,
          debugVisible: false,
          winner: "",
          crowd: [],
          crowdWaveTimer: 2.4,
          crowdJump: 0,
          crowdMoodDown: 0,
          fieldingPlan: null,
          throwMeta: null
        };

        const players = {
          batter: { id: "batter", team: "red", x: 712, y: 664, baseX: 712, baseY: 664, anim: { bobPhase: 1.3, missWobble: 0, vx: 0, vy: 0, runToFirst: 0 }, swing: 0, role: "batter" },
          defense: []
        };

        const defenseDefaults = [
          { role: "pitcher", x: 640, y: 514 },
          { role: "catcher", x: 640, y: 694 },
          { role: "first", x: 945, y: 518 },
          { role: "second", x: 760, y: 430 },
          { role: "shortstop", x: 520, y: 430 },
          { role: "third", x: 335, y: 518 },
          { role: "left", x: 220, y: 290 },
          { role: "center", x: 640, y: 242 },
          { role: "right", x: 1060, y: 290 }
        ];

        let audioCtx = null;
        let ambientSource = null;
        let ambientGain = null;

        function initPlayers() {
          if (game.crowd.length === 0) initCrowd();
          players.defense = defenseDefaults.map((p, idx) => ({
            id: `def-${idx}`,
            team: "blue",
            role: p.role,
            x: p.x,
            y: Math.max(p.y, FIELD.wallY + 25),
            baseX: p.x,
            baseY: Math.max(p.y, FIELD.wallY + 25),
            frame: 0,
            hasBall: false,
            isAnimating: false,
            anim: {
              state: FIELDER_STATE.IDLE,
              stateTimer: 0,
              bobPhase: Math.random() * Math.PI * 2,
              shiftTimer: 2 + Math.random() * 2.6,
              shiftDir: 0,
              shiftX: 0,
              runFrame: 0,
              armsUp: 0,
              readyLeanY: 0,
              vx: 0,
              vy: 0,
              dive: 0,
              checkTimer: 0
            }
          }));
          resetAllFielderStates();
        }

        function resetPlayersToDefaultPositions() {
          players.batter.x = players.batter.baseX;
          players.batter.y = players.batter.baseY;
          players.batter.swing = 0;
          for (const f of players.defense) {
            f.x = f.baseX;
            f.y = f.baseY;
            f.hasBall = false;
            f.isAnimating = false;
            if (f.anim) {
              f.anim.state = FIELDER_STATE.IDLE;
              f.anim.stateTimer = 0;
              f.anim.vx = 0;
              f.anim.vy = 0;
              f.anim.dive = 0;
            }
          }
          if (players.defense.length < 9) initPlayers();
        }

        function clampPlayer(p) {
          p.x = Math.max(FIELD.left + 16, Math.min(FIELD.right - 16, p.x));
          p.y = Math.max(FIELD.wallY + 26, Math.min(FIELD.bottom + 16, p.y));
        }

        function initCrowd() {
          const colors = ["#ff5757", "#4ea8ff", "#ffd84d", "#f5f5f5", "#7dff86", "#f1a6ff"];
          game.crowd = [];
          for (let i = 0; i < 960; i += 1) {
            game.crowd.push({ color: colors[i % colors.length], wave: 0 });
          }
          game.crowdWaveTimer = 2.4;
          game.crowdJump = 0;
          game.crowdMoodDown = 0;
        }

        function makeRunner(baseIndex = 0) {
          const id = `runner-${game.nextRunnerId}`;
          game.nextRunnerId += 1;
          return {
            id,
            team: game.half === "TOP" ? "red" : "blue",
            state: RUNNER_STATE.HOLDING,
            baseIndex,
            lead: 0,
            fade: 1
          };
        }

        function resetAllFielderStates(exceptIndex = -1) {
          for (let i = 0; i < players.defense.length; i += 1) {
            if (i === exceptIndex) continue;
            const f = players.defense[i];
            if (!f.anim) continue;
            f.anim.state = FIELDER_STATE.IDLE;
            f.anim.stateTimer = 0;
            f.isAnimating = false;
          }
        }

        function setPrimaryFielderState(index, state, duration = 0) {
          if (index == null || index < 0 || index >= players.defense.length) return;
          resetAllFielderStates(index);
          const f = players.defense[index];
          if (!f.anim) return;
          f.anim.state = state;
          f.anim.stateTimer = duration;
          f.isAnimating = state !== FIELDER_STATE.IDLE;
        }

        function setStatus(text) {
          game.statusText = text;
        }

        function setAction(_title, _sub, _color = "#23b7ff") {}

        function updateScoreboard() {
          scoreComets.textContent = String(game.score.comets);
          scoreFoxes.textContent = String(game.score.foxes);
          inningEl.textContent = `INNING ${game.inning}`;
          halfEl.textContent = game.half;
          ballsEl.textContent = String(game.balls);
          strikesEl.textContent = String(game.strikes);
          outsEl.textContent = String(game.outs);
          pitchTypeEl.textContent = game.pitchType;
          baseDotFirst?.classList.toggle("occupied", Boolean(game.baseRunners[0]));
          baseDotSecond?.classList.toggle("occupied", Boolean(game.baseRunners[1]));
          baseDotThird?.classList.toggle("occupied", Boolean(game.baseRunners[2]));
        }

        function randomPitchType() {
          return pitchTypeKeys[Math.floor(Math.random() * pitchTypeKeys.length)];
        }

        function choosePitchTypeFromKey(key) {
          if (key === "1") game.pitchType = "FASTBALL";
          if (key === "2") game.pitchType = "CHANGEUP";
          if (key === "3") game.pitchType = "CURVEBALL";
          if (key === "4") game.pitchType = "SLIDER";
        }

        function beginPitch() {
          game.pitchType = randomPitchType();
          game.pitchActive = true;
          game.swingUsed = false;
          game.phase = PHASE.PITCHING;
          game.phaseTimer = 0;
          game.lastAction = `Pitch prep ${game.pitchType}`;
          setAction("PITCH NOW", "CPU winds up...", "#29b7ff");
          setStatus(`CPU selected ${game.pitchType}. Get ready to swing.`);
          updateScoreboard();
        }

        function throwPitch() {
          const cfg = pitchTypes[game.pitchType];
          const startX = BASES.mound.x;
          const startY = BASES.mound.y - 14;
          const endX = BASES.home.x + game.pitchAim * 54;
          const endY = BASES.home.y - 12;
          const dist = Math.hypot(endX - startX, endY - startY);
          const duration = cfg.targetDuration;
          const pitchSpeed = dist / duration;
          game.pitchBall = {
            x: startX,
            y: startY,
            z: 10,
            startX,
            startY,
            endX,
            endY,
            t: 0,
            duration,
            speed: pitchSpeed,
            curveAmount: cfg.curveAmount,
            curveStyle: cfg.curveStyle,
            color: cfg.color,
            trail: []
          };
          game.phase = PHASE.PITCH_FLIGHT;
          game.phaseTimer = 0;
          game.lastAction = `Pitch thrown ${game.pitchType}`;
          setAction("SWING NOW", "SPACE or SWING button", "#ffb542");
          setStatus("Swing now!");
          updateScoreboard();
        }

        function registerSwing() {
          input.swingPressedThisFrame = true;
        }

        function swingAtPitch() {
          if (!game.pitchBall || game.swingUsed) return;
          game.swingUsed = true;
          players.batter.swing = 0.3;
          game.lastAction = "Swing";
          resumeAudio();

          const ideal = 0.78;
          const t = game.pitchBall.t;
          const diff = t - ideal;
          const abs = Math.abs(diff);
          const closeToPlate = Math.abs(game.pitchBall.y - (BASES.home.y - 10)) < 38;
          const timingOffsetMs = diff * (game.pitchBall.duration * 1000);

          if (!closeToPlate || abs > 0.24) {
            spawnPopup("STRIKE!", "#ff5252");
            playStrikeMiss();
            players.batter.anim = players.batter.anim || {};
            players.batter.anim.missWobble = 0.14;
            addStrike("Swing and miss. Strike!");
            return;
          }

          if (timingOffsetMs < -40) {
            registerFoulBall("Pulled foul left.");
            return;
          }
          if (timingOffsetMs > 40) {
            registerFoulBall("Pushed foul right.");
            return;
          }

          if (abs <= 0.05) {
            spawnPopup("PERFECT!", "#ffea5d");
            playBatCrack();
            launchHit("PERFECT", timingOffsetMs);
            return;
          }

          if (abs <= 0.13) {
            spawnPopup("GOOD HIT!", "#6eff95");
            playBatCrack();
            launchHit("GOOD", timingOffsetMs);
            return;
          }

          if (abs <= 0.21) {
            spawnPopup("WEAK CONTACT", "#d8ffc0");
            playBatCrack();
            launchHit("WEAK", timingOffsetMs);
            return;
          }

          spawnPopup("STRIKE!", "#ff7a7a");
          playStrikeMiss();
          addStrike("Late swing. Strike!");
        }

        function launchHit(quality, timingOffsetMs = 0) {
          const nearX = game.pitchBall ? game.pitchBall.x : BASES.home.x;
          const nearY = game.pitchBall ? game.pitchBall.y : BASES.home.y;
          const timing = Math.abs((game.pitchBall?.t ?? 0.8) - 0.78);
          const accuracy = Math.max(0, 1 - timing / 0.24);
          const power = Math.round(accuracy * 100);
          game.hitDetected = true;
          game.phase = PHASE.FIELDING;
          players.batter.anim = players.batter.anim || {};
          players.batter.anim.watchBall = 0.55;
          players.batter.anim.runToFirst = 0.95;
          game.phaseTimer = 0;
          game.ballInPlayTime = 0;
          game.ballDeadTime = 0;

          let directionOffsetDeg = 0;
          if (timingOffsetMs < -20) directionOffsetDeg = -28;
          else if (timingOffsetMs < -5) directionOffsetDeg = -14;
          else if (timingOffsetMs > 20) directionOffsetDeg = 28;
          else if (timingOffsetMs > 5) directionOffsetDeg = 14;

          const baseDirection = Math.atan2(BASES.second.y - BASES.home.y, BASES.second.x - BASES.home.x);
          const direction = baseDirection + directionOffsetDeg * (Math.PI / 180) + (Math.random() * 0.18 - 0.09);

          let launchAngle = 10;
          let speed = 420;
          let hitType = "line";

          if (quality === "PERFECT") {
            launchAngle = 38 + Math.random() * 8;
            speed = 640;
            hitType = "fly";
          } else if (quality === "GOOD") {
            launchAngle = 16 + Math.random() * 14;
            speed = 520;
            hitType = Math.random() < 0.28 ? "ground" : "fly";
          } else {
            launchAngle = -2 + Math.random() * 8;
            speed = 340;
            hitType = launchAngle < 3 ? "ground" : "popup";
          }

          if (Math.abs(timingOffsetMs) > 18 && quality !== "PERFECT") {
            hitType = "ground";
            launchAngle = Math.max(-6, launchAngle - 8);
          }

          const angleRad = launchAngle * Math.PI / 180;
          const powerScale = 0.45 + (power / 100) * 0.55;
          const horizontal = speed * powerScale;
          const vz = Math.sin(angleRad) * 640;
          const forward = Math.cos(angleRad) * horizontal;

          game.battedBall = {
            x: nearX,
            y: nearY,
            z: 8,
            vx: Math.cos(direction) * forward,
            vy: Math.sin(direction) * forward,
            vz,
            bounces: 0,
            quality,
            hitType,
            timingOffsetMs,
            trail: [],
            fielded: false,
            overWall: false,
            liveTime: 0,
            apex: 8,
            wallContactCooldown: 0,
            warningTrackTouched: false,
            caromed: false,
            stuckAtWall: false
          };

          const landing = predictLandingPoint(game.battedBall);
          game.battedBall.landingX = landing.x;
          game.battedBall.landingY = landing.y;
          game.battedBall.landingTime = landing.time;

          game.pitchBall = null;
          game.fieldingPlan = makeFieldingPlan(landing.x, landing.y, quality, game.battedBall.hitType);
          game.selectedFielder = game.fieldingPlan.primaryIndex;
          setPrimaryFielderState(game.selectedFielder, FIELDER_STATE.REACTING, 0.12);
          game.runnerProgress = 0;
          game.runnerTargetBase = quality === "PERFECT" ? 4 : quality === "GOOD" ? (Math.random() < 0.45 ? 2 : 1) : 1;
          game.lastAction = `${quality} contact`;
          setAction("FIELD THE BALL", "WASD move • Q/F/E/R throw", "#5adf8f");
          setStatus(`${quality}! Field the ball.`);
          spawnHitSparks(nearX, nearY);
        }

        function findNearestFielder(x, y, roles = null) {
          let best = -1;
          let bestD = Infinity;
          for (let i = 0; i < players.defense.length; i += 1) {
            const f = players.defense[i];
            if (roles && !roles.includes(f.role)) continue;
            const d = (f.x - x) ** 2 + (f.y - y) ** 2;
            if (d < bestD) {
              bestD = d;
              best = i;
            }
          }
          return best >= 0 ? best : 0;
        }

        function getDefenseIndexByRole(role) {
          return players.defense.findIndex((f) => f.role === role);
        }

        function getDefenseByRole(role) {
          return players.defense.find((f) => f.role === role) || null;
        }

        function predictLandingPoint(ball) {
          const vz = ball.vz;
          const z0 = Math.max(0, ball.z);
          const time = Math.max(0.12, (vz + Math.sqrt(vz * vz + 2 * GROUND_GRAVITY * z0)) / GROUND_GRAVITY);
          return {
            time,
            x: Math.max(FIELD.left + 18, Math.min(FIELD.right - 18, ball.x + ball.vx * time)),
            y: Math.max(FIELD.wallY + 2, Math.min(FIELD.bottom - 8, ball.y + ball.vy * time))
          };
        }

        function getResponsibleFielder(landingX, landingY, isGroundBall) {
          if (isGroundBall) {
            if (landingX < BASES.third.x + 30) return "third";
            if (landingX < BASES.mound.x) return "shortstop";
            if (landingX > BASES.first.x - 30) return "first";
            return "second";
          }
          const fw = VIRTUAL_WIDTH;
          if (landingX < fw * 0.33) return "left";
          if (landingX < fw * 0.66) return "center";
          return "right";
        }

        function choosePrimaryRoleFromLanding(landingX, landingY, isInfield) {
          const role = getResponsibleFielder(landingX, landingY, isInfield);
          if (isInfield) {
            const pitcherOnly = Math.hypot(landingX - BASES.mound.x, landingY - BASES.mound.y) < 70;
            if (pitcherOnly) return "pitcher";
          }
          return role;
        }

        function makeFieldingPlan(landingX, landingY, quality, hitType) {
          const isInfield = landingY >= INFIELD_SPLIT_Y;
          const primaryRole = choosePrimaryRoleFromLanding(landingX, landingY, isInfield);
          const primaryIndex = getDefenseIndexByRole(primaryRole);
          const supportTargets = {};

          for (const f of players.defense) {
            supportTargets[f.role] = { x: f.baseX, y: f.baseY, speed: 38 };
          }

          if (isInfield) {
            if (primaryRole === "shortstop") {
              supportTargets.second = { x: BASES.second.x, y: BASES.second.y + 12, speed: 44 };
              supportTargets.first = { x: BASES.first.x - 4, y: BASES.first.y + 8, speed: 22 };
            } else if (primaryRole === "third") {
              supportTargets.shortstop = { x: BASES.third.x + 86, y: BASES.third.y - 28, speed: 44 };
            } else if (primaryRole === "second") {
              supportTargets.shortstop = { x: BASES.second.x - 84, y: BASES.second.y + 8, speed: 40 };
            }
          } else {
            const cutoffRole = landingX < BASES.mound.x ? "shortstop" : "second";
            const cutX = landingX + (BASES.second.x - landingX) * 0.44;
            const cutY = landingY + (BASES.second.y - landingY) * 0.44;
            supportTargets[cutoffRole] = { x: cutX, y: cutY, speed: 18 };
            if (primaryRole === "left") {
              supportTargets.center = { x: BASES.mound.x - 20, y: getDefenseByRole("center")?.baseY ?? 250, speed: 16 };
            } else if (primaryRole === "right") {
              supportTargets.center = { x: BASES.mound.x + 20, y: getDefenseByRole("center")?.baseY ?? 250, speed: 16 };
            } else {
              supportTargets.left = { x: (getDefenseByRole("left")?.baseX ?? 220) + 12, y: getDefenseByRole("left")?.baseY ?? 290, speed: 14 };
              supportTargets.right = { x: (getDefenseByRole("right")?.baseX ?? 1060) - 12, y: getDefenseByRole("right")?.baseY ?? 290, speed: 14 };
            }
          }

          return {
            landingX,
            landingY,
            isInfield,
            isOutfield: !isInfield,
            quality,
            hitType,
            primaryRole,
            primaryIndex,
            supportTargets,
            relayRole: landingX < BASES.mound.x ? "shortstop" : "second"
          };
        }

        function rerouteOutfieldChaser(targetX, targetY) {
          const outfieldIdx = findNearestFielder(targetX, targetY, ["left", "center", "right"]);
          const primary = players.defense[outfieldIdx];
          if (!primary) return;
          if (!game.fieldingPlan) {
            game.fieldingPlan = makeFieldingPlan(targetX, targetY, "GOOD", "fly");
          }
          game.fieldingPlan.primaryRole = primary.role;
          game.fieldingPlan.primaryIndex = outfieldIdx;
          game.fieldingPlan.isInfield = false;
          game.fieldingPlan.isOutfield = true;
          game.fieldingPlan.landingX = targetX;
          game.fieldingPlan.landingY = targetY;
          game.selectedFielder = outfieldIdx;

          for (const f of players.defense) {
            game.fieldingPlan.supportTargets[f.role] = { x: f.baseX, y: f.baseY, speed: 14 };
          }
          if (primary.role === "left") {
            game.fieldingPlan.supportTargets.center = { x: (getDefenseByRole("center")?.baseX ?? BASES.mound.x) - 20, y: getDefenseByRole("center")?.baseY ?? 240, speed: 16 };
          } else if (primary.role === "right") {
            game.fieldingPlan.supportTargets.center = { x: (getDefenseByRole("center")?.baseX ?? BASES.mound.x) + 20, y: getDefenseByRole("center")?.baseY ?? 240, speed: 16 };
          }
        }

        function foulLineXAtY(y, side) {
          const fenceY = WARNING_TRACK_BOTTOM_Y;
          const t = Math.max(0, Math.min(1, (BASES.home.y - y) / (BASES.home.y - fenceY)));
          const endX = side === "left" ? FOUL_POLE_LEFT_X : FOUL_POLE_RIGHT_X;
          return BASES.home.x + (endX - BASES.home.x) * t;
        }

        function ballIsFoul(ball) {
          if (ball.y <= INFIELD_SPLIT_Y) {
            const lx = foulLineXAtY(ball.y, "left");
            const rx = foulLineXAtY(ball.y, "right");
            if (ball.x < lx - 10 || ball.x > rx + 10) return true;
          }
          if (ball.y <= WALL_BOTTOM_Y + 1 && (ball.x < FOUL_POLE_LEFT_X || ball.x > FOUL_POLE_RIGHT_X)) {
            return true;
          }
          return false;
        }

        function registerFoulBall(message = "Foul ball.") {
          game.strikes = Math.min(2, game.strikes + 1);
          updateScoreboard();
          spawnPopup("FOUL", "#ffd084");
          completePlay(message);
        }

        function addStrike(msg) {
          game.strikes += 1;
          if (game.strikes >= 3) {
            game.strikes = 0;
            game.balls = 0;
            game.outs += 1;
            game.shake = 0.28;
            spawnPopup("STRIKEOUT!", "#ff5757");
            triggerCrowdStrikeout();
            completePlay("Strike three! Batter out.");
            if (game.outs >= 3) {
              scheduleHalfInningSwitch();
            }
          } else {
            completePlay(msg);
          }
          updateScoreboard();
        }

        function addBall() {
          game.balls += 1;
          if (game.balls >= 4) {
            game.balls = 0;
            game.strikes = 0;
            advanceRunners(1, "walk");
            completePlay("Ball four. Walk.");
          } else {
            completePlay("Ball.");
          }
          updateScoreboard();
        }

        function scheduleHalfInningSwitch() {
          game.transitionText = `INNING ${game.inning} - ${game.half === "TOP" ? "BOTTOM" : "TOP"}`;
        }

        function switchHalfInningIfNeeded() {
          if (game.outs < 3) return;
          game.outs = 0;
          game.balls = 0;
          game.strikes = 0;
          game.baseRunners = [null, null, null];
          if (game.half === "TOP") {
            game.half = "BOT";
          } else {
            game.half = "TOP";
            game.inning += 1;
          }
          if (game.inning > 9) {
            endGame();
            return;
          }
          game.phase = PHASE.INNING_TRANSITION;
          game.phaseTimer = 0;
          game.transitionText = `INNING ${game.inning} - ${game.half}`;
          updateScoreboard();
        }

        function endGame() {
          game.phase = PHASE.GAME_OVER;
          game.lockInput = true;
          game.winner = game.score.comets === game.score.foxes
            ? "TIE GAME!"
            : (game.score.comets > game.score.foxes ? "COMETS WIN!" : "FOXES WIN!");
          winnerText.textContent = game.winner;
          gameOverOverlay.style.display = "flex";
          spawnFireworks(640, 240, 80);
        }

        function completePlay(message) {
          if (game.phase === PHASE.RESULT || game.phase === PHASE.NEXT_BATTER || game.phase === PHASE.INNING_TRANSITION) return;
          if (game.playResultTimeout) {
            clearTimeout(game.playResultTimeout);
            game.playResultTimeout = null;
          }
          game.phase = PHASE.RESULT;
          game.lockInput = true;
          resetAllFielderStates(-1);
          game.phaseTimer = 0;
          setStatus(message);
          game.lastAction = message;
          spawnPopup(playResultCallout(message), "#ffffff", {
            kind: "result",
            duration: 1.4,
            size: 72
          });

          game.playResultTimeout = setTimeout(() => {
            game.playResultTimeout = null;
            resetForNextPitch();
          }, 1000);
        }

        function playResultCallout(message) {
          const m = (message || "").toLowerCase();
          if (m.includes("home run")) return "HOME RUN!";
          if (m.includes("strike")) return "STRIKE!";
          if (m.includes("ball four") || m.includes("walk")) return "WALK";
          if (m === "ball." || m.startsWith("ball")) return "BALL";
          if (m.includes("foul")) return "FOUL";
          if (m.includes("safe")) return "SAFE!";
          if (m.includes("out")) return "OUT!";
          if (m.includes("dead")) return "DEAD BALL";
          if (m.includes("ended")) return "PLAY OVER";
          if (m.includes("hit")) return "HIT!";
          return String(message || "PLAY").toUpperCase();
        }

        function resetForNextPitch() {
          game.phase = PHASE.NEXT_BATTER;
          game.phaseTimer = 0;
          game.lockInput = false;
          game.pitchBall = null;
          game.battedBall = null;
          game.throwBall = null;
          game.pitchActive = false;
          game.hitDetected = false;
          game.throwActive = false;
          game.swingUsed = false;
          game.selectedFielder = null;
          game.ballInPlayTime = 0;
          game.ballDeadTime = 0;
          game.runnerProgress = 0;
          game.runnerAnims.length = 0;
          game.transitionText = "";
          game.fieldingPlan = null;
          game.throwMeta = null;
          game.baseRunners = game.baseRunners.map((r, idx) => (r ? { ...r, state: RUNNER_STATE.HOLDING, baseIndex: idx, lead: 0 } : null));
          resetPlayersToDefaultPositions();
          clearInputFlags();
          switchHalfInningIfNeeded();
          if (game.phase === PHASE.GAME_OVER || game.phase === PHASE.INNING_TRANSITION) return;
          setAction("PITCH NOW", "CPU preparing next pitch", "#28b7ff");
          setStatus("PITCH NOW: Press SPACE or SWING to bat.");
          updateScoreboard();
        }

        function clearInputFlags() {
          input.keysPressed.clear();
          input.swingPressedThisFrame = false;
        }

        function advanceRunners(basesToAdvance, reason = "hit") {
          if (reason === "walk") {
            advanceRunnersOnWalk();
            return;
          }

          let runs = 0;
          const next = [null, null, null];
          const current = [...game.baseRunners];

          for (let i = 2; i >= 0; i -= 1) {
            const runner = current[i];
            if (!runner) continue;
            const movedRunner = { ...runner, state: RUNNER_STATE.RUNNING, baseIndex: Math.min(3, i + basesToAdvance), lead: 0 };
            const dest = i + basesToAdvance;
            if (dest >= 3) {
              runs += 1;
              game.runnerAnims.push(makeRunnerAnim(i, 3, movedRunner));
            } else {
              next[dest] = movedRunner;
              game.runnerAnims.push(makeRunnerAnim(i, dest, movedRunner));
            }
          }

          if (basesToAdvance >= 4) {
            runs += 1;
            game.runnerAnims.push(makeRunnerAnim(-1, 3, makeRunner(3)));
          } else {
            const batterRunner = makeRunner(Math.max(0, basesToAdvance - 1));
            next[basesToAdvance - 1] = batterRunner;
            game.runnerAnims.push(makeRunnerAnim(-1, basesToAdvance - 1, batterRunner));
          }

          game.baseRunners = next;
          if (runs > 0) {
            game.score.comets += runs;
            spawnPopup(`+${runs} RUN`, "#ffe86f", { x: BASES.home.x, y: BASES.home.y - 40, size: 40 });
            game.flashAlpha = 0.25;
          }
          if (reason === "homer") {
            playCrowdCheer();
            spawnFireworks(640, 240, 36);
          }
          updateScoreboard();
        }

        function advanceRunnersOnWalk() {
          let runs = 0;
          const next = [...game.baseRunners];

          if (next[0] && next[1] && next[2]) {
            runs += 1;
            game.runnerAnims.push(makeRunnerAnim(2, 3, { ...next[2], state: RUNNER_STATE.SCORING }));
            next[2] = null;
          }
          if (next[1] && next[0]) {
            game.runnerAnims.push(makeRunnerAnim(1, 2, { ...next[1], state: RUNNER_STATE.RUNNING }));
            next[2] = { ...next[1], baseIndex: 2, lead: 0 };
            next[1] = null;
          }
          if (next[0]) {
            game.runnerAnims.push(makeRunnerAnim(0, 1, { ...next[0], state: RUNNER_STATE.RUNNING }));
            next[1] = { ...next[0], baseIndex: 1, lead: 0 };
            next[0] = null;
          }

          const batterRunner = makeRunner(0);
          next[0] = batterRunner;
          game.runnerAnims.push(makeRunnerAnim(-1, 0, batterRunner));

          game.baseRunners = next;
          if (runs > 0) {
            game.score.comets += runs;
            spawnPopup(`+${runs} RUN`, "#ffe86f", { x: BASES.home.x, y: BASES.home.y - 40, size: 40 });
            game.flashAlpha = 0.22;
          }
          updateScoreboard();
        }

        function makeRunnerAnim(fromBaseIndex, toBaseIndex, runner) {
          const points = [BASES.home, BASES.first, BASES.second, BASES.third, BASES.home];
          const fromPoint = fromBaseIndex < 0 ? points[0] : points[fromBaseIndex + 1];
          const toPoint = toBaseIndex >= 3 ? points[4] : points[toBaseIndex + 1];
          const midX = (fromPoint.x + toPoint.x) * 0.5;
          const midY = (fromPoint.y + toPoint.y) * 0.5;
          const curve = toBaseIndex === 3 ? -20 : 24;
          return {
            runner: runner ? { ...runner } : makeRunner(toBaseIndex),
            fromX: fromPoint.x,
            fromY: fromPoint.y,
            cx: midX + (toPoint.x - fromPoint.x) * 0.18,
            cy: midY + curve,
            toX: toPoint.x,
            toY: toPoint.y,
            t: 0,
            duration: fromBaseIndex < 0 ? 1.2 : 1.05,
            slide: Math.random() < 0.35 && toBaseIndex > 0 && toBaseIndex < 3,
            toBaseIndex
          };
        }

        function spawnPopup(text, color, options = {}) {
          const kind = options.kind || "float";
          game.popupTexts.push({
            text,
            color,
            x: options.x ?? (VIRTUAL_WIDTH * 0.5),
            y: options.y ?? (VIRTUAL_HEIGHT * 0.48),
            kind,
            size: options.size ?? (kind === "result" ? 72 : 36),
            age: 0,
            duration: options.duration ?? (kind === "result" ? 1.4 : 1.0)
          });
        }

        function spawnHitSparks(x, y) {
          for (let i = 0; i < 14; i += 1) {
            const a = Math.random() * Math.PI * 2;
            const s = 90 + Math.random() * 180;
            game.particles.push({
              x,
              y,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s,
              life: 0.4 + Math.random() * 0.3,
              color: i % 2 === 0 ? "#ffe66e" : "#ffffff",
              size: 2 + Math.random() * 3
            });
          }
        }

        function spawnFireworks(x, y, count) {
          for (let i = 0; i < count; i += 1) {
            const a = Math.random() * Math.PI * 2;
            const s = 80 + Math.random() * 240;
            game.fireworks.push({
              x,
              y,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s - 40,
              life: 0.8 + Math.random() * 1.1,
              color: ["#ff5a5a", "#fef45b", "#50d6ff", "#7dff86"][Math.floor(Math.random() * 4)],
              size: 2 + Math.random() * 3
            });
          }
        }

        function updatePitch(dt) {
          if (!game.pitchBall) return;
          const b = game.pitchBall;
          b.t += dt / b.duration;
          const t = Math.min(1, b.t);
          let curveOffset = 0;
          if (b.curveStyle === "arc") {
            curveOffset = Math.sin(Math.PI * t) * b.curveAmount;
          } else if (b.curveStyle === "late") {
            const lateBreak = Math.max(0, (t - 0.58) / 0.42);
            curveOffset = (Math.sin(Math.PI * t) * 0.12 + lateBreak * lateBreak) * b.curveAmount;
          }
          b.x = b.startX + (b.endX - b.startX) * t + curveOffset;
          b.y = b.startY + (b.endY - b.startY) * t;
          b.z = Math.sin(Math.PI * t) * 24 + 4;

          b.trail.push({ x: b.x, y: b.y, z: b.z, a: 0.7 });
          if (b.trail.length > 4) b.trail.shift();

          if (game.phase === PHASE.PITCH_FLIGHT && t > 0.58) {
            game.phase = PHASE.BATTING_WINDOW;
          }

          if (t >= 1) {
            const inZone = Math.abs(b.endX - BASES.home.x) < 26;
            game.pitchBall = null;
            if (!game.swingUsed) {
              if (inZone) addStrike("Called strike.");
              else addBall();
            }
          }
        }

        function updateBattedBall(dt) {
          const b = game.battedBall;
          if (!b) return;

          b.liveTime = (b.liveTime || 0) + dt;
          b.wallContactCooldown = Math.max(0, (b.wallContactCooldown || 0) - dt);

          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.z += b.vz * dt;
          b.vz -= GROUND_GRAVITY * dt;
          b.apex = Math.max(b.apex || 0, b.z);

          b.vx *= b.z > 0.5 ? 0.995 : 0.986;
          b.vy *= b.z > 0.5 ? 0.995 : 0.986;
          b.trail.push({ x: b.x, y: b.y, z: b.z, a: 0.55 });
          if (b.trail.length > 5) b.trail.shift();

          if (!Number.isFinite(b.x) || !Number.isFinite(b.y) || !Number.isFinite(b.z)) {
            resetForNextPitch();
            return;
          }

          if (ballIsFoul(b)) {
            registerFoulBall("Foul ball.");
            return;
          }

          if (b.z <= 0) {
            b.z = 0;
            b.bounces += 1;
            if (Math.abs(b.vz) > 42) {
              b.vz = Math.abs(b.vz) * 0.55;
              b.vx *= 0.86;
              b.vy *= 0.86;
            } else {
              b.vz = 0;
              b.vx *= 0.96;
              b.vy *= 0.96;
            }
            if (b.hitType === "fly" && !b.warningTrackTouched && b.y <= WARNING_TRACK_BOTTOM_Y + 2) {
              b.warningTrackTouched = true;
            }
          }

          const fencePlaneY = WALL_BOTTOM_Y + 1;
          if (b.y <= fencePlaneY && b.wallContactCooldown <= 0) {
            const insidePoles = b.x >= FOUL_POLE_LEFT_X && b.x <= FOUL_POLE_RIGHT_X;
            if (!insidePoles) {
              registerFoulBall("Foul ball out of play.");
              return;
            }

            const aboveTop = b.z > FENCE_HEIGHT_Z;
            const topEdge = Math.abs(b.z - FENCE_HEIGHT_Z) <= 4;
            const strongArc = aboveTop && (b.apex || 0) > FENCE_HEIGHT_Z + 10 && b.vy < -20;

            if (strongArc || (topEdge && Math.random() < 0.5 && (b.apex || 0) > FENCE_HEIGHT_Z + 7)) {
              b.overWall = true;
              game.flashAlpha = 0.45;
              triggerCrowdHomeRun();
              advanceRunners(4, "homer");
              completePlay("HOME RUN!");
              return;
            }

            b.wallContactCooldown = 0.24;
            b.y = fencePlaneY + 1;

            if (b.z <= 2 && Math.hypot(b.vx, b.vy) < 170) {
              b.vx *= 0.2;
              b.vy = 0;
              b.vz = 0;
              b.stuckAtWall = true;
            } else {
              b.vy = Math.abs(b.vy) * 0.4 + 30;
              b.vx = b.vx * (0.45 + Math.random() * 0.15);
              b.vz = Math.max(20, Math.abs(b.vz) * 0.3);
              b.caromed = true;
              rerouteOutfieldChaser(b.x, b.y);
            }
          }

          if (b.y < fencePlaneY && b.z <= 1) {
            b.y = fencePlaneY;
            b.vy = Math.max(0, b.vy);
          }

          if (game.phase === PHASE.FIELDING) {
            game.ballInPlayTime += dt;
            if (game.ballInPlayTime > 8) {
              completePlay("Play ended. Ready for next pitch.");
              return;
            }
            const speed = Math.hypot(b.vx, b.vy) + Math.abs(b.vz);
            if (speed < 13 && b.z <= 0.1) {
              game.ballDeadTime += dt;
              if (game.ballDeadTime > 1.5) {
                completePlay("Ball dead. Ready for next pitch.");
                return;
              }
            } else {
              game.ballDeadTime = 0;
            }
          }
        }

        function updateFielding(dt) {
          if (game.phase !== PHASE.FIELDING || !game.battedBall) return;
          const ball = game.battedBall;
          if (!game.fieldingPlan) {
            const plan = makeFieldingPlan(ball.landingX ?? ball.x, ball.landingY ?? ball.y, ball.quality ?? "GOOD", ball.hitType ?? "ground");
            game.fieldingPlan = plan;
            game.selectedFielder = plan.primaryIndex;
            setPrimaryFielderState(plan.primaryIndex, FIELDER_STATE.REACTING, 0.12);
          }

          const primaryIndex = game.fieldingPlan.primaryIndex ?? game.selectedFielder ?? 0;
          const selected = players.defense[primaryIndex];
          if (!selected || selected.role === "catcher") return;

          if (!ball.fielded) {
            const timeToLanding = (ball.landingTime ?? 0.75) - (ball.liveTime ?? 0);
            const chaseX = ball.z > 4 ? (game.fieldingPlan.landingX ?? ball.x) : ball.x;
            const chaseY = ball.z > 4 ? (game.fieldingPlan.landingY ?? ball.y) : ball.y;
            let speed = game.fieldingPlan.isOutfield ? 255 : 232;
            if (game.fieldingPlan.isOutfield && selected.y <= WALL_BOTTOM_Y + 28) {
              speed *= 0.72;
            }

            setPrimaryFielderState(primaryIndex, FIELDER_STATE.RUNNING, 0);

            const dx = chaseX - selected.x;
            const dy = chaseY - selected.y;
            const d = Math.hypot(dx, dy);
            if (d > 2) {
              const vx = (dx / d) * speed;
              const vy = (dy / d) * speed;
              selected.x += vx * dt;
              selected.y += vy * dt;
              if (selected.anim) { selected.anim.vx = vx; selected.anim.vy = vy; }
            } else if (selected.anim) {
              selected.anim.vx = 0;
              selected.anim.vy = 0;
            }
            clampPlayer(selected);

            const distToBall = Math.hypot(selected.x - ball.x, selected.y - ball.y);
            const canCatch = ball.z < 13 || ball.bounces > 0;
            if (ball.z > 6 && Math.abs(timeToLanding) <= 0.2 && distToBall < 24 && ball.vz < 0) {
              if (selected.anim) selected.anim.dive = 0.42;
              setPrimaryFielderState(primaryIndex, FIELDER_STATE.FIELDING, 0.2);
              game.outs += 1;
              updateScoreboard();
              completePlay("Diving catch! Batter out.");
              if (game.outs >= 3) scheduleHalfInningSwitch();
              return;
            }

            if (distToBall < 20 && canCatch) {
              ball.fielded = true;
              selected.hasBall = true;
              if (selected.anim) selected.anim.armsUp = 0.45;
              setPrimaryFielderState(primaryIndex, FIELDER_STATE.FIELDING, 0.2);
              playCatchThud();
              setStatus("Ball fielded. Throw in progress...");
              game.phaseTimer = 0;
            } else if (ball.bounces < 1 && ball.z > 10 && distToBall < 18) {
              game.outs += 1;
              updateScoreboard();
              completePlay("Caught! Batter out.");
              if (game.outs >= 3) scheduleHalfInningSwitch();
              return;
            }
          } else {
            ball.x = selected.x;
            ball.y = selected.y - 8;
            ball.z = 8;
            game.phaseTimer += dt;
            const manualThrow = getThrowBaseTarget();
            const autoThrow = game.phaseTimer > 0.65 ? chooseAutoThrowTarget(selected, game.fieldingPlan) : null;
            if (manualThrow || autoThrow) {
              doThrowToBase(manualThrow || autoThrow, selected, ball);
            }
          }
        }

        function chooseAutoThrowTarget(fielder, plan) {
          if (!plan) return "first";
          if (plan.isInfield) {
            if (game.baseRunners[0]) return "second";
            return "first";
          }
          if (game.runnerTargetBase >= 3) return "cutoff-home";
          if (game.runnerTargetBase >= 2) return "second";
          return "cutoff-second";
        }

        function getThrowBaseTarget() {
          if (input.keysPressed.has("q")) return "first";
          if (input.keysPressed.has("f")) return "second";
          if (input.keysPressed.has("e")) return "third";
          if (input.keysPressed.has("r")) return "home";
          return null;
        }

        function doThrowToBase(baseKey, fielder, ball) {
          let targetX = BASES.first.x;
          let targetY = BASES.first.y - 8;
          let receiverRole = "first";
          let relayTo = null;

          if (baseKey in BASES) {
            targetX = BASES[baseKey].x;
            targetY = BASES[baseKey].y - 8;
            receiverRole = baseKey === "first" ? "first"
              : baseKey === "second" ? "second"
              : baseKey === "third" ? "third"
              : "catcher";
          } else if (baseKey.startsWith("cutoff")) {
            receiverRole = game.fieldingPlan?.relayRole || "second";
            const cutoff = getDefenseByRole(receiverRole);
            targetX = cutoff?.x ?? BASES.second.x;
            targetY = (cutoff?.y ?? BASES.second.y) - 8;
            relayTo = baseKey === "cutoff-home" ? "home" : "second";
          }

          game.throwActive = true;
          const throwerIndex = players.defense.findIndex((f) => f.id === fielder.id);
          game.throwMeta = {
            baseKey,
            receiverRole,
            receiverIndex: getDefenseIndexByRole(receiverRole),
            relayTo,
            throwerIndex
          };

          setPrimaryFielderState(throwerIndex, FIELDER_STATE.THROWING, 0.24);
          game.throwBall = {
            fromX: fielder.x,
            fromY: fielder.y - 8,
            toX: targetX,
            toY: targetY,
            t: 0,
            duration: 0.5 + Math.random() * 0.15,
            z: 6,
            trail: []
          };
          fielder.hasBall = false;
          ball.fielded = false;
          if (fielder.anim) fielder.anim.armsUp = 0.25;
          game.lastAction = `Throw to ${baseKey}`;
          setStatus(`Throwing to ${baseKey.toUpperCase()}...`);
        }

        function updateThrow(dt) {
          if (!game.throwBall) return;
          game.throwBall.t += dt / game.throwBall.duration;
          const t = Math.min(1, game.throwBall.t);

          if (!game.battedBall) {
            game.battedBall = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, bounces: 2, trail: [] };
          }
          const tx = game.throwBall.fromX + (game.throwBall.toX - game.throwBall.fromX) * t;
          const ty = game.throwBall.fromY + (game.throwBall.toY - game.throwBall.fromY) * t;
          game.throwBall.x = tx;
          game.throwBall.y = ty;
          game.throwBall.z = 10 - Math.abs(0.5 - t) * 12;
          game.throwBall.trail.push({ x: tx, y: ty, z: game.throwBall.z, a: 0.5 });
          if (game.throwBall.trail.length > 3) game.throwBall.trail.shift();
          game.battedBall.x = tx;
          game.battedBall.y = ty;
          game.battedBall.z = game.throwBall.z;

          if (t < 1) return;

          const meta = game.throwMeta || {};
          const receiver = players.defense[meta.receiverIndex ?? -1];
          if (receiver?.anim) {
            receiver.anim.armsUp = 0.36;
            receiver.anim.checkTimer = 0.36;
          }

          if (meta.relayTo) {
            const relayFrom = receiver || players.defense[findNearestFielder(tx, ty)];
            if (relayFrom) {
              const relayIdx = players.defense.findIndex((f) => f.id === relayFrom.id);
              setPrimaryFielderState(relayIdx, FIELDER_STATE.THROWING, 0.22);
              game.throwMeta = {
                baseKey: meta.relayTo,
                receiverRole: meta.relayTo === "home" ? "catcher" : "second",
                receiverIndex: getDefenseIndexByRole(meta.relayTo === "home" ? "catcher" : "second"),
                relayTo: null,
                throwerIndex: relayIdx
              };
              game.throwBall = {
                fromX: relayFrom.x,
                fromY: relayFrom.y - 8,
                toX: BASES[meta.relayTo].x,
                toY: BASES[meta.relayTo].y - 8,
                t: 0,
                duration: 0.42,
                z: 7,
                trail: []
              };
              setStatus(`Relay to ${meta.relayTo.toUpperCase()}!`);
              return;
            }
          }

          setPrimaryFielderState(meta.throwerIndex ?? game.selectedFielder ?? 0, FIELDER_STATE.FOLLOW_THROUGH, 0.32);
          game.throwBall = null;
          game.throwActive = false;
          resolveThrowOutcome();
        }

        function resolveThrowOutcome() {
          const target = game.throwMeta?.baseKey || "first";
          let safeChance = 0.5;
          if (target === "first") safeChance = 0.4;
          else if (target === "second") safeChance = game.baseRunners[0] ? 0.48 : 0.58;
          else if (target === "third") safeChance = 0.56;
          else if (target === "home") safeChance = 0.64;

          const throwerIdx = game.throwMeta?.throwerIndex ?? game.selectedFielder ?? 0;
          const safe = Math.random() < safeChance;
          game.throwMeta = null;
          setPrimaryFielderState(throwerIdx, FIELDER_STATE.FOLLOW_THROUGH, 0.28);

          if (safe) {
            advanceRunners(game.runnerTargetBase, "hit");
            const msg = target === "home" ? "Runner safe at home." : target === "second" ? "Safe at second." : "Runner safe.";
            completePlay(msg);
          } else {
            game.outs += 1;
            updateScoreboard();
            const msg = target === "second" ? "Force out at second."
              : target === "home" ? "Out at the plate."
              : target === "third" ? "Out at third."
              : "Out at first.";
            completePlay(msg);
            if (game.outs >= 3) scheduleHalfInningSwitch();
          }
        }

        function updateRunnerAnims(dt) {
          for (let i = game.runnerAnims.length - 1; i >= 0; i -= 1) {
            const r = game.runnerAnims[i];
            r.t += dt / r.duration;
            if (r.runner) {
              if (r.t >= 1) {
                if (r.toBaseIndex >= 3) {
                  r.runner.state = RUNNER_STATE.SCORING;
                } else {
                  r.runner.state = RUNNER_STATE.HOLDING;
                  r.runner.baseIndex = r.toBaseIndex;
                  r.runner.lead = 0;
                }
              } else {
                r.runner.state = RUNNER_STATE.RUNNING;
              }
            }
            if (r.t >= 1) game.runnerAnims.splice(i, 1);
          }
        }

        function updateCrowd(dt) {
          game.crowdWaveTimer -= dt;
          if (game.crowdWaveTimer <= 0) {
            game.crowdWaveTimer = 2 + Math.random() * 1.2;
            const count = 8 + Math.floor(Math.random() * 5);
            for (let i = 0; i < count; i += 1) {
              const idx = Math.floor(Math.random() * game.crowd.length);
              if (game.crowd[idx]) game.crowd[idx].wave = 0.42;
            }
          }

          for (const fan of game.crowd) {
            if (fan.wave > 0) fan.wave = Math.max(0, fan.wave - dt);
          }

          if (game.crowdJump > 0) game.crowdJump = Math.max(0, game.crowdJump - dt * 2.4);
          if (game.crowdMoodDown > 0) game.crowdMoodDown = Math.max(0, game.crowdMoodDown - dt * 2.2);
        }

        function triggerCrowdHomeRun() {
          game.crowdJump = 1;
          for (const fan of game.crowd) fan.wave = 0.4;
          for (let i = 0; i < 120; i += 1) {
            game.particles.push({
              x: Math.random() * VIRTUAL_WIDTH,
              y: SKY_BAND_Y - 10 - Math.random() * 60,
              vx: -40 + Math.random() * 80,
              vy: 40 + Math.random() * 140,
              life: 1.2 + Math.random() * 0.8,
              color: ["#ff5a5a", "#fef45b", "#50d6ff", "#7dff86", "#ffffff"][Math.floor(Math.random() * 5)],
              size: 2 + Math.random() * 2
            });
          }
        }

        function triggerCrowdStrikeout() {
          game.crowdMoodDown = 1;
        }

        function updatePlayerAnimations(dt) {
          const t = performance.now() / 1000;
          const fieldingPrep = game.phase === PHASE.PITCHING || game.phase === PHASE.PITCH_FLIGHT;
          const primaryIdx = game.fieldingPlan?.primaryIndex ?? -1;

          for (let i = 0; i < players.defense.length; i += 1) {
            const f = players.defense[i];
            if (!f.anim) {
              f.anim = {
                state: FIELDER_STATE.IDLE,
                stateTimer: 0,
                bobPhase: Math.random() * Math.PI * 2,
                shiftTimer: 2 + Math.random() * 2.6,
                shiftDir: 0,
                shiftX: 0,
                runFrame: 0,
                armsUp: 0,
                readyLeanY: 0,
                vx: 0,
                vy: 0,
                dive: 0,
                checkTimer: 0
              };
            }
            const a = f.anim;
            a.stateTimer = Math.max(0, (a.stateTimer || 0) - dt);

            if (i !== primaryIdx && a.state !== FIELDER_STATE.IDLE && a.state !== FIELDER_STATE.RETURNING) {
              a.state = FIELDER_STATE.IDLE;
              f.isAnimating = false;
            }

            if (a.state === FIELDER_STATE.REACTING && a.stateTimer <= 0) {
              a.state = FIELDER_STATE.RUNNING;
            } else if (a.state === FIELDER_STATE.FOLLOW_THROUGH && a.stateTimer <= 0) {
              a.state = FIELDER_STATE.IDLE;
              f.isAnimating = false;
            } else if (a.state === FIELDER_STATE.RETURNING) {
              const dx = f.baseX - f.x;
              const dy = f.baseY - f.y;
              const d = Math.hypot(dx, dy);
              if (d > 2) {
                f.x += (dx / d) * 172 * dt;
                f.y += (dy / d) * 172 * dt;
                a.vx = (dx / d) * 172;
                a.vy = (dy / d) * 172;
              } else {
                a.state = FIELDER_STATE.IDLE;
                f.isAnimating = false;
                a.vx = 0;
                a.vy = 0;
              }
            }

            a.bobY = Math.sin(t * (Math.PI * 2 / 1.2) + a.bobPhase) * 2;
            if (a.state === FIELDER_STATE.IDLE) {
              a.shiftTimer -= dt;
              if (a.shiftTimer <= 0) {
                a.shiftTimer = 3 + Math.random() * 2;
                a.shiftDir = (Math.random() < 0.5 ? -1 : 1) * 3;
              }
              a.shiftX += (a.shiftDir - a.shiftX) * Math.min(1, dt * 7);
              if (Math.abs(a.shiftX - a.shiftDir) < 0.3) a.shiftDir = 0;
            } else {
              a.shiftX *= 0.78;
            }

            let targetLean = fieldingPrep ? -4 : 0;
            if (a.state === FIELDER_STATE.RUNNING) targetLean = -6;
            if (a.state === FIELDER_STATE.THROWING) targetLean = -2;
            if (a.state === FIELDER_STATE.FOLLOW_THROUGH) targetLean = 2;
            a.readyLeanY += (targetLean - a.readyLeanY) * Math.min(1, dt * 8);

            a.runFrame = (a.runFrame + dt * 14) % 3;
            if (a.armsUp > 0) a.armsUp = Math.max(0, a.armsUp - dt);
            if (a.dive > 0) a.dive = Math.max(0, a.dive - dt);
            if (a.checkTimer > 0) a.checkTimer = Math.max(0, a.checkTimer - dt);
          }

          if (!players.batter.anim) {
            players.batter.anim = { bobPhase: 1.4, missWobble: 0, vx: 0, vy: 0, runToFirst: 0 };
          }
          players.batter.anim.bobY = Math.sin(t * 5 + players.batter.anim.bobPhase) * 1.8;
          if (players.batter.anim.missWobble > 0) {
            players.batter.anim.missWobble = Math.max(0, players.batter.anim.missWobble - dt * 2.8);
          }
          if (players.batter.anim.runToFirst > 0) {
            players.batter.anim.runToFirst = Math.max(0, players.batter.anim.runToFirst - dt);
            const targetX = BASES.first.x - 26;
            const targetY = BASES.first.y + 20;
            players.batter.x += (targetX - players.batter.x) * Math.min(1, dt * 3.5);
            players.batter.y += (targetY - players.batter.y) * Math.min(1, dt * 3.5);
            players.batter.anim.vx = 110;
            players.batter.anim.vy = -40;
          } else {
            players.batter.x += (players.batter.baseX - players.batter.x) * Math.min(1, dt * 4);
            players.batter.y += (players.batter.baseY - players.batter.y) * Math.min(1, dt * 4);
            players.batter.anim.vx *= 0.8;
            players.batter.anim.vy *= 0.8;
          }

          updateBaseRunnerLeads(dt);
        }

        function updateBaseRunnerLeads(dt) {
          const leading = game.phase === PHASE.PITCHING || game.phase === PHASE.PITCH_FLIGHT;
          for (let i = 0; i < game.baseRunners.length; i += 1) {
            const runner = game.baseRunners[i];
            if (!runner) continue;
            const target = leading ? 9 : 0;
            runner.state = leading ? RUNNER_STATE.LEADING : RUNNER_STATE.HOLDING;
            runner.lead += (target - runner.lead) * Math.min(1, dt * 8);
          }
        }

        function applyFieldingSupportMotion(dt) {
          if (game.phase !== PHASE.FIELDING || !game.fieldingPlan) return;
          const primaryIdx = game.fieldingPlan.primaryIndex;
          const ballFielded = Boolean(game.battedBall?.fielded);

          for (let i = 0; i < players.defense.length; i += 1) {
            if (i === primaryIdx) continue;
            const f = players.defense[i];
            const target = ballFielded
              ? { x: f.baseX, y: f.baseY, speed: 220 }
              : (game.fieldingPlan.supportTargets?.[f.role] || { x: f.baseX, y: f.baseY, speed: 14 });
            const dx = target.x - f.x;
            const dy = target.y - f.y;
            const d = Math.hypot(dx, dy);
            if (d > 1.5) {
              const stepSpeed = Math.min(ballFielded ? 220 : 18, target.speed ?? 14);
              const vx = (dx / d) * stepSpeed;
              const vy = (dy / d) * stepSpeed;
              f.x += vx * dt;
              f.y += vy * dt;
              if (f.anim) {
                f.anim.vx = vx;
                f.anim.vy = vy;
                if (ballFielded) {
                  f.anim.state = FIELDER_STATE.RETURNING;
                  f.isAnimating = false;
                }
              }
              clampPlayer(f);
            } else if (f.anim) {
              f.anim.vx *= 0.35;
              f.anim.vy *= 0.35;
              if (ballFielded) {
                f.anim.state = FIELDER_STATE.IDLE;
                f.isAnimating = false;
              }
            }
          }
        }

        function updatePopups(dt) {
          for (let i = game.popupTexts.length - 1; i >= 0; i -= 1) {
            const p = game.popupTexts[i];
            p.age += dt;
            if (p.kind !== "result") p.y -= 26 * dt;
            if (p.age >= p.duration) game.popupTexts.splice(i, 1);
          }
        }

        function updateParticles(dt) {
          const list = [game.particles, game.fireworks];
          for (const arr of list) {
            for (let i = arr.length - 1; i >= 0; i -= 1) {
              const p = arr[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy += 160 * dt;
              p.life -= dt;
              if (p.life <= 0) arr.splice(i, 1);
            }
          }
          game.flashAlpha = Math.max(0, game.flashAlpha - dt * 1.6);
          game.shake = Math.max(0, game.shake - dt * 1.5);
        }

        function resizeCanvas() {
          const rect = fieldWrap.getBoundingClientRect();
          canvas.style.width = `${Math.floor(rect.width)}px`;
          canvas.style.height = `${Math.floor(rect.height)}px`;
        }

        function draw() {
          const shakeX = game.shake > 0 ? (Math.random() - 0.5) * 10 : 0;
          const shakeY = game.shake > 0 ? (Math.random() - 0.5) * 8 : 0;
          const cameraYOffset = 0;

          ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
          ctx.save();
          ctx.translate(shakeX, shakeY + cameraYOffset);
          drawBackground();
          drawField();
          drawPlayers();
          drawBaseRunners();
          drawBall();
          drawRunnerAnimations();
          drawParticlesLayer();
          ctx.restore();

          drawPopups();
          drawTransitionText();
          drawDebug();

          if (game.flashAlpha > 0) {
            ctx.fillStyle = `rgba(255,255,255,${game.flashAlpha})`;
            ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
          }
        }

        function drawBackground() {
          const t = performance.now() * 0.00004;
          const skyGrad = ctx.createLinearGradient(0, 0, 0, VIRTUAL_HEIGHT);
          skyGrad.addColorStop(0, "#1a3a5c");
          skyGrad.addColorStop(0.48, "#4a9edd");
          skyGrad.addColorStop(0.72, "#87ceeb");
          skyGrad.addColorStop(1, "#9ad9ff");
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

          // soft sun + rays
          const sunX = 1120;
          const sunY = 108;
          for (let i = 0; i < 8; i += 1) {
            ctx.save();
            ctx.translate(sunX, sunY);
            ctx.rotate((Math.PI * 2 * i) / 8 + t);
            ctx.fillStyle = "rgba(255, 214, 80, 0.15)";
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(16, -6);
            ctx.lineTo(160, -3);
            ctx.lineTo(160, 3);
            ctx.lineTo(16, 6);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
          const sunGrad = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, 56);
          sunGrad.addColorStop(0, "#ffd700");
          sunGrad.addColorStop(1, "#ff8c00");
          ctx.fillStyle = sunGrad;
          ctx.beginPath();
          ctx.arc(sunX, sunY, 44, 0, Math.PI * 2);
          ctx.fill();

          drawCloud(130 + Math.sin(t * 5) * 12, 88, 1.12);
          drawCloud(320 + Math.cos(t * 4.2) * 10, 66, 0.86);
          drawCloud(890 + Math.sin(t * 3.2) * 8, 126, 0.98);
          drawCloud(1020 + Math.cos(t * 2.3) * 7, 82, 0.76);
        }

        function drawCloud(x, y, s) {
          ctx.fillStyle = "rgba(220, 230, 240, 0.45)";
          ctx.beginPath();
          ctx.ellipse(x, y + 10 * s, 40 * s, 11 * s, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(255,255,255,0.95)";
          ctx.beginPath();
          ctx.arc(x, y, 28 * s, 0, Math.PI * 2);
          ctx.arc(x + 30 * s, y + 2 * s, 22 * s, 0, Math.PI * 2);
          ctx.arc(x - 24 * s, y + 6 * s, 20 * s, 0, Math.PI * 2);
          ctx.fill();
        }

        function drawField() {
          const wallTop = FIELD.wallY;
          const wallHeight = 25;
          const warningTrackTop = wallTop + wallHeight;
          const warningTrackHeight = 30;
          const grassTop = warningTrackTop + warningTrackHeight;

          drawStadiumStands(wallTop);

          // Outfield wall + top padding blocks
          ctx.fillStyle = "#1a5c1a";
          ctx.fillRect(0, wallTop, VIRTUAL_WIDTH, wallHeight);
          const padColors = ["#356f41", "#2f6240", "#457d4d", "#2b5d38"];
          for (let x = 0; x < VIRTUAL_WIDTH; x += 10) {
            ctx.fillStyle = padColors[Math.floor(x / 10) % padColors.length];
            ctx.fillRect(x, wallTop - 5, 8, 5);
          }

          drawFenceSign(VIRTUAL_WIDTH * 0.5, wallTop + 11, "400 FT", 78);
          drawFenceSign(84, wallTop + 11, "330 FT", 60);
          drawFenceSign(VIRTUAL_WIDTH - 84, wallTop + 11, "330 FT", 60);

          // Foul poles
          ctx.strokeStyle = "#f9d52f";
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(84, wallTop + wallHeight);
          ctx.lineTo(84, wallTop - 140);
          ctx.moveTo(VIRTUAL_WIDTH - 84, wallTop + wallHeight);
          ctx.lineTo(VIRTUAL_WIDTH - 84, wallTop - 140);
          ctx.stroke();

          // Warning track
          ctx.fillStyle = "#8B4513";
          ctx.fillRect(0, warningTrackTop, VIRTUAL_WIDTH, warningTrackHeight);

          for (let wy = warningTrackTop + 4; wy < warningTrackTop + warningTrackHeight; wy += 5) {
            ctx.strokeStyle = "rgba(40, 20, 5, 0.24)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, wy);
            ctx.lineTo(VIRTUAL_WIDTH, wy);
            ctx.stroke();
          }

          // Outfield grass + visible mowing stripes
          ctx.fillStyle = "#2d8a2d";
          ctx.fillRect(0, grassTop, VIRTUAL_WIDTH, VIRTUAL_HEIGHT - grassTop);
          for (let x = 0; x < VIRTUAL_WIDTH; x += 50) {
            ctx.fillStyle = (Math.floor(x / 40) % 2 === 0) ? "rgba(38, 115, 38, 0.45)" : "rgba(51, 153, 51, 0.42)";
            ctx.fillRect(x, grassTop, 24, VIRTUAL_HEIGHT - grassTop);
          }

          const dirtHome = { x: BASES.home.x, y: BASES.home.y + 26 };
          const dirtFirst = { x: BASES.first.x + 120, y: BASES.first.y + 6 };
          const dirtSecond = { x: BASES.second.x, y: BASES.second.y - 92 };
          const dirtThird = { x: BASES.third.x - 120, y: BASES.third.y + 6 };
          const infieldCenter = { x: BASES.mound.x, y: BASES.mound.y + 20 };

          // Infield dirt diamond
          ctx.fillStyle = "#C49A6C";
          ctx.beginPath();
          ctx.moveTo(dirtHome.x, dirtHome.y);
          ctx.lineTo(dirtFirst.x, dirtFirst.y);
          ctx.lineTo(dirtSecond.x, dirtSecond.y);
          ctx.lineTo(dirtThird.x, dirtThird.y);
          ctx.closePath();
          ctx.fill();

          // Infield grass wedges
          ctx.fillStyle = "#3E9850";
          fillTriangle(infieldCenter, BASES.home, BASES.first);
          fillTriangle(infieldCenter, BASES.first, BASES.second);
          fillTriangle(infieldCenter, BASES.second, BASES.third);
          fillTriangle(infieldCenter, BASES.third, BASES.home);

          // Base paths
          ctx.strokeStyle = "#B88A5A";
          ctx.lineWidth = 22;
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(BASES.home.x, BASES.home.y + 2);
          ctx.lineTo(BASES.first.x, BASES.first.y);
          ctx.lineTo(BASES.second.x, BASES.second.y);
          ctx.lineTo(BASES.third.x, BASES.third.y);
          ctx.closePath();
          ctx.stroke();

          drawBase(BASES.first.x, BASES.first.y, Boolean(game.baseRunners[0]));
          drawBase(BASES.second.x, BASES.second.y, Boolean(game.baseRunners[1]));
          drawBase(BASES.third.x, BASES.third.y, Boolean(game.baseRunners[2]));
          drawHomePlate(BASES.home.x, BASES.home.y);

          // Mound + rubber strip
          ctx.fillStyle = "#B98A5A";
          ctx.beginPath();
          ctx.arc(BASES.mound.x, BASES.mound.y + 18, 44, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#CDA172";
          ctx.beginPath();
          ctx.arc(BASES.mound.x, BASES.mound.y + 16, 35, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(BASES.mound.x - 13, BASES.mound.y + 12, 26, 4);

          // Foul lines
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(BASES.home.x, BASES.home.y);
          ctx.lineTo(VIRTUAL_WIDTH - 84, wallTop + wallHeight + warningTrackHeight);
          ctx.moveTo(BASES.home.x, BASES.home.y);
          ctx.lineTo(84, wallTop + wallHeight + warningTrackHeight);
          ctx.stroke();

          const vignette = ctx.createRadialGradient(640, 420, 240, 640, 420, 760);
          vignette.addColorStop(0, "rgba(0,0,0,0)");
          vignette.addColorStop(1, "rgba(0,0,0,0.2)");
          ctx.fillStyle = vignette;
          ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
        }

        function fillTriangle(a, b, c) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.lineTo(c.x, c.y);
          ctx.closePath();
          ctx.fill();
        }

        function drawFenceSign(x, y, label, width) {
          ctx.fillStyle = "#f4d13a";
          ctx.strokeStyle = "#1b2d1e";
          ctx.lineWidth = 2;
          roundRect(ctx, x - width / 2, y - 10, width, 20, 4);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#20361f";
          ctx.font = '8px "Press Start 2P"';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(label, x, y + 1);
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";
        }

        function drawStadiumStands(wallTop) {
          const standsTop = SKY_BAND_Y - 8;
          const standsBottom = wallTop - 2;
          const rows = 5;
          const rowH = (standsBottom - standsTop) / rows;

          ctx.fillStyle = "#2f4a34";
          ctx.fillRect(0, standsTop, VIRTUAL_WIDTH, standsBottom - standsTop);

          for (let r = 0; r < rows; r += 1) {
            const y = standsTop + r * rowH;
            ctx.fillStyle = r % 2 === 0 ? "#33573a" : "#27452e";
            ctx.fillRect(0, y, VIRTUAL_WIDTH, rowH - 2);
            for (let x = 6; x < VIRTUAL_WIDTH - 6; x += 9) {
              const ci = (x + r) % game.crowd.length;
              const fan = game.crowd[ci];
              const waveY = fan.wave > 0 ? -3 * Math.sin((1 - fan.wave) * Math.PI) : 0;
              const moodDrop = game.crowdMoodDown * 2;
              const jumpY = game.crowdJump > 0 ? -6 * Math.sin(game.crowdJump * Math.PI) : 0;
              const fy = y + rowH * 0.56 + waveY + jumpY + moodDrop;
              ctx.fillStyle = "#f7d5b0";
              ctx.fillRect(x, fy - 4, 2, 2);
              ctx.fillStyle = fan.color;
              ctx.fillRect(x - 1, fy - 2, 4, 4);
            }
          }

          ctx.fillStyle = "#20374a";
          roundRect(ctx, VIRTUAL_WIDTH / 2 - 74, standsTop - 20, 148, 18, 4);
          ctx.fill();
          ctx.fillStyle = "#f1f6ff";
          ctx.font = '8px "Press Start 2P"';
          ctx.textAlign = "center";
          ctx.fillText("CITY PARK", VIRTUAL_WIDTH / 2, standsTop - 7);
          ctx.textAlign = "left";
        }
        function drawBase(x, y, occupied = false) {
          ctx.save();
          const pulse = (Math.sin(performance.now() / 260) + 1) * 0.5;
          if (occupied) {
            ctx.fillStyle = `rgba(255, 221, 92, ${0.18 + pulse * 0.2})`;
            ctx.beginPath();
            ctx.ellipse(x, y + 8, 20 + pulse * 4, 8 + pulse * 2, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.translate(x, y);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = "rgba(0,0,0,0.22)";
          ctx.fillRect(-10, -6, 26, 8);
          ctx.fillStyle = occupied ? "#fff7c7" : "#ffffff";
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 2.4;
          ctx.fillRect(-12, -12, 24, 24);
          ctx.strokeRect(-12, -12, 24, 24);
          ctx.restore();
        }

        function drawHomePlate(x, y) {
          ctx.save();
          ctx.translate(x, y);
          ctx.fillStyle = "#fff";
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(14, -12);
          ctx.lineTo(10, -30);
          ctx.lineTo(-10, -30);
          ctx.lineTo(-14, -12);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        function drawPlayers() {
          const primaryIdx = game.fieldingPlan?.primaryIndex ?? game.selectedFielder ?? -1;
          for (const f of players.defense) drawPlayer(f, false, f === players.defense[primaryIdx]);
          drawPlayer(players.batter, true, false);
        }

        function drawPlayer(p, isBatter, selected) {
          const walkFrame = Math.floor(performance.now() / 90) % 2;
          const anim = p.anim || {};
          const bobY = anim.bobY || 0;
          const shiftX = anim.shiftX || 0;
          const leanY = anim.readyLeanY || 0;
          const runFrame = anim.runFrame || 0;
          const dive = anim.dive || 0;
          const checkTimer = anim.checkTimer || 0;
          const isOutfieldRole = p.role === "left" || p.role === "center" || p.role === "right";
          const baseScale = isOutfieldRole ? 1.07 : 1.26;
          const scale = p.role === "runner" ? (isOutfieldRole ? 0.9 : 1.05) : baseScale;

          ctx.save();
          const checkNudge = checkTimer > 0 ? Math.sin(checkTimer * 26) * 1.4 : 0;
          ctx.translate(p.x + shiftX, p.y + bobY + leanY + checkNudge);
          if (dive > 0) {
            const d = Math.min(1, dive / 0.42);
