<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neon Slugger Deluxe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --header-h: 88px;
      }

      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #7ecbff;
        font-family: "Press Start 2P", monospace;
        color: #111;
      }

      #root {
        position: relative;
        background: #7ecbff;
      }

      .top-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        background: linear-gradient(rgba(138, 210, 255, 0.9), rgba(112, 197, 255, 0.82));
        border-bottom: 4px solid rgba(45, 111, 159, 0.85);
      }

      .title {
        position: absolute;
        left: 16px;
        color: #ffffff;
        text-shadow: 3px 3px 0 #1a4e74;
        font-size: clamp(11px, 1.2vw, 17px);
        letter-spacing: 1px;
      }

      .scoreboard {
        background: #ffffff;
        border: 4px solid #3a89b5;
        border-radius: 16px;
        padding: 8px 16px;
        display: grid;
        gap: 6px;
        min-width: min(780px, 92vw);
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
      }

      .score-row,
      .count-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
      }

      .team {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .chip {
        padding: 4px 8px;
        border-radius: 8px;
        border: 2px solid #111;
        color: #fff;
        font-size: 11px;
      }

      .chip.red {
        background: #ef3d3d;
      }

      .chip.blue {
        background: #3b66ff;
      }

      .score-num {
        font-size: 18px;
      }

      .score-num.red-num {
        color: #d33131;
      }

      .score-num.blue-num {
        color: #2f57f0;
      }

      .score-mid {
        font-size: 10px;
        color: #13354f;
      }

      .score-divider {
        color: #3f6f93;
        font-size: 14px;
      }

      .mini {
        font-size: 10px;
        color: #13354f;
      }

      .field-wrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #7ecbff;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      .mobile-swing {
        position: absolute;
        right: 18px;
        bottom: 18px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 4px solid #111;
        background: radial-gradient(circle at 35% 30%, #fff6ac, #f5a623);
        color: #111;
        font-family: "Press Start 2P", monospace;
        font-size: 13px;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
        touch-action: manipulation;
        transition: transform 120ms ease, opacity 140ms ease;
      }

      .mobile-swing:active {
        transform: translateY(2px);
      }

      .mobile-swing.active {
        animation: swingPulse 1.05s ease-in-out infinite;
        opacity: 1;
      }

      .mobile-swing.locked {
        opacity: 0.38;
        filter: grayscale(0.58);
        pointer-events: none;
      }

      @keyframes swingPulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); }
      }

      .game-over {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: rgba(255, 255, 255, 0.76);
        z-index: 5;
      }

      .game-over h2 {
        font-size: clamp(18px, 2.2vw, 34px);
        color: #1b3551;
        text-shadow: 2px 2px 0 #fff;
        margin: 0;
      }

      .game-over button {
        font-family: inherit;
        font-size: 12px;
        border: 4px solid #111;
        border-radius: 12px;
        padding: 12px 20px;
        background: #fff;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .top-header {
          justify-content: center;
          padding: 6px 8px;
        }

        .scoreboard {
          min-width: 0;
          width: min(96vw, 760px);
        }

        .title {
          position: static;
          margin-right: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <header class="top-header">
        <div class="title">NEON SLUGGER DELUXE</div>
        <div class="scoreboard">
          <div class="score-row">
            <div class="team">
              <span class="chip red">COMETS</span>
              <span id="scoreComets" class="score-num red-num">0</span>
            </div>
            <span class="score-divider">—</span>
            <div class="score-mid"><span id="inning">INNING 1</span> • <span id="half">TOP</span></div>
            <span class="score-divider">—</span>
            <div class="team">
              <span id="scoreFoxes" class="score-num blue-num">0</span>
              <span class="chip blue">FOXES</span>
            </div>
          </div>
          <div class="count-row mini">
            <span>B: <strong id="balls">0</strong></span>
            <span>S: <strong id="strikes">0</strong></span>
            <span>O: <strong id="outs">0</strong></span>
            <span>|</span>
            <span>PITCH: <strong id="pitchType">FASTBALL</strong></span>
          </div>
        </div>
      </header>

      <section class="field-wrap" id="fieldWrap">
        <canvas id="gameCanvas" width="1280" height="720" aria-label="Neon Slugger Deluxe"></canvas>

        <button id="swingButton" class="mobile-swing" type="button">SWING</button>

        <div id="gameOver" class="game-over">
          <h2 id="winnerText">GAME OVER</h2>
          <button id="restartButton" type="button">PLAY AGAIN</button>
        </div>
      </section>
    </div>

    <script>
      (() => {
        const VIRTUAL_WIDTH = 1280;
        const VIRTUAL_HEIGHT = 720;
        const SKY_BAND_Y = Math.round(VIRTUAL_HEIGHT * 0.35);
        const FIELD = {
          left: 36,
          right: 1244,
          top: 84,
          bottom: 708,
          wallY: Math.round(VIRTUAL_HEIGHT * 0.2)
        };
        const BASES = {
          home: { x: 640, y: 676 },
          first: { x: 980, y: 548 },
          second: { x: 640, y: 396 },
          third: { x: 300, y: 548 },
          mound: { x: 640, y: 514 }
        };
        const PHASE = {
          PITCHING: "PITCHING",
          PITCH_FLIGHT: "PITCH_FLIGHT",
          BATTING_WINDOW: "BATTING_WINDOW",
          RESULT: "RESULT",
          FIELDING: "FIELDING",
          NEXT_BATTER: "NEXT_BATTER",
          INNING_TRANSITION: "INNING_TRANSITION",
          GAME_OVER: "GAME_OVER"
        };

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const fieldWrap = document.getElementById("fieldWrap");
        const swingButton = document.getElementById("swingButton");
        const gameOverOverlay = document.getElementById("gameOver");
        const winnerText = document.getElementById("winnerText");
        const restartButton = document.getElementById("restartButton");

        const scoreComets = document.getElementById("scoreComets");
        const scoreFoxes = document.getElementById("scoreFoxes");
        const inningEl = document.getElementById("inning");
        const halfEl = document.getElementById("half");
        const ballsEl = document.getElementById("balls");
        const strikesEl = document.getElementById("strikes");
        const outsEl = document.getElementById("outs");
        const pitchTypeEl = document.getElementById("pitchType");

        const input = {
          keysHeld: new Set(),
          keysPressed: new Set(),
          swingPressedThisFrame: false
        };

        const pitchTypes = {
          FASTBALL: { targetDuration: 0.7, curveAmount: 0, curveStyle: "none", color: "#ffffff" },
          CHANGEUP: { targetDuration: 1.1, curveAmount: 0, curveStyle: "none", color: "#e8ffff" },
          CURVEBALL: { targetDuration: 0.9, curveAmount: -92, curveStyle: "arc", color: "#fff6d2" },
          SLIDER: { targetDuration: 0.85, curveAmount: 74, curveStyle: "late", color: "#fef6ff" }
        };
        const pitchTypeKeys = ["FASTBALL", "CURVEBALL", "CHANGEUP", "SLIDER"];

        const game = {
          inning: 1,
          half: "TOP",
          outs: 0,
          balls: 0,
          strikes: 0,
          score: { comets: 0, foxes: 0 },
          phase: PHASE.NEXT_BATTER,
          phaseTimer: 0,
          lockInput: false,
          transitionText: "",
          statusText: "",
          pitchType: "FASTBALL",
          pitchAim: 0,
          swingUsed: false,
          pitchActive: false,
          hitDetected: false,
          throwActive: false,
          selectedFielder: null,
          ballInPlayTime: 0,
          ballDeadTime: 0,
          playResultTimeout: null,
          lastAction: "-",
          pitchBall: null,
          battedBall: null,
          throwBall: null,
          runnerProgress: 0,
          runnerTargetBase: 1,
          runnerAnims: [],
          baseRunners: [false, false, false],
          popupTexts: [],
          particles: [],
          fireworks: [],
          flashAlpha: 0,
          shake: 0,
          debugVisible: false,
          winner: "",
          crowd: [],
          crowdWaveTimer: 2.4,
          crowdJump: 0,
          crowdMoodDown: 0
        };

        const players = {
          batter: { id: "batter", team: "red", x: 712, y: 664, baseX: 712, baseY: 664, anim: { bobPhase: 1.3, missWobble: 0, vx: 0, vy: 0, runToFirst: 0 }, swing: 0, role: "batter" },
          defense: []
        };

        const defenseDefaults = [
          { role: "pitcher", x: 640, y: 514 },
          { role: "catcher", x: 640, y: 694 },
          { role: "first", x: 945, y: 518 },
          { role: "second", x: 760, y: 430 },
          { role: "shortstop", x: 520, y: 430 },
          { role: "third", x: 335, y: 518 },
          { role: "left", x: 220, y: 290 },
          { role: "center", x: 640, y: 242 },
          { role: "right", x: 1060, y: 290 }
        ];

        let audioCtx = null;
        let ambientSource = null;
        let ambientGain = null;

        function initPlayers() {
          if (game.crowd.length === 0) initCrowd();
          players.defense = defenseDefaults.map((p, idx) => ({
            id: `def-${idx}`,
            team: "blue",
            role: p.role,
            x: p.x,
            y: Math.max(p.y, FIELD.wallY + 25),
            baseX: p.x,
            baseY: Math.max(p.y, FIELD.wallY + 25),
            frame: 0,
            hasBall: false
          }));
        }

        function resetPlayersToDefaultPositions() {
          players.batter.x = players.batter.baseX;
          players.batter.y = players.batter.baseY;
          players.batter.swing = 0;
          for (const f of players.defense) {
            f.x = f.baseX;
            f.y = f.baseY;
            f.hasBall = false;
          }
          if (players.defense.length < 9) initPlayers();
        }

        function clampPlayer(p) {
          p.x = Math.max(FIELD.left + 16, Math.min(FIELD.right - 16, p.x));
          p.y = Math.max(FIELD.wallY + 26, Math.min(FIELD.bottom + 16, p.y));
        }

        function initCrowd() {
          const colors = ["#ff5757", "#4ea8ff", "#ffd84d", "#f5f5f5", "#7dff86", "#f1a6ff"];
          game.crowd = [];
          for (let i = 0; i < 960; i += 1) {
            game.crowd.push({ color: colors[i % colors.length], wave: 0 });
          }
          game.crowdWaveTimer = 2.4;
          game.crowdJump = 0;
          game.crowdMoodDown = 0;
        }

        function setStatus(text) {
          game.statusText = text;
        }

        function setAction(_title, _sub, _color = "#23b7ff") {}

        function updateScoreboard() {
          scoreComets.textContent = String(game.score.comets);
          scoreFoxes.textContent = String(game.score.foxes);
          inningEl.textContent = `INNING ${game.inning}`;
          halfEl.textContent = game.half;
          ballsEl.textContent = String(game.balls);
          strikesEl.textContent = String(game.strikes);
          outsEl.textContent = String(game.outs);
          pitchTypeEl.textContent = game.pitchType;
        }

        function randomPitchType() {
          return pitchTypeKeys[Math.floor(Math.random() * pitchTypeKeys.length)];
        }

        function choosePitchTypeFromKey(key) {
          if (key === "1") game.pitchType = "FASTBALL";
          if (key === "2") game.pitchType = "CHANGEUP";
          if (key === "3") game.pitchType = "CURVEBALL";
          if (key === "4") game.pitchType = "SLIDER";
        }

        function beginPitch() {
          game.pitchType = randomPitchType();
          game.pitchActive = true;
          game.swingUsed = false;
          game.phase = PHASE.PITCHING;
          game.phaseTimer = 0;
          game.lastAction = `Pitch prep ${game.pitchType}`;
          setAction("PITCH NOW", "CPU winds up...", "#29b7ff");
          setStatus(`CPU selected ${game.pitchType}. Get ready to swing.`);
          updateScoreboard();
        }

        function throwPitch() {
          const cfg = pitchTypes[game.pitchType];
          const startX = BASES.mound.x;
          const startY = BASES.mound.y - 14;
          const endX = BASES.home.x + game.pitchAim * 54;
          const endY = BASES.home.y - 12;
          const dist = Math.hypot(endX - startX, endY - startY);
          const duration = cfg.targetDuration;
          const pitchSpeed = dist / duration;
          game.pitchBall = {
            x: startX,
            y: startY,
            z: 10,
            startX,
            startY,
            endX,
            endY,
            t: 0,
            duration,
            speed: pitchSpeed,
            curveAmount: cfg.curveAmount,
            curveStyle: cfg.curveStyle,
            color: cfg.color,
            trail: []
          };
          game.phase = PHASE.PITCH_FLIGHT;
          game.phaseTimer = 0;
          game.lastAction = `Pitch thrown ${game.pitchType}`;
          setAction("SWING NOW", "SPACE or SWING button", "#ffb542");
          setStatus("Swing now!");
          updateScoreboard();
        }

        function registerSwing() {
          input.swingPressedThisFrame = true;
        }

        function swingAtPitch() {
          if (!game.pitchBall || game.swingUsed) return;
          game.swingUsed = true;
          players.batter.swing = 0.3;
          game.lastAction = "Swing";
          resumeAudio();

          const ideal = 0.78;
          const t = game.pitchBall.t;
          const diff = t - ideal;
          const abs = Math.abs(diff);
          const closeToPlate = Math.abs(game.pitchBall.y - (BASES.home.y - 10)) < 38;

          if (!closeToPlate || abs > 0.24) {
            spawnPopup("STRIKE!", "#ff5252");
            playStrikeMiss();
            players.batter.anim = players.batter.anim || {};
            players.batter.anim.missWobble = 0.14;
            addStrike("Swing and miss. Strike!");
            return;
          }

          if (abs <= 0.05) {
            spawnPopup("PERFECT!", "#ffea5d");
            playBatCrack();
            launchHit("PERFECT");
            return;
          }

          if (abs <= 0.13) {
            spawnPopup("GOOD HIT!", "#6eff95");
            playBatCrack();
            launchHit("GOOD");
            return;
          }

          if (diff < -0.14) {
            spawnPopup("FOUL", "#ffd084");
            playStrikeMiss();
            completePlay("Foul ball.");
            game.strikes = Math.min(2, game.strikes + 1);
            updateScoreboard();
            return;
          }

          spawnPopup("STRIKE!", "#ff7a7a");
          playStrikeMiss();
          addStrike("Late swing. Strike!");
        }

        function launchHit(quality) {
          const nearX = game.pitchBall ? game.pitchBall.x : BASES.home.x;
          const nearY = game.pitchBall ? game.pitchBall.y : BASES.home.y;
          const timing = Math.abs((game.pitchBall?.t ?? 0.8) - 0.78);
          const accuracy = Math.max(0, 1 - timing / 0.24);
          const power = Math.round(accuracy * 100);
          game.hitDetected = true;
          game.phase = PHASE.FIELDING;
          players.batter.anim = players.batter.anim || {};
          players.batter.anim.watchBall = 0.55;
          players.batter.anim.runToFirst = 0.95;
          game.phaseTimer = 0;
          game.ballInPlayTime = 0;
          game.ballDeadTime = 0;

          const baseAngle = quality === "PERFECT" ? 40 : quality === "GOOD" ? 18 : -5;
          const launchAngle = Math.max(-10, Math.min(45, baseAngle + (Math.random() * 10 - 5)));
          const angleRad = launchAngle * Math.PI / 180;
          const direction = Math.atan2(BASES.second.y - BASES.home.y, BASES.second.x - BASES.home.x)
            + (Math.random() * 0.5 - 0.25);
          const speed = quality === "PERFECT" ? 620 : quality === "GOOD" ? 500 : 360;
          const powerScale = 0.45 + (power / 100) * 0.55;
          const horizontal = speed * powerScale;
          const vz = Math.sin(angleRad) * 640;
          const forward = Math.cos(angleRad) * horizontal;

          game.battedBall = {
            x: nearX,
            y: nearY,
            z: 8,
            vx: Math.cos(direction) * forward,
            vy: Math.sin(direction) * forward,
            vz,
            bounces: 0,
            quality,
            trail: [],
            fielded: false,
            overWall: false
          };

          game.pitchBall = null;
          game.selectedFielder = findNearestFielder(game.battedBall.x, game.battedBall.y);
          game.runnerProgress = 0;
          game.runnerTargetBase = quality === "PERFECT" ? 4 : quality === "GOOD" ? (Math.random() < 0.4 ? 2 : 1) : 1;
          game.lastAction = `${quality} contact`;
          setAction("FIELD THE BALL", "WASD move • Q/F/E/R throw", "#5adf8f");
          setStatus(`${quality}! Field the ball.`);
          spawnHitSparks(nearX, nearY);
        }

        function findNearestFielder(x, y) {
          let best = 0;
          let bestD = Infinity;
          for (let i = 0; i < players.defense.length; i += 1) {
            const f = players.defense[i];
            const d = (f.x - x) ** 2 + (f.y - y) ** 2;
            if (d < bestD) {
              bestD = d;
              best = i;
            }
          }
          return best;
        }

        function addStrike(msg) {
          game.strikes += 1;
          if (game.strikes >= 3) {
            game.strikes = 0;
            game.balls = 0;
            game.outs += 1;
            game.shake = 0.28;
            spawnPopup("STRIKEOUT!", "#ff5757");
            triggerCrowdStrikeout();
            completePlay("Strike three! Batter out.");
            if (game.outs >= 3) {
              scheduleHalfInningSwitch();
            }
          } else {
            completePlay(msg);
          }
          updateScoreboard();
        }

        function addBall() {
          game.balls += 1;
          if (game.balls >= 4) {
            game.balls = 0;
            game.strikes = 0;
            advanceRunners(1, "walk");
            completePlay("Ball four. Walk.");
          } else {
            completePlay("Ball.");
          }
          updateScoreboard();
        }

        function scheduleHalfInningSwitch() {
          game.transitionText = `INNING ${game.inning} - ${game.half === "TOP" ? "BOTTOM" : "TOP"}`;
        }

        function switchHalfInningIfNeeded() {
          if (game.outs < 3) return;
          game.outs = 0;
          game.balls = 0;
          game.strikes = 0;
          game.baseRunners = [false, false, false];
          if (game.half === "TOP") {
            game.half = "BOT";
          } else {
            game.half = "TOP";
            game.inning += 1;
          }
          if (game.inning > 9) {
            endGame();
            return;
          }
          game.phase = PHASE.INNING_TRANSITION;
          game.phaseTimer = 0;
          game.transitionText = `INNING ${game.inning} - ${game.half}`;
          updateScoreboard();
        }

        function endGame() {
          game.phase = PHASE.GAME_OVER;
          game.lockInput = true;
          game.winner = game.score.comets === game.score.foxes
            ? "TIE GAME!"
            : (game.score.comets > game.score.foxes ? "COMETS WIN!" : "FOXES WIN!");
          winnerText.textContent = game.winner;
          gameOverOverlay.style.display = "flex";
          spawnFireworks(640, 240, 80);
        }

        function completePlay(message) {
          if (game.phase === PHASE.RESULT || game.phase === PHASE.NEXT_BATTER || game.phase === PHASE.INNING_TRANSITION) return;
          if (game.playResultTimeout) {
            clearTimeout(game.playResultTimeout);
            game.playResultTimeout = null;
          }
          game.phase = PHASE.RESULT;
          game.lockInput = true;
          game.phaseTimer = 0;
          setStatus(message);
          game.lastAction = message;
          spawnPopup(playResultCallout(message), "#ffffff", {
            kind: "result",
            duration: 1.4,
            size: 72
          });

          game.playResultTimeout = setTimeout(() => {
            game.playResultTimeout = null;
            resetForNextPitch();
          }, 1000);
        }

        function playResultCallout(message) {
          const m = (message || "").toLowerCase();
          if (m.includes("home run")) return "HOME RUN!";
          if (m.includes("strike")) return "STRIKE!";
          if (m.includes("ball four") || m.includes("walk")) return "WALK";
          if (m === "ball." || m.startsWith("ball")) return "BALL";
          if (m.includes("foul")) return "FOUL";
          if (m.includes("safe")) return "SAFE!";
          if (m.includes("out")) return "OUT!";
          if (m.includes("dead")) return "DEAD BALL";
          if (m.includes("ended")) return "PLAY OVER";
          if (m.includes("hit")) return "HIT!";
          return String(message || "PLAY").toUpperCase();
        }

        function resetForNextPitch() {
          game.phase = PHASE.NEXT_BATTER;
          game.phaseTimer = 0;
          game.lockInput = false;
          game.pitchBall = null;
          game.battedBall = null;
          game.throwBall = null;
          game.pitchActive = false;
          game.hitDetected = false;
          game.throwActive = false;
          game.swingUsed = false;
          game.selectedFielder = null;
          game.ballInPlayTime = 0;
          game.ballDeadTime = 0;
          game.runnerProgress = 0;
          game.runnerAnims.length = 0;
          game.transitionText = "";
          resetPlayersToDefaultPositions();
          clearInputFlags();
          switchHalfInningIfNeeded();
          if (game.phase === PHASE.GAME_OVER || game.phase === PHASE.INNING_TRANSITION) return;
          setAction("PITCH NOW", "CPU preparing next pitch", "#28b7ff");
          setStatus("PITCH NOW: Press SPACE or SWING to bat.");
          updateScoreboard();
        }

        function clearInputFlags() {
          input.keysPressed.clear();
          input.swingPressedThisFrame = false;
        }

        function advanceRunners(basesToAdvance, reason = "hit") {
          let runs = 0;
          const next = [false, false, false];
          for (let i = 2; i >= 0; i -= 1) {
            if (!game.baseRunners[i]) continue;
            const dest = i + basesToAdvance;
            if (dest >= 3) {
              runs += 1;
              game.runnerAnims.push(makeRunnerAnim(i, 3));
            } else {
              next[dest] = true;
              game.runnerAnims.push(makeRunnerAnim(i, dest));
            }
          }
          if (basesToAdvance >= 4) {
            runs += 1;
            game.runnerAnims.push(makeRunnerAnim(-1, 3));
          } else {
            next[basesToAdvance - 1] = true;
            game.runnerAnims.push(makeRunnerAnim(-1, basesToAdvance - 1));
          }
          game.baseRunners = next;
          if (runs > 0) {
            game.score.comets += runs;
            spawnPopup(`+${runs} RUN`, "#ffe86f");
            game.flashAlpha = 0.25;
          }
          if (reason === "homer") {
            playCrowdCheer();
            spawnFireworks(640, 240, 36);
          }
          updateScoreboard();
        }

        function makeRunnerAnim(fromBaseIndex, toBaseIndex) {
          const points = [BASES.home, BASES.first, BASES.second, BASES.third, BASES.home];
          const fromPoint = fromBaseIndex < 0 ? points[0] : points[fromBaseIndex + 1];
          const toPoint = toBaseIndex >= 3 ? points[4] : points[toBaseIndex + 1];
          return {
            fromX: fromPoint.x,
            fromY: fromPoint.y,
            toX: toPoint.x,
            toY: toPoint.y,
            t: 0,
            duration: 1.15,
            slide: Math.random() < 0.35
          };
        }

        function spawnPopup(text, color, options = {}) {
          const kind = options.kind || "float";
          game.popupTexts.push({
            text,
            color,
            x: options.x ?? (VIRTUAL_WIDTH * 0.5),
            y: options.y ?? (VIRTUAL_HEIGHT * 0.48),
            kind,
            size: options.size ?? (kind === "result" ? 72 : 36),
            age: 0,
            duration: options.duration ?? (kind === "result" ? 1.4 : 1.0)
          });
        }

        function spawnHitSparks(x, y) {
          for (let i = 0; i < 14; i += 1) {
            const a = Math.random() * Math.PI * 2;
            const s = 90 + Math.random() * 180;
            game.particles.push({
              x,
              y,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s,
              life: 0.4 + Math.random() * 0.3,
              color: i % 2 === 0 ? "#ffe66e" : "#ffffff",
              size: 2 + Math.random() * 3
            });
          }
        }

        function spawnFireworks(x, y, count) {
          for (let i = 0; i < count; i += 1) {
            const a = Math.random() * Math.PI * 2;
            const s = 80 + Math.random() * 240;
            game.fireworks.push({
              x,
              y,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s - 40,
              life: 0.8 + Math.random() * 1.1,
              color: ["#ff5a5a", "#fef45b", "#50d6ff", "#7dff86"][Math.floor(Math.random() * 4)],
              size: 2 + Math.random() * 3
            });
          }
        }

        function updatePitch(dt) {
          if (!game.pitchBall) return;
          const b = game.pitchBall;
          b.t += dt / b.duration;
          const t = Math.min(1, b.t);
          let curveOffset = 0;
          if (b.curveStyle === "arc") {
            curveOffset = Math.sin(Math.PI * t) * b.curveAmount;
          } else if (b.curveStyle === "late") {
            const lateBreak = Math.max(0, (t - 0.58) / 0.42);
            curveOffset = (Math.sin(Math.PI * t) * 0.12 + lateBreak * lateBreak) * b.curveAmount;
          }
          b.x = b.startX + (b.endX - b.startX) * t + curveOffset;
          b.y = b.startY + (b.endY - b.startY) * t;
          b.z = Math.sin(Math.PI * t) * 24 + 4;

          b.trail.push({ x: b.x, y: b.y, z: b.z, a: 0.7 });
          if (b.trail.length > 4) b.trail.shift();

          if (game.phase === PHASE.PITCH_FLIGHT && t > 0.58) {
            game.phase = PHASE.BATTING_WINDOW;
          }

          if (t >= 1) {
            const inZone = Math.abs(b.endX - BASES.home.x) < 26;
            game.pitchBall = null;
            if (!game.swingUsed) {
              if (inZone) addStrike("Called strike.");
              else addBall();
            }
          }
        }

        function updateBattedBall(dt) {
          const b = game.battedBall;
          if (!b) return;

          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.z += b.vz * dt;
          b.vz -= 750 * dt;
          b.vx *= 0.995;
          b.vy *= 0.995;
          b.trail.push({ x: b.x, y: b.y, z: b.z, a: 0.55 });
          if (b.trail.length > 4) b.trail.shift();

          if (b.z <= 0) {
            b.z = 0;
            b.bounces += 1;
            if (b.bounces === 1) {
              b.vz = Math.abs(b.vz) * 0.35;
              b.vx *= 0.72;
              b.vy *= 0.72;
              playCatchThud();
            } else {
              b.vz = 0;
              b.vx *= 0.92;
              b.vy *= 0.92;
            }
          }

          if (!Number.isFinite(b.x) || !Number.isFinite(b.y) || !Number.isFinite(b.z)) {
            resetForNextPitch();
            return;
          }

          if (b.y <= FIELD.wallY + 2 && b.z > 22 && b.quality === "PERFECT") {
            b.overWall = true;
            game.flashAlpha = 0.45;
            triggerCrowdHomeRun();
            advanceRunners(4, "homer");
            completePlay("HOME RUN!");
            return;
          }

          if (game.phase === PHASE.FIELDING) {
            game.ballInPlayTime += dt;
            if (game.ballInPlayTime > 8) {
              completePlay("Play ended. Ready for next pitch.");
              return;
            }
            const speed = Math.hypot(b.vx, b.vy);
            if (speed < 12 && b.z <= 0.1) {
              game.ballDeadTime += dt;
              if (game.ballDeadTime > 1.5) {
                completePlay("Ball dead. Ready for next pitch.");
                return;
              }
            } else {
              game.ballDeadTime = 0;
            }
          }
        }

        function updateFielding(dt) {
          if (game.phase !== PHASE.FIELDING || !game.battedBall) return;
          const ball = game.battedBall;
          const selected = players.defense[game.selectedFielder ?? 0];
          if (!selected) return;

          const move = { x: 0, y: 0 };
          if (input.keysHeld.has("w")) move.y -= 1;
          if (input.keysHeld.has("s")) move.y += 1;
          if (input.keysHeld.has("a")) move.x -= 1;
          if (input.keysHeld.has("d")) move.x += 1;
          const mLen = Math.hypot(move.x, move.y);
          if (mLen > 0) {
            const vx = (move.x / mLen) * 260;
            const vy = (move.y / mLen) * 260;
            selected.x += vx * dt;
            selected.y += vy * dt;
            if (selected.anim) { selected.anim.vx = vx; selected.anim.vy = vy; }
          } else if (!ball.fielded) {
            const dx = ball.x - selected.x;
            const dy = ball.y - selected.y;
            const d = Math.hypot(dx, dy);
            if (d > 2) {
              const vx = (dx / d) * 238;
              const vy = (dy / d) * 238;
              selected.x += vx * dt;
              selected.y += vy * dt;
              if (selected.anim) { selected.anim.vx = vx; selected.anim.vy = vy; }
            }
          }
          clampPlayer(selected);
          if (selected.anim && mLen === 0 && (!ball.fielded || Math.hypot(selected.anim.vx || 0, selected.anim.vy || 0) < 2)) {
            selected.anim.vx = 0;
            selected.anim.vy = 0;
          }

          if (!ball.fielded) {
            const d = Math.hypot(selected.x - ball.x, selected.y - ball.y);
            const canCatch = ball.z < 12 || ball.bounces > 0;
            if (d < 20 && canCatch) {
              ball.fielded = true;
              selected.hasBall = true;
              if (selected.anim) selected.anim.armsUp = 0.45;
              playCatchThud();
              setStatus("Ball fielded. Throw to a base (Q/F/E/R).");
            } else if (ball.bounces < 2 && ball.z > 8 && d < 18) {
              game.outs += 1;
              updateScoreboard();
              completePlay("Caught! Batter out.");
              if (game.outs >= 3) scheduleHalfInningSwitch();
              return;
            }
          } else {
            ball.x = selected.x;
            ball.y = selected.y - 8;
            ball.z = 8;
            game.phaseTimer += dt;
            const throwTo = getThrowBaseTarget();
            if (throwTo || game.phaseTimer > 1.2) {
              const baseKey = throwTo ?? "first";
              doThrowToBase(baseKey, selected, ball);
            }
          }
        }

        function getThrowBaseTarget() {
          if (input.keysPressed.has("q")) return "first";
          if (input.keysPressed.has("f")) return "second";
          if (input.keysPressed.has("e")) return "third";
          if (input.keysPressed.has("r")) return "home";
          return null;
        }

        function doThrowToBase(baseKey, fielder, ball) {
          const target = BASES[baseKey];
          game.throwActive = true;
          game.throwBall = {
            fromX: fielder.x,
            fromY: fielder.y - 8,
            toX: target.x,
            toY: target.y - 8,
            t: 0,
            duration: 0.5 + Math.random() * 0.15,
            z: 6,
            trail: []
          };
          fielder.hasBall = false;
          ball.fielded = false;
          if (fielder.anim) fielder.anim.armsUp = 0.25;
          game.lastAction = `Throw to ${baseKey}`;
          setStatus(`Throwing to ${baseKey.toUpperCase()}...`);
        }

        function updateThrow(dt) {
          if (!game.throwBall) return;
          game.throwBall.t += dt / game.throwBall.duration;
          const t = Math.min(1, game.throwBall.t);
          if (!game.battedBall) {
            game.battedBall = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, bounces: 2, trail: [] };
          }
          const tx = game.throwBall.fromX + (game.throwBall.toX - game.throwBall.fromX) * t;
          const ty = game.throwBall.fromY + (game.throwBall.toY - game.throwBall.fromY) * t;
          game.throwBall.x = tx;
          game.throwBall.y = ty;
          game.throwBall.z = 10 - Math.abs(0.5 - t) * 12;
          game.throwBall.trail = game.throwBall.trail || [];
          game.throwBall.trail.push({ x: tx, y: ty, z: game.throwBall.z, a: 0.5 });
          if (game.throwBall.trail.length > 3) game.throwBall.trail.shift();
          game.battedBall.x = tx;
          game.battedBall.y = ty;
          game.battedBall.z = game.throwBall.z;
          if (t >= 1) {
            game.throwBall = null;
            game.throwActive = false;
            resolveThrowOutcome();
          }
        }

        function resolveThrowOutcome() {
          const safeChance = game.runnerTargetBase >= 2 ? 0.62 : 0.46;
          const safe = Math.random() < safeChance;
          if (safe) {
            advanceRunners(game.runnerTargetBase, "hit");
            completePlay("Runner safe.");
          } else {
            game.outs += 1;
            updateScoreboard();
            completePlay("Out at first.");
            if (game.outs >= 3) scheduleHalfInningSwitch();
          }
        }

        function updateRunnerAnims(dt) {
          for (let i = game.runnerAnims.length - 1; i >= 0; i -= 1) {
            const r = game.runnerAnims[i];
            r.t += dt / r.duration;
            if (r.t >= 1) game.runnerAnims.splice(i, 1);
          }
        }

        function updateCrowd(dt) {
          game.crowdWaveTimer -= dt;
          if (game.crowdWaveTimer <= 0) {
            game.crowdWaveTimer = 2 + Math.random() * 1.2;
            const count = 8 + Math.floor(Math.random() * 5);
            for (let i = 0; i < count; i += 1) {
              const idx = Math.floor(Math.random() * game.crowd.length);
              if (game.crowd[idx]) game.crowd[idx].wave = 0.42;
            }
          }

          for (const fan of game.crowd) {
            if (fan.wave > 0) fan.wave = Math.max(0, fan.wave - dt);
          }

          if (game.crowdJump > 0) game.crowdJump = Math.max(0, game.crowdJump - dt * 2.4);
          if (game.crowdMoodDown > 0) game.crowdMoodDown = Math.max(0, game.crowdMoodDown - dt * 2.2);
        }

        function triggerCrowdHomeRun() {
          game.crowdJump = 1;
          for (const fan of game.crowd) fan.wave = 0.4;
          for (let i = 0; i < 120; i += 1) {
            game.particles.push({
              x: Math.random() * VIRTUAL_WIDTH,
              y: SKY_BAND_Y - 10 - Math.random() * 60,
              vx: -40 + Math.random() * 80,
              vy: 40 + Math.random() * 140,
              life: 1.2 + Math.random() * 0.8,
              color: ["#ff5a5a", "#fef45b", "#50d6ff", "#7dff86", "#ffffff"][Math.floor(Math.random() * 5)],
              size: 2 + Math.random() * 2
            });
          }
        }

        function triggerCrowdStrikeout() {
          game.crowdMoodDown = 1;
        }

        function updatePlayerAnimations(dt) {
          const t = performance.now() / 1000;
          const fieldingPrep = game.phase === PHASE.PITCHING || game.phase === PHASE.PITCH_FLIGHT;

          for (const f of players.defense) {
            if (!f.anim) {
              f.anim = { bobPhase: Math.random() * Math.PI * 2, shiftTimer: 2 + Math.random() * 2.6, shiftDir: 0, shiftX: 0, runFrame: 0, armsUp: 0, readyLeanY: 0, vx: 0, vy: 0 };
            }
            const a = f.anim;
            a.bobY = Math.sin(t * (Math.PI * 2 / 1.2) + a.bobPhase) * 2;
            a.shiftTimer -= dt;
            if (a.shiftTimer <= 0) {
              a.shiftTimer = 3 + Math.random() * 2;
              a.shiftDir = (Math.random() < 0.5 ? -1 : 1) * 3;
            }
            a.shiftX += (a.shiftDir - a.shiftX) * Math.min(1, dt * 7);
            if (Math.abs(a.shiftX - a.shiftDir) < 0.3) a.shiftDir = 0;
            a.readyLeanY += ((fieldingPrep ? -4 : 0) - a.readyLeanY) * Math.min(1, dt * 8);
            a.runFrame = (a.runFrame + dt * 14) % 3;
            if (a.armsUp > 0) a.armsUp = Math.max(0, a.armsUp - dt);
          }

          if (!players.batter.anim) {
            players.batter.anim = { bobPhase: 1.4, missWobble: 0, vx: 0, vy: 0, runToFirst: 0 };
          }
          players.batter.anim.bobY = Math.sin(t * 5 + players.batter.anim.bobPhase) * 1.8;
          if (players.batter.anim.missWobble > 0) {
            players.batter.anim.missWobble = Math.max(0, players.batter.anim.missWobble - dt * 2.8);
          }
          if (players.batter.anim.runToFirst > 0) {
            players.batter.anim.runToFirst = Math.max(0, players.batter.anim.runToFirst - dt);
            const targetX = BASES.first.x - 26;
            const targetY = BASES.first.y + 20;
            players.batter.x += (targetX - players.batter.x) * Math.min(1, dt * 3.5);
            players.batter.y += (targetY - players.batter.y) * Math.min(1, dt * 3.5);
            players.batter.anim.vx = 110;
            players.batter.anim.vy = -40;
          } else {
            players.batter.x += (players.batter.baseX - players.batter.x) * Math.min(1, dt * 4);
            players.batter.y += (players.batter.baseY - players.batter.y) * Math.min(1, dt * 4);
            players.batter.anim.vx *= 0.8;
            players.batter.anim.vy *= 0.8;
          }
        }

        function applyFieldingSupportMotion(dt) {
          if (game.phase !== PHASE.FIELDING || !game.battedBall) return;
          const selected = players.defense[game.selectedFielder ?? -1];
          if (!selected) return;
          for (const f of players.defense) {
            if (f === selected) continue;
            const dx = game.battedBall.x - f.x;
            const dy = game.battedBall.y - f.y;
            const d = Math.hypot(dx, dy);
            if (d > 1) {
              const step = 55 * dt;
              f.x += (dx / d) * step;
              f.y += (dy / d) * step;
              clampPlayer(f);
            }
          }
        }

        function updatePopups(dt) {
          for (let i = game.popupTexts.length - 1; i >= 0; i -= 1) {
            const p = game.popupTexts[i];
            p.age += dt;
            if (p.kind !== "result") p.y -= 26 * dt;
            if (p.age >= p.duration) game.popupTexts.splice(i, 1);
          }
        }

        function updateParticles(dt) {
          const list = [game.particles, game.fireworks];
          for (const arr of list) {
            for (let i = arr.length - 1; i >= 0; i -= 1) {
              const p = arr[i];
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy += 160 * dt;
              p.life -= dt;
              if (p.life <= 0) arr.splice(i, 1);
            }
          }
          game.flashAlpha = Math.max(0, game.flashAlpha - dt * 1.6);
          game.shake = Math.max(0, game.shake - dt * 1.5);
        }

        function resizeCanvas() {
          const rect = fieldWrap.getBoundingClientRect();
          canvas.style.width = `${Math.floor(rect.width)}px`;
          canvas.style.height = `${Math.floor(rect.height)}px`;
        }

        function draw() {
          const shakeX = game.shake > 0 ? (Math.random() - 0.5) * 10 : 0;
          const shakeY = game.shake > 0 ? (Math.random() - 0.5) * 8 : 0;
          const cameraYOffset = 0;

          ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
          ctx.save();
          ctx.translate(shakeX, shakeY + cameraYOffset);
          drawBackground();
          drawField();
          drawPlayers();
          drawBall();
          drawRunnerAnimations();
          drawParticlesLayer();
          ctx.restore();

          drawPopups();
          drawTransitionText();
          drawDebug();

          if (game.flashAlpha > 0) {
            ctx.fillStyle = `rgba(255,255,255,${game.flashAlpha})`;
            ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
          }
        }

        function drawBackground() {
          ctx.fillStyle = "#87CEEB";
          ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

          ctx.fillStyle = "#ffca42";
          ctx.beginPath();
          ctx.arc(1160, 90, 44, 0, Math.PI * 2);
          ctx.fill();

          drawCloud(160, 90, 1.05);
          drawCloud(330, 60, 0.78);
          drawCloud(940, 120, 0.9);

          ctx.fillStyle = "#1a2f3e";
          for (let i = 0; i < 180; i += 1) {
            const x = (i * 8.5) % VIRTUAL_WIDTH;
            const y = 152 + Math.sin(i * 0.6) * 6;
            ctx.fillRect(x, y, 6, 12);
          }
        }

        function drawCloud(x, y, s) {
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(x, y, 28 * s, 0, Math.PI * 2);
          ctx.arc(x + 30 * s, y + 2 * s, 22 * s, 0, Math.PI * 2);
          ctx.arc(x - 24 * s, y + 6 * s, 20 * s, 0, Math.PI * 2);
          ctx.fill();
        }

        function drawField() {
          const wallTop = FIELD.wallY;
          const wallHeight = 26;
          const warningTrackTop = wallTop + wallHeight;
          const warningTrackHeight = 14;
          const grassTop = warningTrackTop + warningTrackHeight;

          drawStadiumStands(wallTop);

          // Outfield wall + top padding blocks
          ctx.fillStyle = "#24572f";
          ctx.fillRect(0, wallTop, VIRTUAL_WIDTH, wallHeight);
          const padColors = ["#356f41", "#2f6240", "#457d4d", "#2b5d38"];
          for (let x = 0; x < VIRTUAL_WIDTH; x += 10) {
            ctx.fillStyle = padColors[Math.floor(x / 10) % padColors.length];
            ctx.fillRect(x, wallTop - 5, 8, 5);
          }

          drawFenceSign(VIRTUAL_WIDTH * 0.5, wallTop + 11, "400 FT", 78);
          drawFenceSign(84, wallTop + 11, "330 FT", 60);
          drawFenceSign(VIRTUAL_WIDTH - 84, wallTop + 11, "330 FT", 60);

          // Foul poles
          ctx.strokeStyle = "#f9d52f";
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(84, wallTop + wallHeight);
          ctx.lineTo(84, wallTop - 140);
          ctx.moveTo(VIRTUAL_WIDTH - 84, wallTop + wallHeight);
          ctx.lineTo(VIRTUAL_WIDTH - 84, wallTop - 140);
          ctx.stroke();

          // Warning track
          ctx.fillStyle = "#C4A882";
          ctx.fillRect(0, warningTrackTop, VIRTUAL_WIDTH, warningTrackHeight);

          // Outfield grass + visible mowing stripes
          ctx.fillStyle = "#4CAF50";
          ctx.fillRect(0, grassTop, VIRTUAL_WIDTH, VIRTUAL_HEIGHT - grassTop);
          for (let x = 0; x < VIRTUAL_WIDTH; x += 50) {
            ctx.fillStyle = (Math.floor(x / 50) % 2 === 0) ? "rgba(0, 0, 0, 0.09)" : "rgba(255, 255, 255, 0.08)";
            ctx.fillRect(x, grassTop, 24, VIRTUAL_HEIGHT - grassTop);
          }

          const dirtHome = { x: BASES.home.x, y: BASES.home.y + 26 };
          const dirtFirst = { x: BASES.first.x + 120, y: BASES.first.y + 6 };
          const dirtSecond = { x: BASES.second.x, y: BASES.second.y - 92 };
          const dirtThird = { x: BASES.third.x - 120, y: BASES.third.y + 6 };
          const infieldCenter = { x: BASES.mound.x, y: BASES.mound.y + 20 };

          // Infield dirt diamond
          ctx.fillStyle = "#C49A6C";
          ctx.beginPath();
          ctx.moveTo(dirtHome.x, dirtHome.y);
          ctx.lineTo(dirtFirst.x, dirtFirst.y);
          ctx.lineTo(dirtSecond.x, dirtSecond.y);
          ctx.lineTo(dirtThird.x, dirtThird.y);
          ctx.closePath();
          ctx.fill();

          // Infield grass wedges
          ctx.fillStyle = "#3E9850";
          fillTriangle(infieldCenter, BASES.home, BASES.first);
          fillTriangle(infieldCenter, BASES.first, BASES.second);
          fillTriangle(infieldCenter, BASES.second, BASES.third);
          fillTriangle(infieldCenter, BASES.third, BASES.home);

          // Base paths
          ctx.strokeStyle = "#B88A5A";
          ctx.lineWidth = 22;
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(BASES.home.x, BASES.home.y + 2);
          ctx.lineTo(BASES.first.x, BASES.first.y);
          ctx.lineTo(BASES.second.x, BASES.second.y);
          ctx.lineTo(BASES.third.x, BASES.third.y);
          ctx.closePath();
          ctx.stroke();

          drawBase(BASES.first.x, BASES.first.y);
          drawBase(BASES.second.x, BASES.second.y);
          drawBase(BASES.third.x, BASES.third.y);
          drawHomePlate(BASES.home.x, BASES.home.y);

          // Mound + rubber strip
          ctx.fillStyle = "#B98A5A";
          ctx.beginPath();
          ctx.arc(BASES.mound.x, BASES.mound.y + 18, 44, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#CDA172";
          ctx.beginPath();
          ctx.arc(BASES.mound.x, BASES.mound.y + 16, 35, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(BASES.mound.x - 13, BASES.mound.y + 12, 26, 4);

          // Foul lines
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(BASES.home.x, BASES.home.y);
          ctx.lineTo(VIRTUAL_WIDTH - 84, wallTop + wallHeight + warningTrackHeight);
          ctx.moveTo(BASES.home.x, BASES.home.y);
          ctx.lineTo(84, wallTop + wallHeight + warningTrackHeight);
          ctx.stroke();
        }

        function fillTriangle(a, b, c) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.lineTo(c.x, c.y);
          ctx.closePath();
          ctx.fill();
        }

        function drawFenceSign(x, y, label, width) {
          ctx.fillStyle = "#f4d13a";
          ctx.strokeStyle = "#1b2d1e";
          ctx.lineWidth = 2;
          roundRect(ctx, x - width / 2, y - 10, width, 20, 4);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#20361f";
          ctx.font = '8px "Press Start 2P"';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(label, x, y + 1);
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";
        }

        function drawStadiumStands(wallTop) {
          const standsTop = SKY_BAND_Y - 8;
          const standsBottom = wallTop - 2;
          const rows = 5;
          const rowH = (standsBottom - standsTop) / rows;

          ctx.fillStyle = "#2f4a34";
          ctx.fillRect(0, standsTop, VIRTUAL_WIDTH, standsBottom - standsTop);

          for (let r = 0; r < rows; r += 1) {
            const y = standsTop + r * rowH;
            ctx.fillStyle = r % 2 === 0 ? "#33573a" : "#27452e";
            ctx.fillRect(0, y, VIRTUAL_WIDTH, rowH - 2);
            for (let x = 6; x < VIRTUAL_WIDTH - 6; x += 9) {
              const ci = (x + r) % game.crowd.length;
              const fan = game.crowd[ci];
              const waveY = fan.wave > 0 ? -3 * Math.sin((1 - fan.wave) * Math.PI) : 0;
              const moodDrop = game.crowdMoodDown * 2;
              const jumpY = game.crowdJump > 0 ? -6 * Math.sin(game.crowdJump * Math.PI) : 0;
              const fy = y + rowH * 0.56 + waveY + jumpY + moodDrop;
              ctx.fillStyle = "#f7d5b0";
              ctx.fillRect(x, fy - 4, 2, 2);
              ctx.fillStyle = fan.color;
              ctx.fillRect(x - 1, fy - 2, 4, 4);
            }
          }

          ctx.fillStyle = "#20374a";
          roundRect(ctx, VIRTUAL_WIDTH / 2 - 74, standsTop - 20, 148, 18, 4);
          ctx.fill();
          ctx.fillStyle = "#f1f6ff";
          ctx.font = '8px "Press Start 2P"';
          ctx.textAlign = "center";
          ctx.fillText("CITY PARK", VIRTUAL_WIDTH / 2, standsTop - 7);
          ctx.textAlign = "left";
        }
        function drawBase(x, y) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = "rgba(0,0,0,0.22)";
          ctx.fillRect(-10, -6, 26, 8);
          ctx.fillStyle = "#fff";
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 2.4;
          ctx.fillRect(-12, -12, 24, 24);
          ctx.strokeRect(-12, -12, 24, 24);
          ctx.restore();
        }

        function drawHomePlate(x, y) {
          ctx.save();
          ctx.translate(x, y);
          ctx.fillStyle = "#fff";
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(14, -12);
          ctx.lineTo(10, -30);
          ctx.lineTo(-10, -30);
          ctx.lineTo(-14, -12);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        function drawPlayers() {
          for (const f of players.defense) drawPlayer(f, false, f === players.defense[game.selectedFielder ?? -1]);
          drawPlayer(players.batter, true, false);
        }

        function drawPlayer(p, isBatter, selected) {
          const walkFrame = Math.floor(performance.now() / 90) % 2;
          const anim = p.anim || {};
          const bobY = anim.bobY || 0;
          const shiftX = anim.shiftX || 0;
          const leanY = anim.readyLeanY || 0;
          const runFrame = anim.runFrame || 0;
          const scale = 1.26;

          ctx.save();
          ctx.translate(p.x + shiftX, p.y + bobY + leanY);
          ctx.scale(scale, scale);

          ctx.fillStyle = "rgba(0,0,0,0.22)";
          ctx.beginPath();
          ctx.ellipse(0, 19, 18, 7, 0, 0, Math.PI * 2);
          ctx.fill();

          const teamColor = p.team === "red" ? "#f04444" : "#3f67ff";
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 2.6;

          const moving = Math.abs(anim.vx || 0) + Math.abs(anim.vy || 0) > 20;
          const legFrame = moving ? runFrame : walkFrame;

          ctx.beginPath();
          if (legFrame % 3 === 0) {
            ctx.moveTo(-5, 10);
            ctx.lineTo(-11, 24);
            ctx.moveTo(5, 10);
            ctx.lineTo(11, 24);
          } else if (legFrame % 3 === 1) {
            ctx.moveTo(-5, 10);
            ctx.lineTo(-8, 24);
            ctx.moveTo(5, 10);
            ctx.lineTo(12, 24);
          } else {
            ctx.moveTo(-5, 10);
            ctx.lineTo(-12, 24);
            ctx.moveTo(5, 10);
            ctx.lineTo(8, 24);
          }
          ctx.stroke();

          ctx.fillStyle = teamColor;
          ctx.fillRect(-11, -5, 22, 18);
          ctx.strokeRect(-11, -5, 22, 18);

          ctx.fillStyle = "#ffd6b0";
          ctx.beginPath();
          ctx.arc(0, -18, 13, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = p.team === "red" ? "#d13030" : "#2d4be0";
          ctx.fillRect(-13, -27, 26, 8);
          ctx.strokeRect(-13, -27, 26, 8);

          if (p.role === "pitcher") {
            const cycle = Math.min(1, game.phase === PHASE.PITCHING ? game.phaseTimer / 0.45 : 0);
            let armY = -2;
            if (cycle < 0.33) armY = -2 - cycle * 38;
            else if (cycle < 0.66) armY = -14 + (cycle - 0.33) * 66;
            else armY = 8 - (cycle - 0.66) * 18;
            ctx.beginPath();
            ctx.moveTo(11, 2);
            ctx.lineTo(20, armY);
            ctx.stroke();
          }

          if (p.anim?.armsUp > 0) {
            ctx.beginPath();
            ctx.moveTo(-8, -3);
            ctx.lineTo(-14, -18);
            ctx.moveTo(8, -3);
            ctx.lineTo(14, -18);
            ctx.stroke();
          }

          if (isBatter) {
            const missWobble = p.anim?.missWobble || 0;
            ctx.rotate(missWobble);
            const waggle = Math.sin(performance.now() / 260) * (Math.PI / 36);
            const swingT = Math.max(0, Math.min(1, 1 - players.batter.swing / 0.3));
            const swingA = players.batter.swing > 0 ? (-1.45 + swingT * 2.5) : waggle;
            ctx.save();
            ctx.translate(13, -2);
            ctx.rotate(swingA);
            ctx.fillStyle = "#d6b37e";
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 2;
            ctx.fillRect(-2, -27, 5, 31);
            ctx.strokeRect(-2, -27, 5, 31);
            ctx.restore();
          }

          if (selected) {
            ctx.strokeStyle = "#ffe466";
            ctx.lineWidth = 2.4;
            ctx.strokeRect(-20, -34, 40, 62);
          }

          ctx.restore();
        }

        function drawBall() {
          const b = game.pitchBall || game.throwBall || game.battedBall;
          if (!b) return;

          if (b.trail) {
            for (let i = 0; i < b.trail.length; i += 1) {
              const t = b.trail[i];
              const alpha = (i + 1) / (b.trail.length + 1) * 0.38;
              const radius = 7 - (b.trail.length - i) * 0.8;
              drawBallSprite(t.x, t.y - (t.z || 0), Math.max(2, radius), alpha);
            }
          }
          drawBallSprite(b.x, b.y - (b.z || 0), 8, 1);
        }

        function drawBallSprite(x, y, r, alpha) {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = "#fff";
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = "#d74a4a";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(x - 1, y, r * 0.62, -1.15, -0.35);
          ctx.arc(x + 1, y, r * 0.62, 2.8, 3.95);
          ctx.stroke();
          ctx.restore();
        }

        function drawRunnerAnimations() {
          for (const r of game.runnerAnims) {
            const t = Math.min(1, r.t);
            const x = r.fromX + (r.toX - r.fromX) * t;
            const y = r.fromY + (r.toY - r.fromY) * t;
            if (r.slide && t > 0.84) {
              ctx.save();
              ctx.translate(x, y + 2);
              ctx.rotate(-0.28);
              ctx.scale(1.16, 0.82);
              drawPlayer({ team: "red", x: 0, y: 0, role: "runner", swing: 0, anim: { vx: 120, vy: 0, runFrame: 2 } }, false, false);
              ctx.restore();
            } else {
              drawPlayer({ team: "red", x, y, role: "runner", swing: 0, anim: { vx: 90, vy: 0, runFrame: 1 } }, false, false);
            }
          }
        }

        function drawParticlesLayer() {
          for (const p of game.particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
          for (const f of game.fireworks) {
            ctx.fillStyle = f.color;
            ctx.globalAlpha = Math.max(0, f.life);
            ctx.fillRect(f.x, f.y, f.size, f.size);
          }
          ctx.globalAlpha = 1;
        }
        function drawPopups() {
          for (const p of game.popupTexts) {
            const progress = Math.min(1, p.age / p.duration);
            let alpha = 1 - progress;
            let scale = 1;

            if (p.kind === "result") {
              if (progress < 0.18) {
                scale = 0.5 + (1.2 - 0.5) * (progress / 0.18);
              } else if (progress < 0.34) {
                scale = 1.2 + (1.0 - 1.2) * ((progress - 0.18) / 0.16);
              }

              if (progress < 0.08) {
                alpha = 0.78 * (progress / 0.08);
              } else if (progress < 0.86) {
                alpha = 0.78;
              } else {
                alpha = 0.78 * (1 - ((progress - 0.86) / 0.14));
              }
            }

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.scale(scale, scale);
            ctx.globalAlpha = Math.max(0, alpha);
            ctx.fillStyle = p.color;
            ctx.font = `${p.size}px "Press Start 2P"`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0, 0, 0, 0.88)";
            ctx.shadowBlur = 12;
            ctx.fillText(p.text, 0, 0);
            ctx.restore();
          }
          ctx.globalAlpha = 1;
        }

        function drawTransitionText() {
          if (game.phase !== PHASE.INNING_TRANSITION) return;
          ctx.fillStyle = "rgba(255,255,255,0.84)";
          ctx.fillRect(250, 260, 780, 160);
          ctx.strokeStyle = "#2d8ab9";
          ctx.lineWidth = 5;
          ctx.strokeRect(250, 260, 780, 160);
          ctx.fillStyle = "#1e4c71";
          ctx.font = '28px "Press Start 2P"';
          const txt = game.transitionText || `INNING ${game.inning} - ${game.half}`;
          const w = ctx.measureText(txt).width;
          ctx.fillText(txt, 640 - w / 2, 350);
        }

        function drawDebug() {
          if (!game.debugVisible) return;
          ctx.fillStyle = "rgba(255,255,255,0.86)";
          ctx.fillRect(16, 16, 370, 120);
          ctx.strokeStyle = "#1d5b83";
          ctx.lineWidth = 2;
          ctx.strokeRect(16, 16, 370, 120);
          ctx.fillStyle = "#173d59";
          ctx.font = '10px "Press Start 2P"';
          ctx.fillText(`STATE: ${game.phase}`, 26, 40);
          ctx.fillText(`PLAYERS: ${players.defense.length + 1}`, 26, 60);
          ctx.fillText(`BALL: ${game.pitchBall ? "PITCH" : game.battedBall ? "HIT" : "IDLE"}`, 26, 80);
          ctx.fillText(`SELECTED: ${game.selectedFielder ?? "-"}`, 26, 100);
          ctx.fillText(`ACTION: ${game.lastAction}`, 26, 120);
        }

        function roundRect(context, x, y, w, h, r) {
          context.beginPath();
          context.moveTo(x + r, y);
          context.lineTo(x + w - r, y);
          context.quadraticCurveTo(x + w, y, x + w, y + r);
          context.lineTo(x + w, y + h - r);
          context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          context.lineTo(x + r, y + h);
          context.quadraticCurveTo(x, y + h, x, y + h - r);
          context.lineTo(x, y + r);
          context.quadraticCurveTo(x, y, x + r, y);
          context.closePath();
        }

        function updateSwingButtonState() {
          const battingTurn = game.phase === PHASE.PITCH_FLIGHT || game.phase === PHASE.BATTING_WINDOW;
          swingButton.classList.toggle("active", battingTurn);
          swingButton.classList.toggle("locked", !battingTurn);
          swingButton.setAttribute("aria-disabled", battingTurn ? "false" : "true");
        }

        function update(dt) {
          if (game.phase === PHASE.GAME_OVER) {
            updateParticles(dt);
            updatePopups(dt);
            draw();
            clearInputFlags();
            return;
          }

          if (game.phase === PHASE.NEXT_BATTER) {
            game.phaseTimer += dt;
            if (game.phaseTimer > 0.7) beginPitch();
          } else if (game.phase === PHASE.PITCHING) {
            game.phaseTimer += dt;
            if (game.phaseTimer >= 0.45) throwPitch();
          } else if (game.phase === PHASE.PITCH_FLIGHT || game.phase === PHASE.BATTING_WINDOW) {
            updatePitch(dt);
            if (input.swingPressedThisFrame || input.keysPressed.has(" ")) {
              swingAtPitch();
            }
          } else if (game.phase === PHASE.FIELDING) {
            updateBattedBall(dt);
            updateFielding(dt);
            updateThrow(dt);
          } else if (game.phase === PHASE.INNING_TRANSITION) {
            game.phaseTimer += dt;
            if (game.phaseTimer > 1.3) {
              game.phase = PHASE.NEXT_BATTER;
              game.phaseTimer = 0;
              setStatus(`Inning ${game.inning} ${game.half}.`);
            }
          }

          if (game.battedBall && game.phase !== PHASE.FIELDING) {
            updateBattedBall(dt);
          }

          if (players.batter.swing > 0) {
            players.batter.swing = Math.max(0, players.batter.swing - dt);
          }

          updateRunnerAnims(dt);
          updatePlayerAnimations(dt);
          applyFieldingSupportMotion(dt);
          updateCrowd(dt);
          updateParticles(dt);
          updatePopups(dt);
          updateSwingButtonState();
          draw();
          clearInputFlags();
        }

        function ensureStateValidity() {
          const valid = Object.values(PHASE);
          if (!valid.includes(game.phase)) {
            game.phase = PHASE.NEXT_BATTER;
          }
          if (players.defense.length < 9) initPlayers();
        }

        function resumeAudio() {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startAmbient();
          }
          if (audioCtx.state === "suspended") audioCtx.resume();
        }

        function playBatCrack() {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.04);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        }

        function playCrowdCheer() {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const noise = createNoiseSource(1.0, 0.14);
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(440, now + 0.65);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.7);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.72);
          noise.start(now);
          noise.stop(now + 0.75);
        }

        function playStrikeMiss() {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.14);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        }

        function playCatchThud() {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(70, now + 0.11);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        }

        function createNoiseSource(duration, gainValue) {
          const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2 - 1) * 0.38;
          const source = audioCtx.createBufferSource();
          source.buffer = buffer;
          const filter = audioCtx.createBiquadFilter();
          filter.type = "bandpass";
          filter.frequency.value = 680;
          const gain = audioCtx.createGain();
          gain.gain.value = gainValue;
          source.connect(filter).connect(gain).connect(audioCtx.destination);
          return source;
        }

        function startAmbient() {
          if (!audioCtx || ambientSource) return;
          const duration = 2.2;
          const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2 - 1) * 0.12;
          ambientSource = audioCtx.createBufferSource();
          ambientSource.buffer = buffer;
          ambientSource.loop = true;
          const filter = audioCtx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.value = 450;
          ambientGain = audioCtx.createGain();
          ambientGain.gain.value = 0.018;
          ambientSource.connect(filter).connect(ambientGain).connect(audioCtx.destination);
          ambientSource.start();
        }

        function bindInput() {
          window.addEventListener("keydown", (e) => {
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            if (!input.keysHeld.has(key)) input.keysPressed.add(key);
            input.keysHeld.add(key);
            if (key === " ") e.preventDefault();
            if (key === "~" || key === "`") game.debugVisible = !game.debugVisible;
            choosePitchTypeFromKey(key);
            if (key === " ") registerSwing();
            resumeAudio();
          });

          window.addEventListener("keyup", (e) => {
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            input.keysHeld.delete(key);
          });

          canvas.addEventListener("pointerdown", () => {
            registerSwing();
            resumeAudio();
          });
          swingButton.addEventListener("pointerdown", () => {
            registerSwing();
            resumeAudio();
          });
          restartButton.addEventListener("click", () => {
            restartGame();
          });
        }

        function restartGame() {
          if (game.playResultTimeout) clearTimeout(game.playResultTimeout);
          game.playResultTimeout = null;
          game.inning = 1;
          game.half = "TOP";
          game.outs = 0;
          game.balls = 0;
          game.strikes = 0;
          game.score.comets = 0;
          game.score.foxes = 0;
          game.phase = PHASE.NEXT_BATTER;
          game.phaseTimer = 0;
          game.lockInput = false;
          game.transitionText = "";
          game.baseRunners = [false, false, false];
          game.runnerAnims = [];
          game.popupTexts = [];
          game.particles = [];
          game.fireworks = [];
          game.flashAlpha = 0;
          game.shake = 0;
          game.winner = "";
          game.pitchBall = null;
          game.battedBall = null;
          game.throwBall = null;
          game.selectedFielder = null;
          game.swingUsed = false;
          game.pitchActive = false;
          game.hitDetected = false;
          game.throwActive = false;
          game.ballInPlayTime = 0;
          game.ballDeadTime = 0;
          game.crowdWaveTimer = 2.2;
          game.crowdJump = 0;
          game.crowdMoodDown = 0;
          gameOverOverlay.style.display = "none";
          setStatus("PITCH NOW: Press SPACE or SWING to bat.");
          setAction("PITCH NOW", "CPU preparing next pitch", "#28b7ff");
          updateSwingButtonState();
          initPlayers();
          updateScoreboard();
        }

        let last = performance.now();
        function frame(now) {
          const dt = Math.min(0.033, (now - last) / 1000);
          last = now;
          ensureStateValidity();
          update(dt);
          requestAnimationFrame(frame);
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
        bindInput();
        initPlayers();
        updateScoreboard();
        setAction("PITCH NOW", "CPU preparing next pitch", "#28b7ff");
        setStatus("PITCH NOW: Press SPACE or SWING to bat.");
        updateSwingButtonState();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
