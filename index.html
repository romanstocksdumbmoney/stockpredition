          ctx.fillRect(BASES.mound.x - 13, BASES.mound.y + 12, 26, 4);

          // Foul lines
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(BASES.home.x, BASES.home.y);
          ctx.lineTo(VIRTUAL_WIDTH - 84, wallTop + wallHeight + warningTrackHeight);
          ctx.moveTo(BASES.home.x, BASES.home.y);
          ctx.lineTo(84, wallTop + wallHeight + warningTrackHeight);
          ctx.stroke();

          const vignette = ctx.createRadialGradient(640, 420, 240, 640, 420, 760);
          vignette.addColorStop(0, "rgba(0,0,0,0)");
          vignette.addColorStop(1, "rgba(0,0,0,0.16)");
          ctx.fillStyle = vignette;
          ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
        }

        function fillTriangle(a, b, c) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.lineTo(c.x, c.y);
          ctx.closePath();
          ctx.fill();
        }

        function drawFenceSign(x, y, label, width) {
          ctx.fillStyle = "#f4d13a";
          ctx.strokeStyle = "#1b2d1e";
          ctx.lineWidth = 2;
          roundRect(ctx, x - width / 2, y - 10, width, 20, 4);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#20361f";
          ctx.font = '8px "Press Start 2P"';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(label, x, y + 1);
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";
        }

        function drawStadiumStands(wallTop) {
          const standsTop = Math.round(VIRTUAL_HEIGHT * 0.22);
          const standsBottom = wallTop - 2;
          const rows = 5;
          const rowH = (standsBottom - standsTop) / rows;

          ctx.fillStyle = "#21432a";
          ctx.fillRect(0, standsTop, VIRTUAL_WIDTH, standsBottom - standsTop);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 3;
          ctx.strokeRect(0, standsTop, VIRTUAL_WIDTH, standsBottom - standsTop);

          const crowdColors = ["#E8272A", "#1E6FD9", "#FFD84D", "#FFFFFF"];
          for (let r = 0; r < rows; r += 1) {
            const y = standsTop + r * rowH;
            ctx.fillStyle = r % 2 === 0 ? "#2d5535" : "#264a2f";
            ctx.fillRect(0, y, VIRTUAL_WIDTH, rowH - 2);
            for (let x = 8; x < VIRTUAL_WIDTH - 8; x += 10) {
              const ci = (x + r) % game.crowd.length;
              const fan = game.crowd[ci];
              const waveY = fan.wave > 0 ? -3 * Math.sin((1 - fan.wave) * Math.PI) : 0;
              const moodDrop = game.crowdMoodDown * 2;
              const jumpY = game.crowdJump > 0 ? -6 * Math.sin(game.crowdJump * Math.PI) : 0;
              const fy = y + rowH * 0.6 + waveY + jumpY + moodDrop;
              const color = fan?.color || crowdColors[(x + r) % crowdColors.length];
              ctx.fillStyle = color;
              ctx.beginPath();
              ctx.arc(x, fy, 3, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // press box
          ctx.textAlign = "left";
        }

        function drawBase(x, y, occupied = false) {
          ctx.save();
          const pulse = (Math.sin(performance.now() / 260) + 1) * 0.5;
          if (occupied) {
            ctx.fillStyle = `rgba(255, 221, 92, ${0.18 + pulse * 0.2})`;
            ctx.beginPath();
            ctx.ellipse(x, y + 8, 20 + pulse * 4, 8 + pulse * 2, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.translate(x, y);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = "rgba(0,0,0,0.22)";
          ctx.fillRect(-10, -6, 26, 8);
          ctx.fillStyle = occupied ? "#fff7c7" : "#ffffff";
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 2.4;
          ctx.fillRect(-12, -12, 24, 24);
          ctx.strokeRect(-12, -12, 24, 24);
          ctx.restore();
        }

        function drawHomePlate(x, y) {
          ctx.save();
          ctx.translate(x, y);
          ctx.fillStyle = "#fff";
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(14, -12);
          ctx.lineTo(10, -30);
          ctx.lineTo(-10, -30);
          ctx.lineTo(-14, -12);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        function drawPlayers() {
          const primaryIdx = game.fieldingPlan?.primaryIndex ?? game.selectedFielder ?? -1;
          for (const f of players.defense) drawPlayer(f, false, f === players.defense[primaryIdx]);
          drawPlayer(players.batter, true, false);
        }

        function drawPlayer(p, isBatter, selected) {
          const walkFrame = Math.floor(performance.now() / 90) % 2;
          const anim = p.anim || {};
          const bobY = anim.bobY || 0;
          const shiftX = anim.shiftX || 0;
          const leanY = anim.readyLeanY || 0;
          const runFrame = anim.runFrame || 0;
          const dive = anim.dive || 0;
          const checkTimer = anim.checkTimer || 0;
          const isOutfieldRole = p.role === "left" || p.role === "center" || p.role === "right";
          const baseScale = isOutfieldRole ? 1.07 : 1.26;
          const scale = p.role === "runner" ? (isOutfieldRole ? 0.9 : 1.05) : baseScale;

          ctx.save();
          const checkNudge = checkTimer > 0 ? Math.sin(checkTimer * 26) * 1.4 : 0;
          ctx.translate(p.x + shiftX, p.y + bobY + leanY + checkNudge);
          if (dive > 0) {
            const d = Math.min(1, dive / 0.42);
            ctx.translate(d * 11, d * 4);
            ctx.rotate(-0.95 * d);
            ctx.scale(1 + 0.3 * d, 1 - 0.44 * d);
          }
          ctx.scale(scale, scale);

          ctx.fillStyle = "rgba(0,0,0,0.22)";
          ctx.beginPath();
          ctx.ellipse(0, 19, 18, 7, 0, 0, Math.PI * 2);
          ctx.fill();

          const teamColor = p.team === "red" ? "#c0392b" : "#2980b9";
          const capColor = p.team === "red" ? "#9f2f24" : "#1f5e88";
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 2.2;

          const moving = Math.abs(anim.vx || 0) + Math.abs(anim.vy || 0) > 20;
          const legFrame = moving ? runFrame : walkFrame;

          // legs
          ctx.beginPath();
          if (legFrame % 3 === 0) {
            ctx.moveTo(-5, 10);
            ctx.lineTo(-12, 24);
            ctx.moveTo(5, 10);
            ctx.lineTo(11, 24);
          } else if (legFrame % 3 === 1) {
            ctx.moveTo(-5, 10);
            ctx.lineTo(-8, 24);
            ctx.moveTo(5, 10);
            ctx.lineTo(12, 24);
          } else {
            ctx.moveTo(-5, 10);
            ctx.lineTo(-11, 24);
            ctx.moveTo(5, 10);
            ctx.lineTo(8, 24);
          }
          ctx.stroke();

          // torso + pinstripes
          ctx.fillStyle = teamColor;
          roundRect(ctx, -11, -6, 22, 19, 4);
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255,0.48)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-3, -5);
          ctx.lineTo(-3, 12);
          ctx.moveTo(3, -5);
          ctx.lineTo(3, 12);
          ctx.stroke();

          ctx.strokeStyle = "#111";
          ctx.lineWidth = 2.2;
          // arms
          let armLift = -0.3;
          if (anim.state === FIELDER_STATE.THROWING) armLift = -1.2;
          if (anim.state === FIELDER_STATE.FOLLOW_THROUGH) armLift = 0.65;
          if (anim.armsUp > 0) armLift = -1.45;

          ctx.save();
          ctx.translate(-9, -1);
          ctx.rotate(-0.2 + armLift * 0.35);
          roundRect(ctx, -2, -2, 4, 12, 2);
          ctx.fillStyle = "#f4c28a";
          ctx.fill();
          ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.translate(9, -1);
          ctx.rotate(0.2 + armLift);
          roundRect(ctx, -2, -2, 4, 12, 2);
          ctx.fillStyle = "#f4c28a";
          ctx.fill();
          ctx.stroke();
          // glove
          ctx.fillStyle = "#5a3622";
          ctx.beginPath();
          ctx.ellipse(2, 9, 4, 3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // head
          ctx.fillStyle = "#f4c28a";
          ctx.beginPath();
          ctx.arc(0, -18, 13, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // eyes + mouth
          ctx.fillStyle = "#1d1d1d";
          ctx.fillRect(-4, -20, 2, 2);
          ctx.fillRect(2, -20, 2, 2);
          ctx.strokeStyle = "#6d3c24";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(0, -14, 3.2, 0.2, Math.PI - 0.2);
          ctx.stroke();

          // cap/helmet
          ctx.fillStyle = capColor;
          roundRect(ctx, -13, -28, 26, 9, 3);
          ctx.fill();
          ctx.strokeStyle = "#111";
          ctx.stroke();
          if (isBatter) {
            ctx.fillStyle = "#1f2a44";
            roundRect(ctx, -14, -27, 28, 11, 4);
            ctx.fill();
            ctx.stroke();
          }
          if (p.role === "catcher") {
            ctx.strokeStyle = "#3f464d";
            ctx.lineWidth = 1;
            for (let gx = -8; gx <= 8; gx += 4) {
              ctx.beginPath();
              ctx.moveTo(gx, -26);
              ctx.lineTo(gx, -10);
              ctx.stroke();
            }
          }

          // pitcher motion
          if (p.role === "pitcher") {
            const cycle = Math.min(1, game.phase === PHASE.PITCHING ? game.phaseTimer / 0.45 : 0);
            let armY = -2;
            if (cycle < 0.33) armY = -2 - cycle * 38;
            else if (cycle < 0.66) armY = -14 + (cycle - 0.33) * 66;
            else armY = 8 - (cycle - 0.66) * 18;
            ctx.beginPath();
            ctx.moveTo(11, 2);
            ctx.lineTo(20, armY);
            ctx.stroke();
          }

          if (isBatter) {
            const missWobble = p.anim?.missWobble || 0;
            ctx.rotate(missWobble);
            const waggle = Math.sin(performance.now() / 260) * (Math.PI / 36);
            const swingT = Math.max(0, Math.min(1, 1 - players.batter.swing / 0.3));
            const swingA = players.batter.swing > 0 ? (-1.45 + swingT * 2.5) : waggle;
            ctx.save();
            ctx.translate(13, -2);
            ctx.rotate(swingA);
            ctx.fillStyle = "#d6b37e";
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 2;
            ctx.fillRect(-2, -29, 5, 33);
            ctx.strokeRect(-2, -29, 5, 33);
            ctx.restore();
          }

          if (selected) {
            ctx.strokeStyle = "#ffe466";
            ctx.lineWidth = 2.4;
            ctx.strokeRect(-20, -34, 40, 62);
          }

          ctx.restore();
        }

        function drawBall() {
          const b = game.pitchBall || game.throwBall || game.battedBall;
          if (!b) return;

          if (b.trail) {
            for (let i = 0; i < b.trail.length; i += 1) {
              const t = b.trail[i];
              const alpha = (i + 1) / (b.trail.length + 1) * 0.38;
              const radius = 7 - (b.trail.length - i) * 0.8;
              drawBallSprite(t.x, t.y - (t.z || 0), Math.max(2, radius), alpha);
            }
          }
          drawBallSprite(b.x, b.y - (b.z || 0), 8, 1);
        }

        function drawBallSprite(x, y, r, alpha) {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = "#fff";
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = "#d74a4a";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(x - 1, y, r * 0.62, -1.15, -0.35);
          ctx.arc(x + 1, y, r * 0.62, 2.8, 3.95);
          ctx.stroke();
          ctx.restore();
        }

        function getRunnerHoldPosition(baseIndex, lead = 0) {
          if (baseIndex === 0) return { x: BASES.first.x - 16 + lead, y: BASES.first.y + 14 };
          if (baseIndex === 1) return { x: BASES.second.x + lead * 0.45, y: BASES.second.y + 16 };
          return { x: BASES.third.x + 16 + lead, y: BASES.third.y + 14 };
        }

        function drawBaseRunners() {
          for (let i = 0; i < game.baseRunners.length; i += 1) {
            const runner = game.baseRunners[i];
            if (!runner) continue;
            const leadDir = i === 2 ? 1 : i === 1 ? 0.3 : 1;
            const pos = getRunnerHoldPosition(i, runner.lead * leadDir);
            drawPlayer({ team: runner.team || "red", x: pos.x, y: pos.y, role: "runner", swing: 0, anim: { vx: Math.abs(runner.lead) > 2 ? 35 : 0, vy: 0 } }, false, false);
          }
        }

        function drawActiveRunners() {
          for (const ar of activeRunners) {
            drawPlayer({
              team: ar.team || "red",
              x: ar.x,
              y: ar.y,
              role: "runner",
              swing: 0,
              anim: { vx: 95 + ar.frame * 8, vy: 0, runFrame: ar.frame }
            }, false, false);
          }
        }

        function drawParticlesLayer() {
          for (const p of game.particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
          for (const f of game.fireworks) {
            ctx.fillStyle = f.color;
            ctx.globalAlpha = Math.max(0, f.life);
            ctx.fillRect(f.x, f.y, f.size, f.size);
          }
          ctx.globalAlpha = 1;
        }

        function drawPopups() {
          for (const p of game.popupTexts) {
            const progress = Math.min(1, p.age / p.duration);
            let alpha = 1 - progress;
            let scale = 1;
            let yOffset = -progress * 28;

            if (p.kind === "result") {
              if (progress < 0.18) {
                scale = 0.05 + (1.2 - 0.05) * (progress / 0.18);
                yOffset = -58 + 58 * (progress / 0.18);
              } else if (progress < 0.35) {
                scale = 1.2 + (1.0 - 1.2) * ((progress - 0.18) / 0.17);
                yOffset = 0;
              } else {
                yOffset = -42 * ((progress - 0.35) / 0.65);
              }

              if (progress < 0.08) {
                alpha = 0.95 * (progress / 0.08);
              } else if (progress < 0.8) {
                alpha = 0.95;
              } else {
                alpha = 0.95 * (1 - ((progress - 0.8) / 0.2));
              }
              yOffset -= 6;
            }

            ctx.save();
            ctx.translate(p.x, p.y + yOffset);
            ctx.scale(scale, scale);
            ctx.globalAlpha = Math.max(0, alpha);
            ctx.fillStyle = p.color;
            ctx.font = `${p.size}px "Press Start 2P"`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0, 0, 0, 0.88)";
            ctx.shadowBlur = p.kind === "result" ? 16 : 10;
            if (p.kind === "result") {
              ctx.strokeStyle = "#111";
              ctx.lineWidth = 5;
              ctx.strokeText(p.text, 0, 0);
            }
            ctx.fillText(p.text, 0, 0);
            ctx.restore();
          }
          ctx.globalAlpha = 1;
        }

        function drawTransitionText() {
          if (game.phase !== PHASE.INNING_TRANSITION) return;
          const t = Math.min(1, game.phaseTimer / 0.3);
          const fadeOutStart = 2.3;
          const fadeOut = game.phaseTimer > fadeOutStart
            ? Math.max(0, 1 - ((game.phaseTimer - fadeOutStart) / 0.3))
            : 1;
          const alpha = Math.min(t, fadeOut);

          ctx.save();
          ctx.globalAlpha = Math.max(0, alpha);
          ctx.fillStyle = "rgba(10,15,46,0.72)";
          ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

          const battingTeam = game.half === "TOP" ? "COMETS BAT" : "FOXES BAT";
          const teamColor = game.half === "TOP" ? "#f34040" : "#3d66ff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = "#000";
          ctx.lineWidth = 5;
          ctx.font = '66px "Press Start 2P"';
          ctx.strokeText(`INNING ${game.inning}`, VIRTUAL_WIDTH * 0.5, VIRTUAL_HEIGHT * 0.42);
          ctx.fillText(`INNING ${game.inning}`, VIRTUAL_WIDTH * 0.5, VIRTUAL_HEIGHT * 0.42);

          ctx.font = '38px "Press Start 2P"';
          ctx.fillStyle = "#d4dcff";
          ctx.strokeText(game.half === "TOP" ? "TOP" : "BOTTOM", VIRTUAL_WIDTH * 0.5, VIRTUAL_HEIGHT * 0.53);
          ctx.fillText(game.half === "TOP" ? "TOP" : "BOTTOM", VIRTUAL_WIDTH * 0.5, VIRTUAL_HEIGHT * 0.53);

          ctx.font = '28px "Press Start 2P"';
          ctx.fillStyle = teamColor;
          ctx.strokeText(battingTeam, VIRTUAL_WIDTH * 0.5, VIRTUAL_HEIGHT * 0.63);
          ctx.fillText(battingTeam, VIRTUAL_WIDTH * 0.5, VIRTUAL_HEIGHT * 0.63);
          ctx.restore();
        }

        function showHitAnnouncement(hitType) {
          const messages = {
            homerun: { text: "HOME RUN!", color: "#ffd700", size: 74, shimmer: true },
            triple: { text: "TRIPLE!", color: "#ff7d20", size: 60 },
            double: { text: "DOUBLE!", color: "#24cbff", size: 60 },
            single: { text: "SINGLE!", color: "#4cff5a", size: 56 },
            groundout: { text: "OUT!", color: "#ff4d4d", size: 56 }
          };
          const msg = messages[hitType];
          if (!msg) return;
          spawnPopup(msg.text, msg.color, {
            kind: "result",
            x: VIRTUAL_WIDTH * 0.5,
            y: VIRTUAL_HEIGHT * 0.44,
            size: msg.size,
            duration: 1.8,
            shimmer: Boolean(msg.shimmer)
          });
        }

        function drawDebug() {
          if (!game.debugVisible) return;
          ctx.fillStyle = "rgba(255,255,255,0.86)";
          ctx.fillRect(16, 16, 370, 120);
          ctx.strokeStyle = "#1d5b83";
          ctx.lineWidth = 2;
          ctx.strokeRect(16, 16, 370, 120);
          ctx.fillStyle = "#173d59";
          ctx.font = '10px "Press Start 2P"';
          ctx.fillText(`STATE: ${game.phase}`, 26, 40);
          ctx.fillText(`PLAYERS: ${players.defense.length + 1}`, 26, 60);
          ctx.fillText(`BALL: ${game.pitchBall ? "PITCH" : game.battedBall ? "HIT" : "IDLE"}`, 26, 80);
          ctx.fillText(`SELECTED: ${game.selectedFielder ?? "-"}`, 26, 100);
          ctx.fillText(`ACTION: ${game.lastAction}`, 26, 120);
        }

        function roundRect(context, x, y, w, h, r) {
          context.beginPath();
          context.moveTo(x + r, y);
          context.lineTo(x + w - r, y);
          context.quadraticCurveTo(x + w, y, x + w, y + r);
          context.lineTo(x + w, y + h - r);
          context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          context.lineTo(x + r, y + h);
          context.quadraticCurveTo(x, y + h, x, y + h - r);
          context.lineTo(x, y + r);
          context.quadraticCurveTo(x, y, x + r, y);
          context.closePath();
        }

        function updateSwingButtonState() {
          const battingTurn = game.phase === PHASE.PITCH_FLIGHT || game.phase === PHASE.BATTING_WINDOW;
          swingButton.classList.toggle("active", battingTurn);
          swingButton.classList.toggle("locked", !battingTurn);
          swingButton.setAttribute("aria-disabled", battingTurn ? "false" : "true");
        }

        function update(dt) {
          if (game.phase === PHASE.GAME_OVER) {
            updateParticles(dt);
            updatePopups(dt);
            draw();
            clearInputFlags();
            return;
          }

          if (game.phase === PHASE.NEXT_BATTER) {
            game.phaseTimer += dt;
            if (game.phaseTimer > 0.7) beginPitch();
          } else if (game.phase === PHASE.PITCHING) {
            game.phaseTimer += dt;
            if (game.phaseTimer >= 0.45) throwPitch();
          } else if (game.phase === PHASE.PITCH_FLIGHT || game.phase === PHASE.BATTING_WINDOW) {
            updatePitch(dt);
            if (input.swingPressedThisFrame || input.keysPressed.has(" ")) {
              swingAtPitch();
            }
          } else if (game.phase === PHASE.FIELDING) {
            updateBattedBall(dt);
            updateFielding(dt);
            updateThrow(dt);
          } else if (game.phase === PHASE.INNING_TRANSITION) {
            game.phaseTimer += dt;
            if (game.phaseTimer > 2.6) {
              game.phase = PHASE.NEXT_BATTER;
              game.phaseTimer = 0;
              setStatus(`Inning ${game.inning} ${game.half}.`);
            }
          }

          if (game.battedBall && game.phase !== PHASE.FIELDING) {
            updateBattedBall(dt);
          }

          if (players.batter.swing > 0) {
            players.batter.swing = Math.max(0, players.batter.swing - dt);
          }

          updateActiveRunners();
          updatePlayerAnimations(dt);
          applyFieldingSupportMotion(dt);
          updateCrowd(dt);
          updateParticles(dt);
          updatePopups(dt);
          updateSwingButtonState();
          draw();
          clearInputFlags();
        }

        function ensureStateValidity() {
          const valid = Object.values(PHASE);
          if (!valid.includes(game.phase)) {
            game.phase = PHASE.NEXT_BATTER;
          }
          if (players.defense.length < 9) initPlayers();
        }

        function resumeAudio() {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startAmbient();
          }
          if (audioCtx.state === "suspended") audioCtx.resume();
        }

        function playBatCrack() {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.04);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        }

        function playCrowdCheer() {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const noise = createNoiseSource(1.0, 0.14);
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(440, now + 0.65);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.7);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.72);
          noise.start(now);
          noise.stop(now + 0.75);
        }

        function playStrikeMiss() {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.14);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        }

        function playCatchThud() {
          if (!audioCtx) return;
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(70, now + 0.11);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        }

        function createNoiseSource(duration, gainValue) {
          const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2 - 1) * 0.38;
          const source = audioCtx.createBufferSource();
          source.buffer = buffer;
          const filter = audioCtx.createBiquadFilter();
          filter.type = "bandpass";
          filter.frequency.value = 680;
          const gain = audioCtx.createGain();
          gain.gain.value = gainValue;
          source.connect(filter).connect(gain).connect(audioCtx.destination);
          return source;
        }

        function startAmbient() {
          if (!audioCtx || ambientSource) return;
          const duration = 2.2;
          const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2 - 1) * 0.12;
          ambientSource = audioCtx.createBufferSource();
          ambientSource.buffer = buffer;
          ambientSource.loop = true;
          const filter = audioCtx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.value = 450;
          ambientGain = audioCtx.createGain();
          ambientGain.gain.value = 0.018;
          ambientSource.connect(filter).connect(ambientGain).connect(audioCtx.destination);
          ambientSource.start();
        }

        function bindInput() {
          window.addEventListener("keydown", (e) => {
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            if (!input.keysHeld.has(key)) input.keysPressed.add(key);
            input.keysHeld.add(key);
            if (key === " ") e.preventDefault();
            if (key === "~" || key === "`") game.debugVisible = !game.debugVisible;
            choosePitchTypeFromKey(key);
            if (key === " ") registerSwing();
            resumeAudio();
          });

          window.addEventListener("keyup", (e) => {
            const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            input.keysHeld.delete(key);
          });

          canvas.addEventListener("pointerdown", () => {
            registerSwing();
            resumeAudio();
          });
          swingButton.addEventListener("pointerdown", () => {
            registerSwing();
            resumeAudio();
          });
          restartButton.addEventListener("click", () => {
            restartGame();
          });
        }

        function restartGame() {
          if (game.playResultTimeout) clearTimeout(game.playResultTimeout);
          game.playResultTimeout = null;
          game.inning = 1;
          game.half = "TOP";
          game.outs = 0;
          game.balls = 0;
          game.strikes = 0;
          game.score.comets = 0;
          game.score.foxes = 0;
          game.phase = PHASE.NEXT_BATTER;
          game.phaseTimer = 0;
          game.lockInput = false;
          game.transitionText = "";
          game.baseRunners = [null, null, null];
          activeRunners = [];
          game.nextRunnerId = 1;
          game.popupTexts = [];
          game.particles = [];
          game.fireworks = [];
          game.flashAlpha = 0;
          game.shake = 0;
          game.winner = "";
          game.pitchBall = null;
          game.battedBall = null;
          game.throwBall = null;
          game.selectedFielder = null;
          game.swingUsed = false;
          game.pitchActive = false;
          game.hitDetected = false;
          game.throwActive = false;
          game.ballInPlayTime = 0;
          game.ballDeadTime = 0;
          game.fieldingPlan = null;
          game.throwMeta = null;
          game.crowdWaveTimer = 2.2;
          game.crowdJump = 0;
          game.crowdMoodDown = 0;
          gameOverOverlay.style.display = "none";
          setStatus("PITCH NOW: Press SPACE or SWING to bat.");
          setAction("PITCH NOW", "CPU preparing next pitch", "#28b7ff");
          updateSwingButtonState();
          initPlayers();
          updateScoreboard();
        }

        let last = performance.now();
        function frame(now) {
          const dt = Math.min(0.033, (now - last) / 1000);
          last = now;
          ensureStateValidity();
          update(dt);
          requestAnimationFrame(frame);
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
        bindInput();
        initPlayers();
        updateScoreboard();
        setAction("PITCH NOW", "CPU preparing next pitch", "#28b7ff");
        setStatus("PITCH NOW: Press SPACE or SWING to bat.");
        updateSwingButtonState();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
