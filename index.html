    function updateLedSpeed() {
      let speed = 1.2;
      if (state.timeLeft <= 30) {
        speed = 0.16 + (state.timeLeft / 30) * 0.64;
      }
      document.documentElement.style.setProperty("--led-speed", `${speed.toFixed(2)}s`);
    }

    function drawBombDevice(ts = 0) {
      if (!bombCtx) return;
      const ctx = bombCtx;
      const canvas = el.bombCanvas;
      const w = canvas.width;
      const h = canvas.height;
      const pulse = 0.5 + 0.5 * Math.sin(ts / 1000 * Math.PI);
      const wireWiggle = Math.sin(ts / 280) * 4;

      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = "rgba(14, 18, 22, 0.95)";
      roundedRectPath(ctx, 20, 28, 180, 164, 16);
      ctx.fill();

      const glow = bombHover ? 0.55 : 0.22 + pulse * 0.1;
      ctx.strokeStyle = `rgba(120, 232, 255, ${glow})`;
      ctx.lineWidth = 2.2;
      roundedRectPath(ctx, 20, 28, 180, 164, 16);
      ctx.stroke();

      ctx.fillStyle = "#2a2a2a";
      roundedRectPath(ctx, 36, 48, 148, 108, 10);
      ctx.fill();
      ctx.strokeStyle = "#3b3b3b";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.strokeStyle = "#4caf50";
      ctx.lineWidth = 1.3;
      for (let i = 0; i < 5; i += 1) {
        const y = 62 + i * 16;
        ctx.beginPath();
        ctx.moveTo(50, y);
        ctx.lineTo(170 - (i % 2) * 14, y);
        ctx.stroke();
      }

      const ledRateMs = state.timeLeft <= 30 ? 180 : 520;
      const ledOn = Math.floor(ts / ledRateMs) % 2 === 0;
      ctx.beginPath();
      ctx.arc(171, 56, 6, 0, Math.PI * 2);
      ctx.fillStyle = ledOn ? "#ff3f3f" : "#611313";
      ctx.shadowColor = ledOn ? "rgba(255, 72, 72, 0.95)" : "transparent";
      ctx.shadowBlur = ledOn ? 13 : 0;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#0d1b0f";
      roundedRectPath(ctx, 58, 59, 84, 28, 5);
      ctx.fill();
      ctx.strokeStyle = "#345d36";
      ctx.stroke();
      ctx.fillStyle = "#90ff9a";
      ctx.font = "700 16px Rajdhani, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(formatTime(state.timeLeft), 100, 78);

      for (let i = 0; i < 9; i += 1) {
        const x = 39 + i * 18;
        ctx.fillStyle = i % 2 ? "#161616" : "#d0b041";
        ctx.fillRect(x, 143, 12, 13);
      }

      const wires = ["#d24f4f", "#f2d14d", "#58c776", "#f5f5f5"];
      wires.forEach((color, idx) => {
        const y = 72 + idx * 17;
        const sway = Math.sin(ts / 320 + idx) * 5 + wireWiggle * 0.3;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(36, y);
        ctx.bezierCurveTo(20 + sway, y - 7, 8 - sway, y + 10, 4, y + sway * 0.8);
        ctx.stroke();
      });

      if (Date.now() < state.bombFlashUntil) {
        ctx.fillStyle = "rgba(255, 70, 70, 0.24)";
        roundedRectPath(ctx, 20, 28, 180, 164, 16);
        ctx.fill();
      }
    }

    function randomFrom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function createSkinDrop(rarity) {
      return {
        kind: "skin",
        rarity,
        name: randomFrom(skinPools[rarity]),
        finish: "",
        cps: 0
      };
    }

    function getRandomKnifeType() {
      return randomFrom(knifeTypes);
    }

    function rollKnifeFinish() {
      const weighted = [
        { name: "Case Hardened", w: 16 },
        { name: "Doppler Phase 1", w: 9 },
        { name: "Doppler Phase 2", w: 9 },
        { name: "Doppler Phase 3", w: 4 },
        { name: "Doppler Phase 4", w: 9 },
        { name: "Fade", w: 4 },
        { name: "Marble Fade", w: 8 },
        { name: "Tiger Tooth", w: 9 },
        { name: "Slaughter", w: 9 },
        { name: "Crimson Web", w: 9 },
        { name: "Night", w: 10 },
        { name: "Blue Steel", w: 8 },
        { name: "Stained", w: 8 }
      ];
      const total = weighted.reduce((sum, item) => sum + item.w, 0);
      let roll = Math.random() * total;
      for (const item of weighted) {
        roll -= item.w;
        if (roll <= 0) return item.name;
      }
      return weighted[0].name;
    }

    function createKnifeDrop(forcedKnifeId = null) {
      const type = forcedKnifeId
        ? knifeTypes.find((knife) => knife.id === forcedKnifeId) || getRandomKnifeType()
        : getRandomKnifeType();
      const finish = rollKnifeFinish();
      const extra = finish === "Doppler Phase 3" || finish === "Fade" ? 2 : 0;
      return {
        kind: "knife",
        rarity: "knife",
        knifeId: type.id,
        name: type.name,
        finish,
        cps: type.cps + extra
      };
    }

    function randomFillerDrop() {
      const roll = Math.random();
      if (roll < 0.34) return createSkinDrop("consumer");
      if (roll < 0.58) return createSkinDrop("industrial");
      if (roll < 0.85) return createSkinDrop("milspec");
      if (roll < 0.95) return createSkinDrop("restricted");
      if (roll < 0.99) return createSkinDrop("classified");
      if (roll < 0.997) return createSkinDrop("covert");
      return createKnifeDrop();
    }

    function rollDrop() {
      const r = Math.random();
      if (r < 0.79) return createSkinDrop("milspec");
      if (r < 0.94) return createSkinDrop("restricted");
      if (r < 0.98) return createSkinDrop("classified");
      if (r < 0.99) return createSkinDrop("covert");
      return createKnifeDrop();
    }

    function getDropDisplayName(drop) {
      return drop.kind === "knife" ? `${drop.name} | ${drop.finish}` : drop.name;
    }

    function getItemValue(item) {
      const base = rarityMeta[item.rarity].value;
      if (item.kind === "knife") {
        return base + Math.round(item.cps * 120);
      }
      return base;
    }

    function updateEquippedKnife() {
      if (state.knifeInventory.length === 0) {
        state.equippedKnifeId = null;
        return;
      }
      let best = state.knifeInventory[0];
      for (const knife of state.knifeInventory) {
        if (knife.cps > best.cps) best = knife;
      }
      state.equippedKnifeId = best.id;
    }

    function updateEquippedKnifeHud() {
      const knife = getEquippedKnife();
      if (!knife) {
        el.equippedKnifeName.textContent = "None";
        el.equippedKnifeCps.textContent = "(+0.0 CPS)";
        return;
      }
      el.equippedKnifeName.textContent = `${knife.name} | ${knife.finish}`;
      el.equippedKnifeCps.textContent = `(+${knife.cps.toFixed(1)} CPS)`;
    }

    function showKnifeDropCelebration() {
      flashOverlay(el.knifeFlash);
      el.knifeDropOverlay.classList.remove("show");
      void el.knifeDropOverlay.offsetWidth;
      el.knifeDropOverlay.classList.add("show");
      for (let i = 0; i < 26; i += 1) {
        const p = document.createElement("div");
        p.className = "knife-particle";
        p.style.left = `${50 + (Math.random() - 0.5) * 20}%`;
        p.style.top = `${50 + (Math.random() - 0.5) * 14}%`;
        p.style.setProperty("--dx", `${(Math.random() - 0.5) * 280}px`);
        p.style.setProperty("--dy", `${(Math.random() - 0.5) * 210}px`);
        el.knifeParticleLayer.appendChild(p);
        setTimeout(() => p.remove(), 930);
      }
      setTimeout(() => el.knifeDropOverlay.classList.remove("show"), 1120);
    }

    function endRound() {
      initAudio();
      playRoundEndSound();
      const bonus = (300 + state.round * 25) * state.prestigeMultiplier;
      addMoney(bonus);
      showKillFeed(`<span class="weapon">ROUND BONUS</span> +$${formatMoney(bonus)}<span class="event"> objective complete</span>`);
      state.round += 1;
      state.timeLeft = 115;
      state.side = state.side === "CT" ? "T" : "CT";
      el.side.textContent = state.side;
    }

    function getRarityWeightForPreview(rarity) {
      if (rarity === "milspec") return 79.92;
      if (rarity === "restricted") return 15.98;
      if (rarity === "classified") return 3.2;
      if (rarity === "covert") return 0.64;
      return 0.26;
    }

    function getWear() {
      const wear = Math.random();
      const condition = wearConditions.find((c) => wear <= c.max) || wearConditions[wearConditions.length - 1];
      return { wear, condition };
    }

    function normalizeInventoryRef(ref) {
      if (!ref) return null;
      if (ref.type === "knife") {
        const knife = state.knifeInventory.find((k) => k.id === ref.id);
        return knife ? { ...knife, type: "knife", invId: knife.id } : null;
      }
      const skin = state.inventorySkins.find((s) => s.id === ref.id);
      return skin ? { ...skin, type: "skin", invId: skin.id } : null;
    }

    function removeInventoryRef(ref) {
      if (!ref) return;
      if (ref.type === "knife") {
        state.knifeInventory = state.knifeInventory.filter((k) => k.id !== ref.id);
      } else {
        state.inventorySkins = state.inventorySkins.filter((s) => s.id !== ref.id);
      }
    }

    function addWonTag(item, label = "WON IN FLIP") {
      return { ...item, wonTag: label };
    }

    function renderShopTabs() {
      return `
        <div class="shop-tabs">
          <button class="shop-tab ${state.activeTab === "shop" ? "active" : ""}" data-tab="shop">Shop</button>
          <button class="shop-tab ${state.activeTab === "cases" ? "active" : ""}" data-tab="cases">Cases</button>
          <button class="shop-tab ${state.activeTab === "knives" ? "active" : ""}" data-tab="knives">Knives</button>
          <button class="shop-tab ${state.activeTab === "inventory" ? "active" : ""}" data-tab="inventory">Inventory</button>
          <button class="shop-tab ${state.activeTab === "coinflip" ? "active" : ""}" data-tab="coinflip">Coin Flip</button>
        </div>
      `;
    }

    function renderMainShopTab() {
      const now = Date.now();
      const clickMultActive = now < state.flashActiveUntil;
      const cooldownLeft = Math.max(0, state.flashCooldownUntil - now);
      const directRows = knifeTypes
        .filter((knife) => directKnifePrices[knife.id])
        .map((knife) => {
          const price = directKnifePrices[knife.id];
          const canBuy = state.money >= price && !state.caseAnimating;
          return `
            <button class="knife-buy-btn" data-buy-knife="${knife.id}" ${canBuy ? "" : "disabled"}>
              ${knife.name} ($${formatMoney(price)})
            </button>
          `;
        }).join("");

      const upgradesHtml = upgrades.map((item) => {
        const owned = state.upgradesOwned[item.id];
        const affordable = state.money >= item.cost;
        const lockedClass = affordable ? "" : "locked";

        let extraAction = "";
        if (item.id === "flash") {
          const canActivate = owned > 0 && cooldownLeft === 0;
          const label = clickMultActive
            ? `Active ${Math.ceil((state.flashActiveUntil - now) / 1000)}s`
            : cooldownLeft > 0
              ? `Cooldown ${Math.ceil(cooldownLeft / 1000)}s`
              : "Activate";
          extraAction = `
            <button class="activate-btn" data-activate-flash="1" ${canActivate ? "" : "disabled"}>
              ${label}
            </button>
          `;
        }

        return `
          <article class="shop-item ${lockedClass}">
            <div class="shop-head">
              <div class="shop-name">${item.name}</div>
              <div class="shop-owned">Owned: ${owned}</div>
            </div>
            <div class="shop-effect">${item.effect}</div>
            <div class="shop-actions">
              <button class="buy-btn" data-buy-upgrade="${item.id}" ${affordable ? "" : "disabled"}>
                Buy ($${item.cost})
              </button>
              ${extraAction}
            </div>
          </article>
        `;
      }).join("");

      return `${upgradesHtml}<div class="subsection-title">Buy Knives</div>${directRows}`;
    }

    function renderCasesTab() {
      const caseCost = getCaseCost();
      const canBuyCase = state.money >= caseCost;
      const canOpen = state.caseInventory > 0 && !state.caseAnimating;

      return `
        <div class="case-box">
          <div class="case-row"><span class="label">Case Price</span><strong data-case-price>$${formatMoney(caseCost)}</strong></div>
          <div class="case-row"><span class="label">Cases Owned</span><strong data-case-owned>${state.caseInventory}</strong></div>
          <div class="case-row"><span class="label">Cases Opened</span><strong data-case-opened>${state.casesOpened}</strong></div>
          <button class="buy-case-btn" data-preview-case="1">View Contents</button>
          <button class="buy-case-btn" data-buy-case="1" ${canBuyCase ? "" : "disabled"}>Buy Case</button>
          <button class="open-case-btn" data-open-case="1" ${canOpen ? "" : "disabled"}>Open Case</button>
        </div>
        <p class="mini-note">Drop table: 79% Mil-Spec, 15% Restricted, 4% Classified, 1% Covert, 1% Knife.</p>
      `;
    }

    function renderKnivesTab() {
      if (state.knifeInventory.length === 0) {
        return `<div class="no-items">No knives yet. Open cases or buy one directly.</div>`;
      }
      const equippedId = state.equippedKnifeId;
      const sorted = [...state.knifeInventory].sort((a, b) => b.cps - a.cps);
      const totalKnifeCps = sorted.reduce((sum, knife) => sum + knife.cps, 0);
      const equipped = getEquippedKnife();

      return `
        <div class="mini-note">Best knife auto-equips. Equipped bonus: +${(equipped ? equipped.cps : 0).toFixed(1)} CPS (owned pool: +${totalKnifeCps.toFixed(1)}).</div>
        <div class="knife-collection">
          ${sorted.map((knife) => `
            <article class="knife-card rarity-knife">
              <div class="knife-glyph"></div>
              <div class="knife-main">
                <span class="name">${knife.name}</span>
                <span class="finish">${knife.finish}</span>
                <span class="cps">+${knife.cps.toFixed(1)} CPS</span>
              </div>
              ${knife.id === equippedId ? `<span class="equipped-badge">Equipped</span>` : ""}
            </article>
          `).join("")}
        </div>
      `;
    }

    function renderInventoryTab() {
      const entries = [
        ...state.inventorySkins,
        ...state.knifeInventory
      ].sort((a, b) => {
        const rarityDelta = rarityMeta[b.rarity].order - rarityMeta[a.rarity].order;
        if (rarityDelta !== 0) return rarityDelta;
        return getDropDisplayName(a).localeCompare(getDropDisplayName(b));
      });

      const totalValue = entries.reduce((sum, entry) => sum + getItemValue(entry), 0);

      if (entries.length === 0) {
        return `
          <div class="collection-summary">
            <span>Total Collection Value</span>
            <strong>$0.00</strong>
          </div>
          <div class="no-items">Inventory empty. Start opening cases.</div>
        `;
      }

      return `
        <div class="collection-summary">
          <span>Total Collection Value</span>
          <strong>$${formatMoney(totalValue)}</strong>
        </div>
        <div class="inventory-list">
          ${entries.map((entry) => {
            const meta = rarityMeta[entry.rarity];
            const name = getDropDisplayName(entry);
            const sub = entry.kind === "knife"
              ? `${meta.label} • +${entry.cps.toFixed(1)} CPS`
              : meta.label;
            return `
              <article class="inv-card ${meta.css}">
                ${entry.kind === "knife" ? `<div class="knife-glyph"></div>` : `<div style="width:32px;height:18px;border-radius:3px;background:${meta.color};opacity:0.75;"></div>`}
                <div class="inv-main">
                  <div class="inv-name">${name}</div>
                  <div class="inv-sub">${sub}${entry.wonTag ? ` • ${entry.wonTag}` : ""}</div>
                </div>
                <div class="inv-val">$${formatMoney(getItemValue(entry))}</div>
              </article>
            `;
          }).join("")}
        </div>
      `;
    }

    function buildCoinFlipPool() {
      const items = [];
      for (const skin of state.inventorySkins) {
        items.push({ type: "skin", id: skin.id, item: skin });
      }
      for (const knife of state.knifeInventory) {
        items.push({ type: "knife", id: knife.id, item: knife });
      }
      return items;
    }

    function renderCoinFlipTab() {
      const pool = buildCoinFlipPool();
      if (pool.length === 0) {
        return `
          <div class="no-items">You need items to flip! Open some cases first.</div>
          <button class="buy-case-btn" data-go-cases="1">Go To Cases</button>
        `;
      }
      return `
        <div class="case-box">
          <div class="case-row"><span class="label">Flip Record</span><strong>${state.coinFlip.wins}W / ${state.coinFlip.losses}L</strong></div>
          <div class="case-row"><span class="label">Select Wager Item</span><strong>${state.coinFlip.pendingWager ? getDropDisplayName(state.coinFlip.pendingWager.item) : "None"}</strong></div>
          <button class="open-case-btn" data-open-coinflip="1">Enter Gambling Den</button>
        </div>
        <div class="mini-note">Wager one item, pick CT/T, and let fate decide.</div>
      `;
    }

    function renderShopView() {
      let content = "";
      if (state.activeTab === "shop") content = renderMainShopTab();
      else if (state.activeTab === "cases") content = renderCasesTab();
      else if (state.activeTab === "knives") content = renderKnivesTab();
      else if (state.activeTab === "coinflip") content = renderCoinFlipTab();
      else content = renderInventoryTab();

      el.shop.innerHTML = `${renderShopTabs()}<div class="tab-content">${content}</div>`;
      updateShopButtons();
    }

    function updateShopButtons() {
      const money = state.money;

      for (const btn of el.shop.querySelectorAll("[data-buy-upgrade]")) {
        const item = upgrades.find((u) => u.id === btn.dataset.buyUpgrade);
        if (!item) continue;
        const affordable = money >= item.cost;
        btn.disabled = !affordable;
        const card = btn.closest(".shop-item");
        if (card) {
          card.classList.toggle("locked", !affordable);
          const ownedEl = card.querySelector(".shop-owned");
          if (ownedEl) ownedEl.textContent = `Owned: ${state.upgradesOwned[item.id]}`;
        }
      }

      const flashBtn = el.shop.querySelector("[data-activate-flash]");
      if (flashBtn) {
        const now = Date.now();
        const cooldownLeft = Math.max(0, state.flashCooldownUntil - now);
        const clickMultActive = now < state.flashActiveUntil;
        const canActivate = state.upgradesOwned.flash > 0 && cooldownLeft === 0;
        flashBtn.disabled = !canActivate;
        flashBtn.textContent = clickMultActive
          ? `Active ${Math.ceil((state.flashActiveUntil - now) / 1000)}s`
          : cooldownLeft > 0
            ? `Cooldown ${Math.ceil(cooldownLeft / 1000)}s`
            : "Activate";
      }

      const caseBuy = el.shop.querySelector("[data-buy-case]");
      if (caseBuy) {
        caseBuy.disabled = money < getCaseCost() || state.caseAnimating;
      }
      const caseOpen = el.shop.querySelector("[data-open-case]");
      if (caseOpen) {
        caseOpen.disabled = state.caseInventory <= 0 || state.caseAnimating;
      }
      const casePrice = el.shop.querySelector("[data-case-price]");
      if (casePrice) casePrice.textContent = `$${formatMoney(getCaseCost())}`;
      const caseOwned = el.shop.querySelector("[data-case-owned]");
      if (caseOwned) caseOwned.textContent = `${state.caseInventory}`;
      const caseOpened = el.shop.querySelector("[data-case-opened]");
      if (caseOpened) caseOpened.textContent = `${state.casesOpened}`;

      for (const btn of el.shop.querySelectorAll("[data-buy-knife]")) {
        const price = directKnifePrices[btn.dataset.buyKnife];
        btn.disabled = !price || money < price || state.caseAnimating;
      }

      const openCoin = el.shop.querySelector("[data-open-coinflip]");
      if (openCoin) {
        openCoin.disabled = buildCoinFlipPool().length === 0;
      }
    }

    function applyDrop(drop, sourceLabel) {
      if (drop.kind === "knife") {
        const knife = {
          ...drop,
          id: `${drop.knifeId}-${Date.now()}-${Math.floor(Math.random() * 100000)}`
        };
        state.knifeInventory.push(knife);
        updateEquippedKnife();
        updateEquippedKnifeHud();
        showKnifeDropCelebration();
        playKnifeDropSound();
        showKillFeed(`<span class="weapon">KNIFE DROPPED</span> ${knife.name}<span class="event"> ${knife.finish}</span>`);
      } else {
        state.inventorySkins.push({
          ...drop,
          id: `skin-${Date.now()}-${Math.floor(Math.random() * 100000)}`
        });
        const sourceLabelSafe = sourceLabel.replace(/[<>]/g, "");
        showKillFeed(`<span class="weapon">${sourceLabelSafe}</span> ${drop.name}<span class="event"> ${rarityMeta[drop.rarity].label}</span>`);
      }
      updatePrestigeHud();
      renderShopView();
    }

    function showCaseParticles(color = "#ffd56c", count = 32) {
      if (!el.caseParticles) return;
      for (let i = 0; i < count; i += 1) {
        const p = document.createElement("div");
        p.className = "case-particle";
        p.style.color = color;
        p.style.background = color;
        p.style.left = `${48 + (Math.random() - 0.5) * 15}%`;
        p.style.top = `${46 + (Math.random() - 0.5) * 12}%`;
        p.style.setProperty("--dx", `${(Math.random() - 0.5) * 680}px`);
        p.style.setProperty("--dy", `${(Math.random() - 0.5) * 420}px`);
        el.caseParticles.appendChild(p);
        setTimeout(() => p.remove(), 920);
      }
    }

    function revealCaseResult(drop, winnerEl) {
      const wearInfo = getWear();
      state.casePendingDrop = drop;
      state.casePendingWear = wearInfo;
      state.caseWinnerNode = winnerEl;
      el.revealDetails.classList.remove("hidden");
      el.caseActionRow.classList.remove("hidden");
      el.caseCloseBtn.classList.add("hidden");

      const rarity = rarityMeta[drop.rarity];
      el.revealItemName.textContent = getDropDisplayName(drop);
      el.revealItemMeta.textContent = `★ ${rarity.label}`;
      el.revealItemMeta.style.color = rarity.color;
      el.revealItemCps.textContent = drop.kind === "knife" ? `+${drop.cps.toFixed(1)} CPS` : "";
      el.revealWearLabel.textContent = wearInfo.condition.name;
      el.revealWearFill.style.width = `${Math.min(100, wearInfo.wear * 100)}%`;
      el.revealWearFill.style.background = wearInfo.condition.color;

      if (winnerEl) winnerEl.classList.add("win-zoom");
      const value = getItemValue(drop);
      el.sellDropBtn.textContent = `SELL FOR $${formatMoney(value)}`;
      el.openAnotherBtn.disabled = state.caseInventory <= 0;

      if (drop.rarity === "restricted") showCaseParticles("#9f6aff", 28);
      if (drop.rarity === "classified") {
        showCaseParticles("#df58ff", 36);
        flashOverlay(el.heFlash);
      }
      if (drop.rarity === "covert") {
        showCaseParticles("#ff6161", 44);
        flashOverlay(el.clickFlash);
      }
      if (drop.rarity === "knife") {
        showCaseParticles("#ffd56c", 60);
        showKnifeDropCelebration();
      }
    }

    function buildReel(drop) {
      const items = [];
      const winnerIndex = 28;
      const count = 38;
      for (let i = 0; i < count; i += 1) {
        items.push(i === winnerIndex ? drop : randomFillerDrop());
      }
      return { items, winnerIndex };
    }

    function startCaseReveal(drop, titleText = "Case Opening") {
      state.caseAnimating = true;
      initAudio();
      playCaseSpinSound();
      state.casePendingDrop = null;
      state.casePendingWear = null;
      state.caseWinnerNode = null;

      const { items, winnerIndex } = buildReel(drop);
      el.caseModalTitle.textContent = titleText.includes("Knife") ? "Premium Weapon Case" : "CS:GO Weapon Case";
      el.dropBanner.classList.remove("show");
      el.dropBanner.textContent = "OPENING...";
      el.revealDetails.classList.add("hidden");
      el.caseActionRow.classList.add("hidden");
      el.caseCloseBtn.classList.add("hidden");
      el.caseParticles.innerHTML = "";
      el.caseModal.classList.remove("hidden");
      el.caseModal.setAttribute("aria-hidden", "false");

      el.reelTrack.innerHTML = items.map((item, index) => {
        const meta = rarityMeta[item.rarity];
        const name = getDropDisplayName(item);
        return `
          <div class="reel-item ${meta.css}" data-reel-index="${index}">
            <div class="weapon-glyph"></div>
            <div>${name}</div>
            <div class="tiny">${meta.label}</div>
          </div>
        `;
      }).join("");

      el.reelTrack.style.transition = "none";
      el.reelTrack.style.transform = "translateX(0px)";
      el.reelTrack.style.filter = "blur(2px)";
      void el.reelTrack.offsetWidth;

      requestAnimationFrame(() => {
        el.reelTrack.style.transition = "transform 7s cubic-bezier(0.22, 1, 0.36, 1), filter 1.4s ease";
        const reelWindow = el.reelTrack.parentElement;
        const winnerEl = el.reelTrack.children[winnerIndex];
        const markerX = reelWindow.clientWidth / 2;
        const winnerCenter = winnerEl.offsetLeft + winnerEl.offsetWidth / 2;
        const jitter = (Math.random() - 0.5) * 14;
        const target = markerX - winnerCenter + jitter;
        el.reelTrack.style.transform = `translateX(${target}px)`;
        setTimeout(() => { el.reelTrack.style.filter = "blur(0px)"; }, 5400);
      });

      setTimeout(() => {
        const winnerEl = el.reelTrack.children[winnerIndex];
        winnerEl.classList.add("winner");
        el.dropBanner.textContent = drop.kind === "knife"
          ? `KNIFE DROPPED: ${drop.name} | ${drop.finish}`
          : `ITEM DROPPED: ${drop.name}`;
        el.dropBanner.classList.add("show");
        revealCaseResult(drop, winnerEl);
      }, 7000);
    }

    function closeCaseModal() {
      el.caseModal.classList.add("hidden");
      el.caseModal.setAttribute("aria-hidden", "true");
      state.caseAnimating = false;
      renderShopView();
    }

    function openCase() {
      if (state.caseAnimating || state.caseInventory <= 0) return;
      state.caseInventory -= 1;
      state.casesOpened += 1;
      const drop = rollDrop();
      startCaseReveal(drop, "Case Opening");
      updateShopButtons();
    }

    function buyCase(sourceButton = null) {
      const cost = getCaseCost();
      if (state.money < cost || state.caseAnimating) return;
      initAudio();
      playPurchaseSound();
      addMoney(-cost);
      state.caseInventory += 1;
      spawnPurchaseFloat(sourceButton, "+1 CASE");
      showKillFeed(`<span class="weapon">CASE</span> purchased <span class="event">$${formatMoney(cost)}</span>`);
      updatePrestigeHud();
      updateShopButtons();
    }

    function buyKnifeDirect(knifeId, sourceButton = null) {
      const price = directKnifePrices[knifeId];
      if (!price || state.money < price || state.caseAnimating) return;
      initAudio();
      playPurchaseSound();
      addMoney(-price);
      spawnPurchaseFloat(sourceButton, "KNIFE ROLL");
      const drop = createKnifeDrop(knifeId);
      startCaseReveal(drop, "Knife Purchase");
      updatePrestigeHud();
      updateShopButtons();
    }

    function updateRoundHud() {
      el.roundTime.textContent = formatTime(state.timeLeft);
      el.roundNum.textContent = `Round ${state.round}`;
      el.side.textContent = state.side;
      updateLedSpeed();
    }

    function updatePrestigeHud() {
      const rankIndex = getCurrentRankIndex();
      const rank = ranks[rankIndex];
      el.rankIcon.className = `rank-icon rank-${rankIndex}`;
      el.rankIcon.textContent = rank.short;
      el.rankName.textContent = rank.name;
      el.rankMulti.textContent = `Earnings Multiplier x${state.prestigeMultiplier.toFixed(2)}`;

      const price = getPrestigeCost();
      const canPrestige = state.money >= price;
      el.prestigeBtn.disabled = !canPrestige;
      el.prestigeBtn.textContent = canPrestige
        ? `Prestige Ready ($${formatMoney(price)})`
        : `Prestige (Need $${formatMoney(price)})`;
    }

    function purchaseUpgrade(id, sourceButton = null) {
      const item = upgrades.find((u) => u.id === id);
      if (!item || state.money < item.cost) return;
      initAudio();
      addMoney(-item.cost);
      state.upgradesOwned[id] += 1;
      playPurchaseSound();
      const cpsText = item.cps > 0 ? `+${item.cps.toFixed(1)} CPS` : "+UTILITY";
      spawnPurchaseFloat(sourceButton, cpsText);

      if (id === "he") {
        flashOverlay(el.heFlash);
      }

      showKillFeed(`<span class="weapon">${item.name}</span> bought <span class="event">+${item.cps || "utility"}</span>`);
      updatePrestigeHud();
      updateShopButtons();
    }

    function activateFlash(sourceButton = null) {
      const now = Date.now();
      if (state.upgradesOwned.flash <= 0 || now < state.flashCooldownUntil) return;
      state.upgradesOwned.flash -= 1;
      state.flashActiveUntil = now + 10000;
      state.flashCooldownUntil = now + 30000;
      initAudio();
      playTone(1300, 0.05, "triangle", 0.05);
      playTone(1600, 0.05, "triangle", 0.045, 0.05);
      spawnPurchaseFloat(sourceButton, "2X CLICKS");
      showKillFeed(`<span class="weapon">Flashbang</span> popped<span class="event"> 2x click power</span>`);
      updateShopButtons();
    }

    function onBombClick(evt) {
      initAudio();
      const gain = getClickValue();
      addMoney(gain);
      playClickSound();
      flashOverlay(el.clickFlash);

      const rect = el.bombBtn.getBoundingClientRect();
      const x = evt.clientX || rect.left + rect.width / 2;
      const y = evt.clientY || rect.top + rect.height / 2;
      spawnFloatingMoney(x, y, gain);
      spawnSparkBurst(x, y, "#73ddff", 12);
      spawnSparkBurst(rect.left + rect.width * 0.2, rect.top + rect.height * 0.46, "#8ff4ff", 8);
      state.bombFlashUntil = Date.now() + 130;

      el.bombBtn.classList.remove("pulse");
      void el.bombBtn.offsetWidth;
      el.bombBtn.classList.add("pulse");
      el.bombBtn.classList.remove("shake");
      void el.bombBtn.offsetWidth;
      el.bombBtn.classList.add("shake");
    }

    function tryPrestige() {
      const cost = getPrestigeCost();
      if (state.money < cost || state.caseAnimating) return;
      initAudio();
      playTone(390, 0.1, "triangle", 0.06);
      playTone(590, 0.12, "triangle", 0.055, 0.1);
      playTone(860, 0.16, "triangle", 0.05, 0.22);

      state.prestigeLevel += 1;
      state.prestigeMultiplier = 1 + state.prestigeLevel * 0.75;
      state.money = 0;
      state.displayedMoney = 0;
      state.round = 1;
      state.timeLeft = 115;
      state.side = "CT";
      state.flashActiveUntil = 0;
      state.flashCooldownUntil = 0;
      state.caseInventory = 0;
      state.casesOpened = 0;
      state.inventorySkins = [];
      state.knifeInventory = [];
      state.equippedKnifeId = null;
      state.activeTab = "shop";
      for (const key of Object.keys(state.upgradesOwned)) {
        state.upgradesOwned[key] = 0;
      }
      showKillFeed(`<span class="weapon">Prestige</span> promoted to <span class="event">${ranks[getCurrentRankIndex()].name}</span>`);
      updateEquippedKnifeHud();
      renderShopView();
      updateRoundHud();
      updatePrestigeHud();
    }

    function gameTick() {
      const passive = getCps();
      if (passive > 0) {
        addMoney(passive);
      }

      state.timeLeft -= 1;
      if (state.timeLeft <= 0) {
        endRound();
      }

      updateRoundHud();
      updatePrestigeHud();
      updateShopButtons();
      updateEquippedKnifeHud();
      drawBombDevice(performance.now());
    }

    function handleShopClick(event) {
      const button = event.target.closest("button");
      if (!button || !el.shop.contains(button)) return;

      if (button.dataset.tab) {
        state.activeTab = button.dataset.tab;
        renderShopView();
        return;
      }

      if (button.dataset.buyUpgrade) {
        purchaseUpgrade(button.dataset.buyUpgrade, button);
        return;
      }

      if (button.dataset.activateFlash) {
        activateFlash(button);
        return;
      }

      if (button.dataset.buyCase) {
        buyCase(button);
        return;
      }

      if (button.dataset.openCase) {
        openCase();
        return;
      }

      if (button.dataset.buyKnife) {
        buyKnifeDirect(button.dataset.buyKnife, button);
        return;
      }

      if (button.dataset.previewCase) {
        openCasePreview();
        return;
      }

      if (button.dataset.openCoinflip) {
        openCoinFlipModal();
        return;
      }

      if (button.dataset.goCases) {
        state.activeTab = "cases";
        renderShopView();
      }
    }

    function commitPendingCaseDrop() {
      if (!state.casePendingDrop) return;
      applyDrop(state.casePendingDrop, "CASE OPENING");
      state.casePendingDrop = null;
      state.casePendingWear = null;
      state.caseWinnerNode = null;
    }

    function sellPendingCaseDrop() {
      if (!state.casePendingDrop) return;
      const value = getItemValue(state.casePendingDrop);
      addMoney(value);
      showKillFeed(`<span class="weapon">SOLD</span> +$${formatMoney(value)}<span class="event"> instant cashout</span>`);
      state.casePendingDrop = null;
      state.casePendingWear = null;
      state.caseWinnerNode = null;
      updatePrestigeHud();
      closeCaseModal();
      renderShopView();
    }

    function openCasePreview() {
      const tiers = [
        ["milspec", skinPools.milspec],
        ["restricted", skinPools.restricted],
        ["classified", skinPools.classified],
        ["covert", skinPools.covert],
        ["knife", knifeTypes.map((k) => `${k.name} | random finish`)]
      ];
      el.casePreviewBody.innerHTML = tiers.map(([rarity, items], idx) => {
        const meta = rarityMeta[rarity];
        const odds = getRarityWeightForPreview(rarity).toFixed(2);
        return `
          <details ${idx === 0 ? "open" : ""}>
            <summary style="color:${meta.color}">${meta.label} — ${odds}%</summary>
            ${items.map((it) => `<div class="preview-item">${it}</div>`).join("")}
          </details>
        `;
      }).join("");
      el.casePreviewModal.classList.remove("hidden");
      el.casePreviewModal.setAttribute("aria-hidden", "false");
    }

    function closeCasePreview() {
      el.casePreviewModal.classList.add("hidden");
      el.casePreviewModal.setAttribute("aria-hidden", "true");
    }

    function getComparableOpponentItem(playerRef) {
      const value = getItemValue(playerRef.item);
      const pityBoost = state.coinFlip.lossStreak >= 3 ? 1.15 : 1;
      const targetMin = value * 0.95 * pityBoost;
      const targetMax = value * 1.35 * pityBoost;
      const rarityOrder = ["milspec", "restricted", "classified", "covert", "knife"];
      const all = [];
      for (const rarity of rarityOrder) {
        if (rarity === "knife") {
          const k = createKnifeDrop();
          all.push({ type: "knife", item: k });
        } else {
          all.push({ type: "skin", item: createSkinDrop(rarity) });
        }
      }
      const candidate = all.find((x) => {
        const v = getItemValue(x.item);
        return v >= targetMin && v <= targetMax;
      }) || all[all.length - 1];
      return candidate;
    }

    function renderCoinflipHistory() {
      el.coinflipHistory.innerHTML = state.coinFlip.history.map((h) => `<span class="flip-dot ${h ? "win" : "loss"}"></span>`).join("");
      el.coinflipRecord.textContent = `Flips: ${state.coinFlip.wins}W / ${state.coinFlip.losses}L`;
    }

    function renderCoinflipStep() {
      const pool = buildCoinFlipPool();
      if (pool.length === 0) {
        el.coinflipStep.innerHTML = `
          <div class="no-items">You need items to flip! Open some cases first.</div>
          <button class="buy-case-btn" data-go-cases-modal="1">Go To Cases</button>
        `;
        return;
      }

      const wager = state.coinFlip.pendingWager;
      const opponent = state.coinFlip.opponent;
      const side = state.coinFlip.playerSide;
      el.coinflipStep.innerHTML = `
        <div class="coinflip-wrap">
          <div class="mini-note">Pick an item to wager.</div>
          <div class="flip-grid">
            ${pool.map((entry) => {
              const val = getItemValue(entry.item);
              const active = wager && wager.id === entry.id && wager.type === entry.type;
              return `
                <button class="flip-item ${active ? "active" : ""}" data-flip-select="${entry.type}:${entry.id}">
                  <div>${getDropDisplayName(entry.item)}</div>
                  <div class="inv-sub">$${formatMoney(val)}</div>
                  ${active ? `<span class="flip-badge">Wagered</span>` : ""}
                </button>
              `;
            }).join("")}
          </div>
          <button class="flip-btn" data-flip-find ${wager ? "" : "disabled"}>${state.coinFlip.searching ? "Finding opponent..." : "Find Opponent"}</button>
          ${opponent ? `
            <div class="flip-opponent">
              <div><strong>${opponent.name}</strong> wagered ${getDropDisplayName(opponent.item)}</div>
              <div class="inv-sub">Value: $${formatMoney(getItemValue(opponent.item))}</div>
            </div>
            <div class="flip-controls">
              <button class="flip-btn ct" data-flip-side="CT">CT SIDE</button>
              <button class="flip-btn t" data-flip-side="T">T SIDE</button>
              <button class="flip-btn" data-flip-start ${side ? "" : "disabled"}>Flip Coin</button>
            </div>
          ` : ""}
        </div>
      `;
    }

    function openCoinFlipModal() {
      el.coinflipModal.classList.remove("hidden");
      el.coinflipModal.setAttribute("aria-hidden", "false");
      state.coinFlip.pendingWager = null;
      state.coinFlip.opponent = null;
      state.coinFlip.playerSide = null;
      state.coinFlip.searching = false;
      renderCoinflipHistory();
      renderCoinflipStep();
    }

    function closeCoinFlipModal() {
      el.coinflipModal.classList.add("hidden");
      el.coinflipModal.setAttribute("aria-hidden", "true");
      renderShopView();
    }

    function canWager(entry) {
      if (entry.type !== "knife") return true;
      if (state.knifeInventory.length <= 1) return false;
      return true;
    }

    function onCoinflipSelect(encoded) {
      const [type, id] = encoded.split(":");
      const pool = buildCoinFlipPool();
      const entry = pool.find((e) => e.type === type && e.id === id);
      if (!entry) return;
      if (!canWager(entry)) {
        showKillFeed(`<span class="weapon">WARNING</span> You can't wager your only knife!`);
        return;
      }
      state.coinFlip.pendingWager = { type, id, item: entry.item };
      state.coinFlip.opponent = null;
      state.coinFlip.playerSide = null;
      renderCoinflipStep();
    }

    function findCoinflipOpponent() {
      if (!state.coinFlip.pendingWager || state.coinFlip.searching) return;
      state.coinFlip.searching = true;
      renderCoinflipStep();
      setTimeout(() => {
        const oppItem = getComparableOpponentItem(state.coinFlip.pendingWager);
        state.coinFlip.opponent = {
          name: randomFrom(cpuNames),
          item: oppItem.item,
          type: oppItem.type
        };
        state.coinFlip.searching = false;
        renderCoinflipStep();
      }, 1500);
    }

    function startCoinflip() {
      const wager = state.coinFlip.pendingWager;
      const opponent = state.coinFlip.opponent;
      const side = state.coinFlip.playerSide;
      if (!wager || !opponent || !side) return;

      const coinCard = document.createElement("div");
      coinCard.className = "coin-card";
      coinCard.innerHTML = `
        <div class="mini-note">Flipping...</div>
        <div id="live-coin" class="coin-coin">${side}</div>
        <div id="coin-result-text" class="coin-result"></div>
      `;
      el.coinflipStep.innerHTML = "";
      el.coinflipStep.appendChild(coinCard);
      const liveCoin = document.getElementById("live-coin");
      const resultText = document.getElementById("coin-result-text");

      let finalWinChance = 0.5;
      const playerVal = getItemValue(wager.item);
      const oppVal = getItemValue(opponent.item);
      if (wager.type !== "knife" && oppVal > playerVal) finalWinChance = 0.55;
      const isWin = Math.random() < finalWinChance;
      const resultSide = isWin ? side : (side === "CT" ? "T" : "CT");

      liveCoin.style.transition = "transform 5.2s cubic-bezier(0.2, 1, 0.22, 1)";
      liveCoin.style.transform = "rotateY(3960deg)";
      setTimeout(() => {
        liveCoin.classList.toggle("t-side", resultSide === "T");
        liveCoin.textContent = resultSide;
        if (isWin) {
          flashOverlay(el.heFlash);
          resultText.className = "coin-result win";
          resultText.textContent = "YOU WIN!";
          state.coinFlip.wins += 1;
          state.coinFlip.lossStreak = 0;
          const wonOpp = addWonTag({
            ...opponent.item,
            id: `${opponent.type}-won-${Date.now()}-${Math.floor(Math.random() * 9999)}`
          });
          if (opponent.type === "knife") state.knifeInventory.push(wonOpp);
          else state.inventorySkins.push(wonOpp);
          updateEquippedKnife();
        } else {
          flashOverlay(el.clickFlash);
          resultText.className = "coin-result loss";
          resultText.textContent = "YOU LOSE";
          state.coinFlip.losses += 1;
          state.coinFlip.lossStreak += 1;
          removeInventoryRef(wager);
          updateEquippedKnife();
        }
        state.coinFlip.history.unshift(isWin);
        state.coinFlip.history = state.coinFlip.history.slice(0, 10);
        updateEquippedKnifeHud();
        renderCoinflipHistory();
        setTimeout(() => {
          state.coinFlip.pendingWager = null;
          state.coinFlip.opponent = null;
          state.coinFlip.playerSide = null;
          renderCoinflipStep();
          renderShopView();
        }, 1900);
      }, 5200);
    }

    function handleCoinflipClick(event) {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.flipSelect) {
        onCoinflipSelect(button.dataset.flipSelect);
        return;
      }
      if (button.dataset.flipFind) {
        findCoinflipOpponent();
        return;
      }
      if (button.dataset.flipSide) {
        state.coinFlip.playerSide = button.dataset.flipSide;
        renderCoinflipStep();
        return;
      }
      if (button.dataset.flipStart) {
        startCoinflip();
        return;
      }
      if (button.dataset.goCasesModal) {
        closeCoinFlipModal();
        state.activeTab = "cases";
        renderShopView();
      }
    }

    function initEvents() {
      document.addEventListener("pointerdown", initAudio, { once: true });
      el.bombBtn.addEventListener("pointerdown", (evt) => {
        evt.preventDefault();
        onBombClick(evt);
      });

      el.bombBtn.addEventListener("touchstart", (evt) => {
        evt.preventDefault();
        const t = evt.changedTouches[0];
        if (t) onBombClick(t);
      }, { passive: false });
      el.bombBtn.addEventListener("pointerenter", () => { bombHover = true; });
      el.bombBtn.addEventListener("pointerleave", () => { bombHover = false; });

      el.prestigeBtn.addEventListener("click", tryPrestige);
      el.shop.addEventListener("click", handleShopClick);
      el.caseCloseBtn.addEventListener("click", closeCaseModal);
      el.addInvBtn.addEventListener("click", () => {
        commitPendingCaseDrop();
        closeCaseModal();
      });
      el.openAnotherBtn.addEventListener("click", () => {
        commitPendingCaseDrop();
        if (state.caseInventory > 0) {
          openCase();
        } else {
          closeCaseModal();
        }
      });
      el.sellDropBtn.addEventListener("click", sellPendingCaseDrop);
      el.previewCloseBtn.addEventListener("click", closeCasePreview);
      el.coinflipCloseBtn.addEventListener("click", closeCoinFlipModal);
      el.coinflipStep.addEventListener("click", handleCoinflipClick);
    }

    function init() {
      updateRoundHud();
      updatePrestigeHud();
      updateEquippedKnifeHud();
      renderShopView();
      if (el.bombCanvas) {
        bombCtx = el.bombCanvas.getContext("2d");
        const drawLoop = (ts) => {
          drawBombDevice(ts);
          requestAnimationFrame(drawLoop);
        };
        requestAnimationFrame(drawLoop);
      }
      initEvents();
      animateMoneyHud();

      setInterval(gameTick, 1000);
      setInterval(() => {
        showKillFeed(randomKillMessage());
      }, 5600);
    }

    init();
  </script>

</body>
</html>
