<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dumbdollars Hero Banner</title>
  <desc id="desc">Marketing banner for golf apparel and mainstream cologne products.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f2f" />
      <stop offset="55%" stop-color="#132f45" />
      <stop offset="100%" stop-color="#0f4c5c" />
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8be9fd" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8be9fd" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6c35c" />
      <stop offset="100%" stop-color="#f6e6a7" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#glow)" />

  <!-- Decorative circles -->
  <circle cx="1360" cy="170" r="130" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="1450" cy="250" r="48" fill="#ffffff" fill-opacity="0.15" />
  <circle cx="1320" cy="290" r="24" fill="#ffffff" fill-opacity="0.15" />

  <!-- Golf ball motif -->
  <g transform="translate(1180 510)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="150" fill="#f2f5f7" />
    <g fill="#dbe2e8">
      <circle cx="-52" cy="-62" r="10" />
      <circle cx="-20" cy="-80" r="10" />
      <circle cx="12" cy="-78" r="10" />
      <circle cx="44" cy="-64" r="10" />
      <circle cx="-76" cy="-30" r="10" />
      <circle cx="-44" cy="-26" r="10" />
      <circle cx="-12" cy="-22" r="10" />
      <circle cx="20" cy="-20" r="10" />
      <circle cx="52" cy="-28" r="10" />
      <circle cx="-84" cy="8" r="10" />
      <circle cx="-52" cy="10" r="10" />
      <circle cx="-20" cy="14" r="10" />
      <circle cx="12" cy="18" r="10" />
      <circle cx="44" cy="10" r="10" />
      <circle cx="76" cy="6" r="10" />
      <circle cx="-64" cy="44" r="10" />
      <circle cx="-32" cy="48" r="10" />
      <circle cx="0" cy="52" r="10" />
      <circle cx="32" cy="48" r="10" />
      <circle cx="64" cy="42" r="10" />
    </g>
  </g>

  <!-- Cologne bottle motif -->
  <g transform="translate(980 545)" filter="url(#softShadow)">
    <rect x="-85" y="-165" width="170" height="260" rx="18" fill="#0e1b2a" stroke="#8be9fd" stroke-opacity="0.5" />
    <rect x="-45" y="-205" width="90" height="40" rx="8" fill="#192d42" />
    <rect x="-22" y="-228" width="44" height="24" rx="6" fill="#2b3f55" />
    <rect x="-58" y="-76" width="116" height="72" rx="10" fill="#1a3146" />
    <text x="0" y="-40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#f5f8ff" letter-spacing="1.5">SIGNATURE</text>
    <text x="0" y="-14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#f5f8ff" letter-spacing="1.5">SCENT</text>
  </g>

  <!-- Main copy -->
  <g transform="translate(110 210)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#9fdaf0" letter-spacing="3">
      DUMBDOLLARS
    </text>
    <text x="0" y="110" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800" fill="#ffffff">
      Drive the Day.
    </text>
    <text x="0" y="205" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800" fill="url(#accent)">
      Own the Night.
    </text>
    <text x="0" y="285" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#d7e7f2">
      Premium Golf Fits + Mainstream Colognes
    </text>
    <text x="0" y="338" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#d7e7f2">
      Style, confidence, and everyday wins.
    </text>
  </g>

  <!-- CTA button -->
  <g transform="translate(110 620)" filter="url(#softShadow)">
    <rect x="0" y="0" width="430" height="86" rx="14" fill="#ffffff" />
    <text x="215" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#112235">
      SHOP NEW ARRIVALS
    </text>
  </g>
</svg>
